rules:
  - "CRITICAL — Page positioning: the section LIST response contains splitContainers with page-absolute coordinates for each page region. Use splitContainers to construct the page skeleton (position:absolute with exact coordinates). Do NOT guess or stack with flex."
  - "CRITICAL — Sidebar columns: render ALL sidebar levels as persistent columns at splitContainers positions. Do NOT hide or toggle them."
  - token filed must be generated as a variable (colors, shadows, fonts, etc.) and the token field must be displayed in the comment
  - "CRITICAL — TYPOGRAPHY FROM THE STYLES TABLE: each TEXT node's `text[0].font` is a style id; read `dsl.styles[...].value` and use its `family`/`size`/`weight`/`lineHeight`/`letterSpacing` verbatim (never guess font sizes from token or layer names). `lineHeight` is a multiplier (`\"1.4\"`; a legacy `\"140\"` means 140% → divide by 100). `letterSpacing: \"auto\"` → omit. Do NOT normalize/round the design's font values."
  - componentDocumentLinks is a list of frontend component documentation links. When it exists and is not empty, use mcp__getComponentLink to get the documentation.
  - ""
  - "CRITICAL — `_svgUnavailable: true` PATH nodes have no vector data and no svgShortKey; approximate them with simple CSS/inline SVG sized to their layoutStyle. NEVER reuse another node's svgShortKey."
  - "CRITICAL — SVG FROM PATH NODES: Every PATH node has a `svgShortKey` field. The SVG markup is NOT in the DSL. Place `@@SVG:{svgShortKey}@@` where each icon goes, then call `mcp__applyDesign` to inject real SVG. NEVER hand-write `<path d=\"...\">`."
  - "CRITICAL — RENDER EVERY PATH NODE ICON: do NOT skip any PATH node. Each PATH node must have a `@@SVG:{svgShortKey}@@` placeholder in your code. Table headers have sort/filter/search icons, sidebar menu items have PATH icons, pagination has prev/next/refresh/dropdown icons. A header cell with only plain text is a fidelity defect. After all placeholders are placed, call `mcp__applyDesign`."
  - ""
  - "CRITICAL — OMIT _placeholder TEXT: any TEXT node with `_placeholder: true` is component-library boilerplate — the node name equals its text content (e.g. name=\"Hillstone Design\" and text=\"Hillstone Design\"). These appear in rowTexts[] with `_placeholder: true` — skip them. allTexts does NOT include placeholder strings. EXCEPTION: if _placeholder TEXT is the ONLY text in its section, it may be real content with an auto-generated name — evaluate carefully."
  - "CRITICAL — CLOSED-SET TEXT: the section LIST response carries `rootMetadata.allTexts` — the complete whitelist of real text strings in this design. Any visible string NOT in allTexts is either placeholder (omit) or hallucination (delete). allTexts EXCLUDES _placeholder boilerplate."
  - ""
  - "CRITICAL — INSTANCE fill color: when an INSTANCE has both `fill` and `_color`, use `_color` directly as the CSS value. Do NOT guess colors from _variantProps semantics."
  - "CRITICAL — INSTANCE _variantProps: compare across siblings for selected/hovered/disabled. Active class MUST match DSL variant state, NOT a default index."
  - "CRITICAL — Render count = structureSiblingCount: if ssc=1, that single instance IS complete — do NOT fabricate extra rows/items."
  - "CRITICAL — BACKGROUND FROM splitContainers: splitContainers[].background IS the exact CSS background-color. Copy verbatim, no changes."
  - "CRITICAL — FRAME/GROUP opacity: translate to rgba() on background only, NOT CSS opacity (would make children translucent)."
  - "CRITICAL — layoutStyle.constraint vs minWidth/minHeight/maxWidth/maxHeight are UNRELATED: min/max are the auto-layout panel's size limits; constraint is the anchoring rule when the PARENT resizes. constraint.horizontal in LEFT/RIGHT/LEFT_RIGHT/CENTER/SCALE, constraint.vertical in TOP/BOTTOM/TOP_BOTTOM/CENTER/SCALE — the name IS the readable enum. Never derive min/max CSS from constraint."
  - "CRITICAL — layoutStyle.preserveRatio: true means the node keeps its width:height ratio when scaled; preserve it (e.g. aspect-ratio). The field is ABSENT (not false) when the ratio is not locked — absence means free resizing, NOT false."
  - "CRITICAL — Blend modes are THREE independent levels; CSS mix-blend-mode is NOT a faithful equivalent. (1) node level: `blendMode` on the node (sibling of layoutStyle) → mix-blend-mode on that element. (2) fill level: `styles[\"paint_*\"].blendMode` belongs to the FILL only — apply to an overlay background element, NOT the node's text/children. (3) effect level: `styles[\"effect_*\"].blendModes` is keyed by INDEX into that style's `value` array — `blendModes[2]` belongs to `value[2]`. NEVER concatenate these into the shadow/filter CSS string: mix-blend-mode is a separate CSS property. All three absent by default (PassThrough/Normal omitted) — do NOT emit mix-blend-mode: normal."
  - "CRITICAL — Masks: `mask` on a node marks it as a MASK layer (`'alpha'` / `'outline'`; no other values exist). `maskVisible: true` means the mask layer itself is ALSO rendered as visible content (Figma \"show mask\") — render its geometry as a normal element AND apply the mask effect to it and its following siblings. Absence means NOT set (the DSL omits defaults): missing `mask` = normal element; missing `maskVisible` = clip-only mask. Do NOT convert `mask:'outline'` into `overflow:hidden` yourself — keep mask structure and let the masking relationship drive clipping."
  - "CRITICAL — rowTexts: each entry has parentType/parentName for context and `_placeholder: true` if boilerplate. Use parentName to place text correctly; skip _placeholder entries."
  - Render ALL nodes recursively. Section root layoutStyle.width = section width. Do not call mcp__getDsl after completing section workflow.
