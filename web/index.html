    </div>`}
  </div>`;
}

// 全部收益抽屉（hist）：右侧滑出。持仓/订单/已实现收益/可用资金均随回放视点截断（as_of）；
// 持仓 tab 价格锚定视点：选了结束日期用截止日收盘（dayPx 与卡片同源），无则批量报价实时算
// 标题右侧灰色小字显示筛选结束日期（即回放视点），未选结束日期时不显示
function TotalDrawer({ holdings, quotes, dayPx, dend, cards, orders, realizedTotal, account, onDelOrder, onDelHolding, onClearOrders, onClose }) {
  const [tab, setTab] = useState("hold");
  useEffect(() => {  // Esc 关闭，同时锁住页面滚动
    const onKey = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [onClose]);
  const names = {};
  cards.forEach(c => { names[c.symbol] = c.name; });
  // 价格锚定回放视点：选了结束日期只用截止日收盘（dayPx 与卡片同源），未取到/无数据显示 —，绝不回落实时报价
  // （历史视点混入当前价格会算出假盈亏）；无结束日期用实时报价。全部持仓行都列出，
  // 汇总只统计有价的行；全部收益% = 总盈亏 / 总成本（与原汇总条口径一致）
  // 「买入时间」列显示最后一次买入（仅展示层口径：从订单流水取每标的最近一笔买入；后端 buy_ts 仍为建仓首笔不动）
  const lastBuy = {};
  orders.forEach(o => { if (o.side === "buy" && (!lastBuy[o.symbol] || o.ts > lastBuy[o.symbol])) lastBuy[o.symbol] = o.ts; });
  const rows = Object.entries(holdings).map(([s, h]) => ({ s, ...h, p: dayPx[s] ? dayPx[s].price : (dend ? null : (quotes[s] ? quotes[s].price : null)) }));
  const valid = rows.filter(x => x.p != null);
  const tCost = valid.reduce((a, x) => a + x.shares * x.cost, 0);
  const tMv = valid.reduce((a, x) => a + x.shares * x.p, 0);
  const tFloat = tMv - tCost;                // 浮动盈亏
  const tPl = tFloat + realizedTotal;        // 全部收益 = 浮动 + 已实现（卖出落袋）
  // 全部收益% 分母=本金：已实现收益对应的本金已卖出回笼、不在当前持仓成本里，只除 tCost 会把已卖部分基数丢掉、百分比虚大数倍
  const tPct = account && account.capital ? tPl / account.capital * 100 : (tCost ? tPl / tCost * 100 : 0);
  return html`<div className="drawer-mask" onClick=${onClose}>
    <div className="drawer" onClick=${e => e.stopPropagation()}>
      <div className="dhd">
        <span className="dtitle">全部收益${dend && html`<i>${dend}</i>`}</span>
        <button className="dclose" title="关闭" onClick=${onClose}>✕</button>
      </div>
      <div className="dtabs">
        <button className=${tab === "hold" ? "on" : ""} onClick=${() => setTab("hold")}>持仓(${Object.keys(holdings).length})</button>
        <button className=${tab === "order" ? "on" : ""} onClick=${() => setTab("order")}>订单</button>
      </div>
      <div className="dbody">
        ${tab === "hold" ? html`<div>
          <div className="dtot">
            <span>全部收益<b className=${tPl >= 0 ? "up" : "dn"}>${tPl >= 0 ? "+" : ""}${tPl.toFixed(2)}</b><span className=${tPct >= 0 ? "up" : "dn"}>(${tPct >= 0 ? "+" : ""}${tPct.toFixed(2)}%)</span></span>
            ${realizedTotal !== 0 && html`<span>已实现<b className=${realizedTotal >= 0 ? "up" : "dn"}>${realizedTotal >= 0 ? "+" : ""}${realizedTotal.toFixed(2)}</b></span>`}
            ${account && html`<span>总资产<b>${(account.cash + tMv).toFixed(2)}</b></span><span>可用资金<b>${account.cash.toFixed(2)}</b></span>`}
            <span>总市值<b>${tMv.toFixed(2)}</b></span>
            <span>总成本<b>${tCost.toFixed(2)}</b></span>
            ${orders.length > 0 && html`<button className="dclr" title="清空历史回放+实时跟随两视图全部买卖流水：收益归0、总资产/可用资金回到本金（不可恢复）" onClick=${onClearOrders}>清空收益</button>`}
          </div>
          <div className="hhd"><span>名称</span><span>现价</span><span>成本</span><span>数量</span><span title="A股当日买入的份额次日可卖（T+1）">可卖</span><span>市值</span><span>盈亏金额</span><span>盈亏%</span><span>买入时间</span><span>删除</span></div>
          ${rows.map(x => {
            const pl = x.p != null ? (x.p - x.cost) * x.shares : null;
            const plp = x.p != null && x.cost ? (x.p - x.cost) / x.cost * 100 : null;
            return html`<div className="hrow" key=${x.s}>
              <span className="hnm">${names[x.s] || x.name || x.s}<i>${x.s}</i></span>
              <span>${x.p != null ? x.p.toFixed(3) : "—"}</span>
              <span>${x.cost.toFixed(3)}</span>
              <span>${x.shares}</span>
              <span>${x.sellable != null ? x.sellable : x.shares}</span>
              <span>${x.p != null ? (x.shares * x.p).toFixed(2) : "—"}</span>
              <span className="hpl">${pl != null ? html`<b className=${pl >= 0 ? "up" : "dn"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b>` : "—"}</span>
              <span className="hpp">${plp != null ? html`<span className=${plp >= 0 ? "up" : "dn"}>${plp >= 0 ? "+" : ""}${plp.toFixed(2)}%</span>` : "—"}</span>
              <span className="hbt">${(lastBuy[x.s] || x.buy_ts) ? html`${(lastBuy[x.s] || x.buy_ts).slice(0, 10)}<i>${(lastBuy[x.s] || x.buy_ts).slice(11)}</i>` : "—"}</span>
              <button className="odel" title="删除此持仓：该标的全部买卖流水一并清除" onClick=${() => onDelHolding(x.s)}>✕</button>
            </div>`;
          })}
        </div>` : html`<div>
          ${orders.length ? html`<button className="dclr" title="清空历史回放+实时跟随两视图全部买卖流水：持仓清零、收益归0、总资产/可用资金回到本金（不可恢复）" onClick=${onClearOrders}>清空全部订单</button>
            ${orders.map(o => html`<div className="orow" key=${o.id}>
            <b className=${"act " + (o.side === "buy" ? "up" : "dn")}>${o.side === "buy" ? "买入" : "卖出"}</b>
            <span className="onm">${o.name}</span>
            <span className="ocode">${o.symbol}</span>
            <span className="opx">${o.price.toFixed(2)}元</span>
            <span className="oqt">${+o.qty}股</span>
            <span className="odt">${o.ts}</span>
            <span className="opl">${o.realized != null && html`共收益<b className=${o.realized >= 0 ? "up" : "dn"}>${o.realized >= 0 ? "+" : ""}${o.realized.toFixed(2)}</b>元`}</span>
            <button className="odel" title="删除此笔记录" onClick=${() => onDelOrder(o.id)}>✕</button>
          </div>`)}
          <div className="dnote">买入行的收益体现在持仓盈亏中；删除任一记录后持仓与收益自动重算</div>`
          : html`<div className="dnote">暂无交易记录，去卡片点「买入」模拟一笔</div>`}
        </div>`}
      </div>
    </div>
  </div>`;
}

const GTABS = [["min", "分时"], ["day5", "5日"], ["m5", "5分"], ["m30", "30分"], ["m60", "60分"], ["day", "日K"], ["other", "其他"]];
const PAGES = [["hist", "历史模拟仓"], ["live", "实时跟随仓"]];  // 页面级Tab：hist=历史模拟仓（原表、原class）；live=实时跟随仓（表加 _live、class 加 -live，实现见下方克隆区）

// 日期选择器（历史仓）：点按钮弹出自绘日历浮层——原生 date 输入无法把特定日期置灰禁用；
// 周六/周日、以及晚于今天的未来日期一律置灰且不可点（截止日最晚到当下），value 为空时按钮显示占位文字，
// 可选 min（最早可选日）：传了就把更早的日期/月份/年份一律置灰且不可点，并禁止前翻超出该月（回测用行情源可回溯起点）
// 选中日期回调 onPick("YYYY-MM-DD") 并收起；
// 点标题「2026年9月」上翻到选月视图、再点「2026年」上翻到选年视图（‹/›：日视图翻月、月视图翻年、年视图翻12年）
function DP({ value, onPick, title, min }) {
  const [open, setOpen] = useState(false);
  const [vym, setVym] = useState("");       // 面板浏览中的月份 YYYY-MM（每次打开按 value/今天重置）
  const [view, setView] = useState("day");  // day=日历 / month=选月 / year=选年
  const pad2 = n => String(n).padStart(2, "0");
  const d0 = new Date(), today = `${d0.getFullYear()}-${pad2(d0.getMonth() + 1)}-${pad2(d0.getDate())}`;
  const lo = min || "";  // 最早可选日（行情源可回溯起点）：空=不限；更早的日期置灰不可点
  const openCal = () => {  // 打开时定位到 value；value 早于下限（或未选）则落在下限/今天
    const base = value && (!lo || value >= lo) ? value : (lo || today);
    setVym(base.slice(0, 7)); setView("day"); setOpen(true);
  };
  const shift = delta => {  // 上一页/下一页（跨年由 Date 归一）：日视图翻1月，月视图翻1年，年视图翻12年
    const [y, m] = vym.split("-").map(Number);
    const t = view === "year" ? new Date(y + delta * 12, m - 1, 1)
      : new Date(y, m - 1 + (view === "month" ? delta * 12 : delta), 1);
    const nv = `${t.getFullYear()}-${pad2(t.getMonth() + 1)}`;
    if (nv > today.slice(0, 7)) return;  // 未来月份/年份不再后翻：截止日不得晚于今天
    if (lo && nv < lo.slice(0, 7)) return;  // 早于可回溯起点的月份/年份不再前翻
    setVym(nv);
  };
  let panel = null;
  if (open) {
    const [y, m] = vym.split("-").map(Number);
    let head, body;
    if (view === "year") {  // 选年：以浏览年为中心前后各推，点某年回选月视图
      head = html`<b>${y - 5}年 - ${y + 6}年</b>`;
      body = html`<div className="dp-ym">
        ${Array.from({ length: 12 }, (_, i) => { const yy = y - 5 + i;
          const fut = String(yy) > today.slice(0, 4);  // 未来年份：禁用置灰
          const past = !!lo && String(yy) < lo.slice(0, 4);  // 早于可回溯起点：禁用置灰
          const cls = "dp-d" + (String(yy) === value.slice(0, 4) ? " sel" : "") + (String(yy) === today.slice(0, 4) ? " td" : "");
          return html`<button key=${yy} className=${cls} disabled=${fut || past}
            onClick=${() => { setVym(`${yy}-${pad2(m)}`); setView("month"); }}>${yy}</button>`; })}
      </div>`;
    } else if (view === "month") {  // 选月：点某月回日历视图
      head = html`<b onClick=${() => setView("year")}>${y}年</b>`;
      body = html`<div className="dp-ym">
        ${Array.from({ length: 12 }, (_, i) => { const ym = `${y}-${pad2(i + 1)}`;
          const fut = ym > today.slice(0, 7);  // 未来月份：禁用置灰
          const past = !!lo && ym < lo.slice(0, 7);  // 早于可回溯起点的月份：禁用置灰
          const cls = "dp-d" + (ym === value.slice(0, 7) ? " sel" : "") + (ym === today.slice(0, 7) ? " td" : "");
          return html`<button key=${ym} className=${cls} disabled=${fut || past}
            onClick=${() => { setVym(ym); setView("day"); }}>${i + 1}月</button>`; })}
      </div>`;
    } else {  // 日历：周六/周日置灰且不可点
      head = html`<b onClick=${() => setView("month")}>${y}年${m}月</b>`;
      const first = (new Date(y, m - 1, 1).getDay() + 6) % 7;  // 当月1号前的空位数（周一为首列）
      const days = new Date(y, m, 0).getDate();
      body = html`<div>
        <div className="dp-wk">${["一", "二", "三", "四", "五", "六", "日"].map((w, i) => html`<span key=${i} className=${i > 4 ? "w" : ""}>${w}</span>`)}</div>
        <div className="dp-grid">
          ${Array.from({ length: first }, (_, i) => html`<span key=${ "b" + i }></span>`)}
          ${Array.from({ length: days }, (_, i) => {
            const ds = `${y}-${pad2(m)}-${pad2(i + 1)}`;
            const wk = (first + i) % 7 >= 5;  // 周六/周日：禁用置灰
            const fut = ds > today;            // 未来日期：禁用置灰（截止日最晚到当下）
            const past = !!lo && ds < lo;      // 早于可回溯起点：禁用置灰
            const cls = "dp-d" + (ds === value ? " sel" : "") + (ds === today ? " td" : "");
            return html`<button key=${ds} className=${cls} disabled=${wk || fut || past}
              onClick=${() => { onPick(ds); setOpen(false); }}>${i + 1}</button>`;
          })}
        </div>
      </div>`;
    }
    panel = html`<span>
      <div className="dp-mask" onClick=${() => setOpen(false)}></div>
      <div className="dp-panel">
        <div className="dp-nav">
          <button onClick=${() => shift(-1)}>‹</button>
          ${head}
          <button onClick=${() => shift(1)}>›</button>
        </div>
        ${body}
      </div>
    </span>`;
  }
  return html`<span className="dp">
    <button className=${"dp-btn" + (value ? "" : " ph")} title=${title} onClick=${() => open ? setOpen(false) : openCal()}>${value || title}</button>
    ${panel}
  </span>`;
}


// ==================== 实时跟随仓（live）克隆区 ====================
// CardLive / TotalDrawerLive / LiveApp 为上方历史模拟仓各组件的完整克隆：
// 前端 class 一律带 -live 后缀、后端表带 _live 后缀、读写接口带 ?scope=live；两套代码可独立修改互不影响。

// live 页卡片列表回写（PUT /api/cards?scope=live）
async function saveCardsLive(list) {
  try {
    await fetch(API_BASE + "/api/cards?scope=live", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards: list }),
    });
  } catch (e) { console.error("卡片保存失败(live)", e); }
}

function CardLive({ symbol, name, period, onPeriod, dstart, dend, index, onDragStart, onDropCard, onDelete, quote, holding, onTrade, theme }) {
  const ref = useRef();
  const tradeRef = useRef();  // 交易行（含气泡）引用：用于判断气泡外点击
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(true);
  // 卡片内联交易：form=null 只显示按钮；点买/卖弹出气泡（时间/价格/数量±100），提交走 POST /api/orders
  const [form, setForm] = useState(null);
  const [fprice, setFprice] = useState("");
  const [fqty, setFqty] = useState("");
  const [ftime, setFtime] = useState("");  // 下单时间：默认真实当前时刻，可改
  const [terr, setTerr] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState("");
  const [dayPx, setDayPx] = useState(null);  // 选了结束日期时：截止日最后一根K线收盘与前一根收盘（当日股价/涨跌基准）
  // 画线（live）：与历史页共用同一份线（按标的+周期存），控制器只管本卡图表
  const [lines, setLines] = useState([]);
  const [drawOn, setDrawOn] = useState(false);
  const ctlRef = useRef(null);
  const dref = useRef({ lines: [], on: false });
  dref.current.lines = lines; dref.current.on = drawOn;
  useEffect(() => {
    let dead = false;
    getJSON(`/api/drawings?symbol=${symbol}&period=${period}`)
      .then(d => { if (!dead) setLines(d.items || []); })
      .catch(() => {});
    return () => { dead = true; };
  }, [symbol, period]);
  useEffect(() => { const c = ctlRef.current; if (c) c.setLines(lines); }, [lines]);
  useEffect(() => { const c = ctlRef.current; if (c) c.setMode(drawOn); }, [drawOn]);
  const clearLines = () => {  // 清空当前标的+周期的全部线（后端删库，前端立即清屏）
    setLines([]);
    fetch(API_BASE + `/api/drawings?symbol=${symbol}&period=${period}`, { method: "DELETE" }).catch(() => {});
  };
  const drawApi = {  // 画线增/删/改：落库成功后回写 state，图随 state 重绘
    onAdd: (kind, pts) => sendJSON("/api/drawings", "POST", { symbol, period, kind, pts })
      .then(d => setLines(v => [...v, d.item])).catch(() => {}),
    onDel: id => fetch(API_BASE + "/api/drawings/" + id, { method: "DELETE" })
      .then(() => setLines(v => v.filter(x => x.id !== id))).catch(() => {}),
    onUpdate: (id, kind, pts) => sendJSON("/api/drawings/" + id, "PUT", { kind, pts })  // 拖端点改两端高度
      .then(d => setLines(v => v.map(x => x.id === id ? d.item : x)))
      .catch(e => { setLines(v => v.slice()); throw e; }),  // 失败：换新数组触发按原线重绘（回滚）
  };
  // 行情数据短缓存：只是换了主题时（参数没变）直接拿上一次的数据重画，不重打一轮上游请求
  //（37 张卡同时重取会把后端/上游打满，实测切主题后整屏 Failed to fetch）
  const dataRef = useRef({ key: "", data: null });
  useEffect(() => {
    const chart = echarts.init(ref.current, theme === "dark" ? "dark" : null);  // 亮色用 ECharts 默认主题，暗色用内置 dark（坐标轴/分割线自动跟色）
    let dead = false;
    const key = `${symbol}|${period}|${dstart}|${dend}`;
    const hit = dataRef.current.key === key ? dataRef.current.data : null;
    setErr(""); setLoading(!hit);
    if (!hit) setDayPx(null);
    (async () => {
      try {
        if (period === "day5") throw new Error("5日待接入(东财 trends2)");
        const d = hit || await getJSON(period === "min"
          ? `/api/minute?symbol=${symbol}`
          : `/api/kline?symbol=${symbol}&period=${period}&limit=300${(dstart || dend) ? `&start=${dstart}&end=${dend}` : ""}`);
        dataRef.current = { key, data: d };
        if (period === "min") {
          const pts = (d.points || []).map(s => { const a = s.split(" "); return [a[0], +a[1]]; });
          chart.setOption(lineOpt(pts, +((d.quote || [])[4])), true);  // quote[4]=昨收
        } else {
          chart.setOption(kOpt(d, Boolean(dstart || dend)), true);
          const ctl = createDrawings(chart, drawApi);
          ctlRef.current = ctl;
          ctl.setRows(d.klines || []);
          ctl.setLines(dref.current.lines);
          ctl.setMode(dref.current.on);
          const tail = d.tail || [];  // 截止日收盘：不晚于结束日期的最后两根K线（区间落在周末等非交易日、图内为空时也能取到"当日价"）
          if (dend && tail.length >= 2)
            setDayPx({ price: +tail[tail.length - 1][2], prev: +tail[tail.length - 2][2] });
        }
      } catch (e) { if (!dead) setErr(String(e.message || e)); }
      finally { if (!dead) setLoading(false); }
    })();
    const onRs = () => chart.resize();
    window.addEventListener("resize", onRs);
    return () => { dead = true; if (ctlRef.current) ctlRef.current.destroy(); ctlRef.current = null; window.removeEventListener("resize", onRs); chart.dispose(); };
  }, [symbol, period, dstart, dend, theme]);  // theme 变化：重建图表以换上当前主题的配色
  // 买卖气泡：点气泡外或按 Esc 关闭（两个买卖按钮在 tradeRef 内，点按钮不触发外部关闭，由按钮自己切换）
  useEffect(() => {
    if (!form) return;
    const onDoc = e => { if (tradeRef.current && !tradeRef.current.contains(e.target)) setForm(null); };
    const onKey = e => e.key === "Escape" && setForm(null);
    document.addEventListener("mousedown", onDoc);
    window.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); window.removeEventListener("keydown", onKey); };
  }, [form]);
  // 现价/涨跌：无结束日期走 App 批量报价（各卡一致）；选了结束日期则取截止日最后一根K线收盘=当日价，
  // 涨跌基准=前一根收盘（与图右轴%口径一致，颜色随当日涨跌）
  const px = dayPx ? dayPx.price : (quote ? quote.price : null);
  const prevPx = dayPx ? dayPx.prev : (quote ? quote.prev : null);
  const chg = px != null && prevPx ? (px - prevPx) / prevPx * 100 : null;
  // 持仓盈亏始终按实时报价算（仓位是当下的，不随历史日期回放）：盈亏 = (现价-成本)×数量
  const pl = quote && holding ? (quote.price - holding.cost) * holding.shares : null;
  const plpct = quote && holding && holding.cost ? (quote.price - holding.cost) / holding.cost * 100 : null;
  const sellable = holding ? (holding.sellable != null ? holding.sellable : holding.shares) : 0;  // 可卖数量：A股当日买入的份额 T+1 锁到明日，仅锁卖出按钮，盈亏照常显示
  const flag = symbol.startsWith("hk") ? "hk" : symbol.startsWith("us") ? "us" : "";
  const openForm = side => {
    if (side === "sell" && sellable <= 0) return;
    if (form === side) { setForm(null); return; }  // 再点同一按钮＝收起气泡
    const now = nowLocal();  // 实时仓下单时间=真实当前时刻，不随顶栏日期筛选锚定（区别于历史仓锚结束日期）
    setForm(side); setTerr("");
    setFprice(quote ? String(quote.price) : "");   // 价格默认现价；卖出数量默认全部可卖
    setFqty(side === "sell" ? String(sellable) : "100");
    setFtime(now);
  };
  // 卖出数量上限=可卖数量：超出→数量框红边、加号禁用无法再加大（买入无上限；手输超限标红，提交时前端拦截）
  const qmax = form === "sell" ? sellable : null;
  const q = parseFloat(fqty);
  const qOver = qmax != null && q > qmax;
  // 数量加减，每次100；卖出时加号封顶可卖数量，不再放大
  const stepQty = d => setFqty(v => {
    const nv = Math.max(0, (parseFloat(v) || 0) + d * 100);
    return String(d > 0 && qmax != null && nv > qmax ? qmax : nv);
  });
  const submitTrade = async () => {
    const price = parseFloat(fprice), qty = parseFloat(fqty);
    if (!(price > 0) || !(qty > 0)) { setTerr("价格/数量需大于0"); return; }
    if (form === "sell" && qty > sellable) { setTerr("卖出数量超过可卖 " + sellable); return; }
    setBusy(true); setTerr("");
    try {
      await sendJSON("/api/orders?scope=live", "POST", { symbol, name, side: form, price, qty, ts: ftime });
      setForm(null); setDone(form); setTimeout(() => setDone(""), 1500);
      onTrade();  // 刷新持仓/订单/汇总（不在卡里的新持仓会随 symKey 联动补报价）
    } catch (e) { setTerr(String(e.message || e)); }
    finally { setBusy(false); }
  };
  return html`<div className="card-live"
    onDragOver=${e => e.preventDefault()}
    onDrop=${() => onDropCard(index)}>
    ${period !== "min" && period !== "day5" && html`<button className=${"drbtn-live" + (drawOn ? " on-live" : "")} title="画线：单击画水平线，拖拽画斜线，拖线两端圆点调高度，点线选中后按 Delete 删除；右键线删除" onClick=${() => setDrawOn(v => !v)}><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 10l.7-2.6L8 2.1l1.9 1.9-5.3 5.3L2 10z" fill="none" stroke="currentColor" strokeWidth="1.2"/></svg></button>`}
    <button className="del-live" title="删除卡片" onClick=${() => onDelete(symbol)}>✕</button>
    <div className="hd-live">
      <span className="grip-live" draggable="true"
        onDragStart=${e => { e.dataTransfer.setData("text/plain", String(index)); e.dataTransfer.effectAllowed = "move"; onDragStart(index); }}>
        ≡ <b>${name}</b><span style=${{ opacity: .55, fontSize: 12 }}>${symbol}</span>${flag && html`<img className="flag-live" draggable="false" src=${"vendor/flags/" + flag + ".svg"} alt="" />`}
      </span>
      <div className="hrow2-live">
        <span>${px != null && chg != null && html`<span className=${"px-live" + (chg > 0 ? " up-live" : chg < 0 ? " dn-live" : "")}>${px}</span><span className=${"chg-live" + (chg > 0 ? " up-live" : chg < 0 ? " dn-live" : "")}>${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`}</span>
        ${holding && pl != null && html`<span className="hold-live">持仓盈亏<b className=${pl >= 0 ? "up-live" : "dn-live"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b><span className=${plpct >= 0 ? "up-live" : "dn-live"}>${plpct >= 0 ? "+" : ""}${plpct.toFixed(2)}%</span></span>`}
      </div>
      <div className="tabrow-live">
        <span className="tabs-live">
          ${TABS.map(([p, t]) => html`<button key=${p} className=${p === period ? "on-live" : ""} onClick=${() => onPeriod(symbol, p)}>${t}</button>`)}
        </span>
        <div className="trade-live" ref=${tradeRef}>
          <button className="tbn-live" disabled=${busy} onClick=${() => openForm("buy")}>${done === "buy" ? "已买入" : "买入"}</button>
          <button className="tbn-live sell-live" disabled=${sellable <= 0 || busy}
            title=${sellable > 0 ? "可卖 " + sellable : holding ? "A股当日买入，次日可卖" : "无持仓"}
            onClick=${() => openForm("sell")}>${done === "sell" ? "已卖出" : "卖出"}</button>
        ${form && html`<div className="pop-live">
          <div className="prow-live">
            <label>${form === "buy" ? "买入时间" : "卖出时间"}</label>
            <input type="datetime-local" value=${ftime} max=${nowLocal()} onChange=${e => setFtime(e.target.value)} />
          </div>
          <div className="prow-live">
            <label>价格</label>
            <input type="number" step="any" min="0" value=${fprice} onChange=${e => setFprice(e.target.value)} placeholder="价格" />
          </div>
          <div className="prow-live">
            <label>数量</label>
            <button className="step-live" disabled=${busy} onClick=${() => stepQty(-1)}>−</button>
            <input type="number" step="any" min="0" max=${qmax != null ? String(qmax) : undefined} className=${qOver ? "over" : ""} value=${fqty} onChange=${e => setFqty(e.target.value)} placeholder="数量" title=${qmax != null ? "最多可卖 " + qmax : undefined} />
            <button className="step-live" disabled=${busy || (qmax != null && q >= qmax)} onClick=${() => stepQty(1)}>＋</button>
          </div>
          ${qmax != null && html`<div className="prow-live" style=${{ marginTop: "-4px" }}>
            <label style=${{ width: "auto", fontSize: "11px", color: cssVar("--tx-4") }}>可卖 ${sellable} 股 / 持仓 ${holding ? holding.shares : 0} 股（数量已默认填满可卖）</label>
          </div>`}
          ${terr && html`<span className="terr-live">${terr}</span>`}
          <div className="pact-live">
            <button className="tbn-live ok-live" disabled=${busy} onClick=${submitTrade}>${busy ? "提交中…" : "确认"}</button>
            <button className="tbn-live" style=${{ borderColor: cssVar("--bd-1c"), color: cssVar("--tx-4"), background: cssVar("--bg-card") }} disabled=${busy} onClick=${() => setForm(null)}>取消</button>
          </div>
        </div>`}
        </div>
      </div>
    </div>
    <div className="chart-live" ref=${ref}></div>
    ${drawOn && html`<div className="drtip-live">单击画线 · 拖拽画斜线 · 点线后：拖线身整条挪、拖圆点调两端、Delete 删除${lines.length > 0 && html`<button onClick=${clearLines}>清空</button>`}</div>`}
    ${loading && !err && html`<div className="ld-live">加载中…</div>`}
    ${err && html`<div className="err-live">${err}</div>`}
  </div>`;
}

// 全部收益抽屉：右侧滑出。持仓 tab 用 /api/holdings + 批量报价实时计算；订单 tab 用 /api/orders 真实流水（每笔 realized + 行删除）

function TotalDrawerLive({ holdings, quotes, cards, orders, realizedTotal, account, onDelOrder, onDelHolding, onClearOrders, onClose }) {
  const [tab, setTab] = useState("hold");
  useEffect(() => {  // Esc 关闭，同时锁住页面滚动
    const onKey = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [onClose]);
  const names = {};
  cards.forEach(c => { names[c.symbol] = c.name; });
  // 全部持仓行都列出（无报价的列显示 —），汇总只统计有报价的行；全部收益% = 总盈亏 / 总成本（与原汇总条口径一致）
  // 「买入时间」列显示最后一次买入（仅展示层口径：从订单流水取每标的最近一笔买入；后端 buy_ts 仍为建仓首笔不动）
  const lastBuy = {};
  orders.forEach(o => { if (o.side === "buy" && (!lastBuy[o.symbol] || o.ts > lastBuy[o.symbol])) lastBuy[o.symbol] = o.ts; });
  const rows = Object.entries(holdings).map(([s, h]) => ({ s, ...h, q: quotes[s] }));
  const valid = rows.filter(x => x.q);
  const tCost = valid.reduce((a, x) => a + x.shares * x.cost, 0);
  const tMv = valid.reduce((a, x) => a + x.shares * x.q.price, 0);
  const tFloat = tMv - tCost;                // 浮动盈亏
  const tPl = tFloat + realizedTotal;        // 全部收益 = 浮动 + 已实现（卖出落袋）
  // 全部收益% 分母=本金：已实现收益对应的本金已卖出回笼、不在当前持仓成本里，只除 tCost 会把已卖部分基数丢掉、百分比虚大数倍
  const tPct = account && account.capital ? tPl / account.capital * 100 : (tCost ? tPl / tCost * 100 : 0);
  return html`<div className="drawer-mask-live" onClick=${onClose}>
    <div className="drawer-live" onClick=${e => e.stopPropagation()}>
      <div className="dhd-live">
        <span className="dtitle-live">全部收益</span>
        <button className="dclose-live" title="关闭" onClick=${onClose}>✕</button>
      </div>
      <div className="dtabs-live">
        <button className=${tab === "hold" ? "on-live" : ""} onClick=${() => setTab("hold")}>持仓(${Object.keys(holdings).length})</button>
        <button className=${tab === "order" ? "on-live" : ""} onClick=${() => setTab("order")}>订单</button>
      </div>
      <div className="dbody-live">
        ${tab === "hold" ? html`<div>
          <div className="dtot-live">
            <span>全部收益<b className=${tPl >= 0 ? "up-live" : "dn-live"}>${tPl >= 0 ? "+" : ""}${tPl.toFixed(2)}</b><span className=${tPct >= 0 ? "up-live" : "dn-live"}>(${tPct >= 0 ? "+" : ""}${tPct.toFixed(2)}%)</span></span>
            ${realizedTotal !== 0 && html`<span>已实现<b className=${realizedTotal >= 0 ? "up-live" : "dn-live"}>${realizedTotal >= 0 ? "+" : ""}${realizedTotal.toFixed(2)}</b></span>`}
            <span>总市值<b>${tMv.toFixed(2)}</b></span>
            <span>总成本<b>${tCost.toFixed(2)}</b></span>
            ${orders.length > 0 && html`<button className="dclr-live" title="清空历史回放+实时跟随两视图全部买卖流水：收益归0（不可恢复）" onClick=${onClearOrders}>清空收益</button>`}
          </div>
          <div className="hhd-live"><span>名称</span><span>现价</span><span>成本</span><span>数量</span><span title="A股当日买入的份额次日可卖（T+1）">可卖</span><span>市值</span><span>盈亏金额</span><span>盈亏%</span><span>买入时间</span><span>删除</span></div>
          ${rows.map(x => {
            const pl = x.q ? (x.q.price - x.cost) * x.shares : null;
            const plp = x.q && x.cost ? (x.q.price - x.cost) / x.cost * 100 : null;
            return html`<div className="hrow-live" key=${x.s}>
              <span className="hnm-live">${names[x.s] || x.name || x.s}<i>${x.s}</i></span>
              <span>${x.q ? x.q.price.toFixed(3) : "—"}</span>
              <span>${x.cost.toFixed(3)}</span>
              <span>${x.shares}</span>
              <span>${x.sellable != null ? x.sellable : x.shares}</span>
              <span>${x.q ? (x.shares * x.q.price).toFixed(2) : "—"}</span>
              <span className="hpl-live">${pl != null ? html`<b className=${pl >= 0 ? "up-live" : "dn-live"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b>` : "—"}</span>
              <span className="hpp-live">${plp != null ? html`<span className=${plp >= 0 ? "up-live" : "dn-live"}>${plp >= 0 ? "+" : ""}${plp.toFixed(2)}%</span>` : "—"}</span>
              <span className="hbt-live">${(lastBuy[x.s] || x.buy_ts) ? html`${(lastBuy[x.s] || x.buy_ts).slice(0, 10)}<i>${(lastBuy[x.s] || x.buy_ts).slice(11)}</i>` : "—"}</span>
              <button className="odel-live" title="删除此持仓：该标的全部买卖流水一并清除" onClick=${() => onDelHolding(x.s)}>✕</button>
            </div>`;
          })}
        </div>` : html`<div>
          ${orders.length ? html`<button className="dclr-live" title="清空历史回放+实时跟随两视图全部买卖流水：持仓清零、收益归0（不可恢复）" onClick=${onClearOrders}>清空全部订单</button>
          ${orders.map(o => html`<div className="orow-live" key=${o.id}>
            <b className=${"act-live " + (o.side === "buy" ? "up-live" : "dn-live")}>${o.side === "buy" ? "买入" : "卖出"}</b>
            <span className="onm-live">${o.name}</span>
            <span className="ocode-live">${o.symbol}</span>
            <span className="opx-live">${o.price.toFixed(2)}元</span>
            <span className="oqt-live">${+o.qty}股</span>
            <span className="odt-live">${o.ts}</span>
            <span className="opl-live">${o.realized != null && html`共收益<b className=${o.realized >= 0 ? "up-live" : "dn-live"}>${o.realized >= 0 ? "+" : ""}${o.realized.toFixed(2)}</b>元`}</span>
            <button className="odel-live" title="删除此笔记录" onClick=${() => onDelOrder(o.id)}>✕</button>
          </div>`)}
          <div className="dnote-live">买入行的收益体现在持仓盈亏中；删除任一记录后持仓与收益自动重算</div>`
          : html`<div className="dnote-live">暂无交易记录，去卡片点「买入」模拟一笔</div>`}
        </div>`}
      </div>
    </div>
  </div>`;
}

// 日期选择器（live 实时仓）：与上方 DP 同构的 -live 克隆，行为一致（周六/周日、晚于今天的未来日期置灰且不可点；
// 点标题逐级上翻选月/选年，‹/›：日视图翻月、月视图翻年、年视图翻12年）
function DPLive({ value, onPick, title }) {
  const [open, setOpen] = useState(false);
  const [vym, setVym] = useState("");       // 面板浏览中的月份 YYYY-MM（每次打开按 value/今天重置）
  const [view, setView] = useState("day");  // day=日历 / month=选月 / year=选年
  const pad2 = n => String(n).padStart(2, "0");
  const d0 = new Date(), today = `${d0.getFullYear()}-${pad2(d0.getMonth() + 1)}-${pad2(d0.getDate())}`;
  const openCal = () => { setVym((value || today).slice(0, 7)); setView("day"); setOpen(true); };
  const shift = delta => {  // 上一页/下一页（跨年由 Date 归一）：日视图翻1月，月视图翻1年，年视图翻12年
    const [y, m] = vym.split("-").map(Number);
    const t = view === "year" ? new Date(y + delta * 12, m - 1, 1)
      : new Date(y, m - 1 + (view === "month" ? delta * 12 : delta), 1);
    const nv = `${t.getFullYear()}-${pad2(t.getMonth() + 1)}`;
    if (nv > today.slice(0, 7)) return;  // 未来月份/年份不再后翻：截止日不得晚于今天
    setVym(nv);
  };
  let panel = null;
  if (open) {
    const [y, m] = vym.split("-").map(Number);
    let head, body;
    if (view === "year") {  // 选年：以浏览年为中心前后各推，点某年回选月视图
      head = html`<b>${y - 5}年 - ${y + 6}年</b>`;
      body = html`<div className="dp-ym-live">
        ${Array.from({ length: 12 }, (_, i) => { const yy = y - 5 + i;
          const fut = String(yy) > today.slice(0, 4);  // 未来年份：禁用置灰
          const cls = "dp-d-live" + (String(yy) === value.slice(0, 4) ? " sel-live" : "") + (String(yy) === today.slice(0, 4) ? " td-live" : "");
          return html`<button key=${yy} className=${cls} disabled=${fut}
            onClick=${() => { setVym(`${yy}-${pad2(m)}`); setView("month"); }}>${yy}</button>`; })}
      </div>`;
    } else if (view === "month") {  // 选月：点某月回日历视图
      head = html`<b onClick=${() => setView("year")}>${y}年</b>`;
      body = html`<div className="dp-ym-live">
        ${Array.from({ length: 12 }, (_, i) => { const ym = `${y}-${pad2(i + 1)}`;
          const fut = ym > today.slice(0, 7);  // 未来月份：禁用置灰
          const cls = "dp-d-live" + (ym === value.slice(0, 7) ? " sel-live" : "") + (ym === today.slice(0, 7) ? " td-live" : "");
          return html`<button key=${ym} className=${cls} disabled=${fut}
            onClick=${() => { setVym(ym); setView("day"); }}>${i + 1}月</button>`; })}
      </div>`;
    } else {  // 日历：周六/周日置灰且不可点
      head = html`<b onClick=${() => setView("month")}>${y}年${m}月</b>`;
      const first = (new Date(y, m - 1, 1).getDay() + 6) % 7;  // 当月1号前的空位数（周一为首列）
      const days = new Date(y, m, 0).getDate();
      body = html`<div>
        <div className="dp-wk-live">${["一", "二", "三", "四", "五", "六", "日"].map((w, i) => html`<span key=${i} className=${i > 4 ? "w-live" : ""}>${w}</span>`)}</div>
        <div className="dp-grid-live">
          ${Array.from({ length: first }, (_, i) => html`<span key=${ "b" + i }></span>`)}
          ${Array.from({ length: days }, (_, i) => {
            const ds = `${y}-${pad2(m)}-${pad2(i + 1)}`;
            const wk = (first + i) % 7 >= 5;  // 周六/周日：禁用置灰
            const fut = ds > today;            // 未来日期：禁用置灰（截止日最晚到当下）
            const cls = "dp-d-live" + (ds === value ? " sel-live" : "") + (ds === today ? " td-live" : "");
            return html`<button key=${ds} className=${cls} disabled=${wk || fut}
              onClick=${() => { onPick(ds); setOpen(false); }}>${i + 1}</button>`;
          })}
        </div>
      </div>`;
    }
    panel = html`<span>
      <div className="dp-mask-live" onClick=${() => setOpen(false)}></div>
      <div className="dp-panel-live">
        <div className="dp-nav-live">
          <button onClick=${() => shift(-1)}>‹</button>
          ${head}
          <button onClick=${() => shift(1)}>›</button>
        </div>
        ${body}
      </div>
    </span>`;
  }
  return html`<span className="dp-live">
    <button className=${"dp-btn-live" + (value ? "" : " ph-live")} title=${title} onClick=${() => open ? setOpen(false) : openCal()}>${value || title}</button>
    ${panel}
  </span>`;
}

function LiveApp({ page, setPage, dstart, setDstart, theme, setTheme }) {
  const [cards, setCards] = useState([]);  // 首屏卡片从后端 SQLite 加载，不再写死在页面里
  const applyCards = ns => { setCards(ns); saveCardsLive(ns); };  // 所有增删改统一：更新界面并回写数据库
  const loadCards = () => getJSON("/api/cards?scope=live").then(d => setCards(d.cards || [])).catch(e => console.error("卡片加载失败", e));
  useEffect(() => { loadCards(); }, []);  // 首屏拉取
  // 切回页面时重拉卡片：跨天后后端「买入次日前置」的新顺序无需手动刷新即呈现
  // （卡片按 symbol 为 key 复用组件，图表取数不依赖顺序，重排只移动 DOM 不重载图；同日内重拉结果相同，无感）
  useEffect(() => {
    const onVis = () => { if (document.visibilityState === "visible") loadCards(); };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, []);
  // 顶栏选中态由各卡周期推导：全部一致亮对应档位，不一致（或空盘）亮「其他」
  const gperiod = cards.length > 0 && cards.every(c => c.period === cards[0].period) ? cards[0].period : "other";
  const setAllPeriod = p => { if (p !== "other") applyCards(cards.map(c => ({ ...c, period: p }))); };  // 「其他」为混合态指示，点击不强制切换
  const setCardPeriod = (symbol, p) => applyCards(cards.map(c => (c.symbol === symbol ? { ...c, period: p } : c)));
  // 实时仓日期逻辑（区别于历史仓）：开始日期由用户自选并持久记忆最后一次选择（含清空），刷新后原样恢复——
  // 记忆改存后端 prefs（App 统一读写 /api/prefs），跨浏览器/跨地址共用一份；结束日期默认最新一天（今天）且
  // 不持久化——每次刷新自动跟上最新；当次会话内可手改，点「清除」或刷新即回到今天
  const todayLive = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
  const [dend, setDend] = useState(() => todayLive());
  const [q, setQ] = useState("");
  const [items, setItems] = useState([]);
  const [sel, setSel] = useState(null);  // 下拉里点选的个股：点右侧＋才加卡，输入变化或重新搜索时取消选中
  const [holdings, setHoldings] = useState({});  // symbol -> {shares, cost, sellable, name, buy_ts}，来自 GET /api/holdings（重演推导）
  const [quotes, setQuotes] = useState({});      // symbol -> {price, prev}，来自 GET /api/quotes 批量报价
  const [orders, setOrders] = useState([]);      // 交易流水，来自 GET /api/orders（含每笔 realized 收益）
  const [realizedTotal, setRealizedTotal] = useState(0);  // 已实现总收益（卖出落袋合计）
  const [showTotal, setShowTotal] = useState(false);  // 全部收益抽屉开关（顶部按钮 → 右侧滑出）
  const [showBt, setShowBt] = useState(false);  // 回测弹窗开关（与「全部收益」同一排按钮；hist/live 共用同一个浮层）
  const [account, setAccount] = useState(null);  // 账户本金（GET /api/account?scope=live）：作全部收益%的分母
  const loadHoldings = () => getJSON("/api/holdings?scope=live").then(d => {
    const m = {};
    (d.holdings || []).forEach(h => { m[h.symbol] = { shares: h.shares, cost: h.cost, sellable: h.sellable, name: h.name, buy_ts: h.buy_ts }; });
    setHoldings(m);
  }).catch(e => console.error("持仓加载失败", e));
  const loadOrders = () => getJSON("/api/orders?scope=live").then(d => {
    setOrders(d.orders || []);
    setRealizedTotal(d.realized_total || 0);
  }).catch(e => console.error("订单加载失败", e));
  const loadAccount = () => getJSON("/api/account?scope=live").then(d => setAccount(d)).catch(e => console.error("账户加载失败", e));
  useEffect(() => { loadHoldings(); loadOrders(); loadAccount(); }, []);  // 首屏拉取；买卖/删除后同样调这几个刷新推导账本
  const symKey = [...new Set([...cards.map(c => c.symbol), ...Object.keys(holdings)])].join(",");  // 卡片+持仓合集变化时重取批量报价（持仓可能不在卡片里）
  useEffect(() => {
    if (!symKey) return;
    let dead = false;
    getJSON(`/api/quotes?symbols=${symKey}`).then(d => { if (!dead) setQuotes(d.quotes || {}); })
      .catch(e => console.error("报价加载失败", e));
    return () => { dead = true; };
  }, [symKey]);
  const toggleTotal = () => setShowTotal(v => {
    const ns = !v;
    if (ns && symKey) getJSON(`/api/quotes?symbols=${symKey}`).then(d => setQuotes(d.quotes || {}))
      .catch(e => console.error("报价刷新失败", e));  // 展开时顺手刷新一次报价
    return ns;
  });
  const onTrade = () => { loadHoldings(); loadOrders(); loadAccount(); };  // 成交后刷新持仓/订单/账户/汇总
  const onDelOrder = id => sendJSON(`/api/orders/${id}?scope=live`, "DELETE")
    .then(() => { loadOrders(); loadHoldings(); loadAccount(); })
    // 失败（404 记录已不在库里/400 删除被依赖）也要重拉列表：404 时让残留行随刷新消失，避免页面行与库脱节后永远“删不掉”
    .catch(e => { loadOrders(); loadHoldings(); loadAccount(); alert(e.message || e); });
  // 删除持仓=后端清掉该标的全部买卖流水（连已实现收益一起消失）；不用 confirm：沙箱预览 iframe 会静默拦截模态框返回 false，表现为点击毫无反应
  const onDelHolding = s => sendJSON(`/api/holdings/${s}?scope=live`, "DELETE")
    .then(() => { loadOrders(); loadHoldings(); loadAccount(); })
    .catch(e => { loadOrders(); loadHoldings(); loadAccount(); alert(e.message || e); });
  // 一键清空全部订单：流水删光后收益归 0（live 抽屉无账户栏，只重拉订单/持仓）；不用 confirm（沙箱预览 iframe 会静默拦截模态框）
  const onClearOrders = () => sendJSON(`/api/orders?scope=live`, "DELETE")
    .then(() => { loadOrders(); loadHoldings(); loadAccount(); })
    .catch(e => { loadOrders(); loadHoldings(); loadAccount(); alert(e.message || e); });
  const addCard = (symbol, name) => {
    if (!cards.some(c => c.symbol === symbol)) {
      const p = gperiod !== "other" ? gperiod : "day";  // 新卡沿用当前统一周期，混合态回落日K
      applyCards([{ symbol, name, period: p }, ...cards]);  // 新卡插到最前面
    }
    setItems([]); setQ(""); setSel(null);
  };
  // 点 ✕ 删卡：先让后端删库里这行（DELETE /api/cards/{symbol}?scope=live），成功才收界面；
  // 失败保持原卡片不动，防「界面已删、库里还在，刷新后卡片复活」的 UI 与库脱节
  const removeCard = async symbol => {
    try {
      await sendJSON(`/api/cards/${encodeURIComponent(symbol)}?scope=live`, "DELETE");
      setCards(cards.filter(c => c.symbol !== symbol));
    } catch (e) { console.error("卡片删除失败(live)", e); }
  };
  const [dragIdx, setDragIdx] = useState(null);
  const moveCard = to => {
    if (dragIdx == null || dragIdx === to) return;
    const a = [...cards];
    const [it] = a.splice(dragIdx, 1);
    a.splice(to, 0, it);
    applyCards(a);
    setDragIdx(null);
  };
  const seq = useRef(0);  // 搜索请求序号：只采纳最后一次请求的结果，防旧响应覆盖新结果
  const doSearch = async (term) => {
    const s = String(term != null ? term : q).trim();
    if (!s) return;
    setSel(null);  // 新一次搜索作废旧选中
    const my = ++seq.current;
    try {
      const d = await getJSON(`/api/search?q=${encodeURIComponent(s)}`);
      if (my === seq.current) setItems(d.items || []);
    } catch (e) { console.warn("搜索失败", e); }  // 上游偶发失败时保留上一次结果
  };
  // 输入即搜索：300ms 防抖（中文输入法中间态一并合并）；清空输入自动收起下拉
  useEffect(() => {
    const t = setTimeout(() => {
      if (q.trim()) doSearch(q);
      else { setItems([]); setSel(null); }
    }, 300);
    return () => clearTimeout(t);
  }, [q]);
  return html`<div>
    <div className="topbar-live">
      <span className="ptabs-live">
        ${PAGES.map(([k, t]) => html`<button key=${k} className=${k === page ? "on-live" : ""} onClick=${() => setPage(k)}>${t}</button>`)}
      </span>
      <${ThemeSwitch} theme=${theme} setTheme=${setTheme} />
      <span className="tabs-live">
        ${GTABS.map(([p, t]) => html`<button key=${p} className=${p === gperiod ? "on-live" : ""} onClick=${() => setAllPeriod(p)}>${t}</button>`)}
      </span>
      <span className="dtr-live">
        <${DPLive} value=${dstart} onPick=${v => setDstart(v)} title="开始日期" />
        →
        <${DPLive} value=${dend} onPick=${v => setDend(v)} title="结束日期" />
        ${(dstart || dend !== todayLive()) && html`<button className="clr-live" onClick=${() => { setDstart(""); setDend(todayLive()); }}>清除</button>`}
      </span>
     <span style=${{ display: "flex", gap: 8 }}><button className=${"tbtn-live" + (showTotal ? " on-live" : "")} title="打开/关闭全部收益抽屉" onClick=${toggleTotal}>全部收益</button><button className=${"tbtn-live" + (showBt ? " on-live" : "")} title="回测：选一只标的与区间，按对应周期K线回放收益" onClick=${() => setShowBt(true)}>回测</button></span>
      <span className="search-live">
        个股：
        <input value=${q} placeholder="请输入名称/代码"
          onChange=${e => { setQ(e.target.value); setSel(null); }}
          onKeyDown=${e => e.key === "Enter" && !e.nativeEvent.isComposing && doSearch()} />
        <button className=${"add-live" + (sel ? " on-live" : "")} title="添加选中的个股"
          onClick=${() => sel ? addCard(sel.symbol, sel.name) : (items[0] ? addCard(items[0].symbol, items[0].name) : doSearch())}>＋</button>
        ${items.length > 0 && html`<div className="drop-live">
          ${items.map(it => html`<div key=${it.symbol} className=${sel && sel.symbol === it.symbol ? "on-live" : ""} onClick=${() => setSel(it)}>${it.name} <span style=${{ opacity: .5 }}>${it.symbol}</span></div>`)}
        </div>`}
      </span>
    </div>
    ${showTotal && html`<${TotalDrawerLive} holdings=${holdings} quotes=${quotes} cards=${cards} orders=${orders} realizedTotal=${realizedTotal} account=${account}
      onDelOrder=${onDelOrder} onDelHolding=${onDelHolding} onClearOrders=${onClearOrders} onClose=${() => setShowTotal(false)} />`}
    ${showBt && html`<${Backtest} cards=${cards} defStart=${dstart} defEnd=${dend} onClose=${() => setShowBt(false)} theme=${theme} />`}
    <div className="grid-live">
      ${cards.map((c, i) => html`<${CardLive} key=${c.symbol} symbol=${c.symbol} name=${c.name} period=${c.period} onPeriod=${setCardPeriod}
        index=${i} onDragStart=${setDragIdx} onDropCard=${moveCard} onDelete=${removeCard}
        dstart=${dstart} dend=${dend} quote=${quotes[c.symbol]} holding=${holdings[c.symbol]} onTrade=${onTrade} theme=${theme} />`) }
    </div>
  </div>`;
}

// 亮/暗主题开关：主题是全局偏好（不按 hist/live 分叉），两页顶栏共用同一个组件，故不另做 -live 副本
function ThemeSwitch({ theme, setTheme }) {
  return html`<span className="thm" title="亮色 / 暗色显示">
    ${[["light", "亮色"], ["dark", "暗色"]].map(([k, t]) =>
      html`<button key=${k} className=${theme === k ? "on" : ""} onClick=${() => setTheme(k)}>${t}</button>`)}
  </span>`;
}

// ---------- 回测弹窗（hist/live 两视图共用同一个浮层：只吃K线周期与资金参数，与 scope 无关）----------
// 交互：选一只标的（下拉搜索 / 点自选卡快捷选）+ 选策略类型与回测区间 → 取对应周期K线算收益曲线。
// 回测规则全部集中在 btCalc() 里；后续口径（定投/止盈/手续费/仓位等）只改它，弹窗与画图不用动。
const BT_TERMS = [["近半年", 182], ["近1年", 365], ["近3年", 1095]];  // 快捷区间：按自然日回溯
// 策略类型（后端 BT_STRATS 同款）：共用同一套 MA3 金叉/死叉规则，只是取数周期不同
//   day = 日k占Ma3（默认）  m60 = 1小时k占Ma3（每根 1 小时，A股一天 4 根）
const BT_STRATS = [["day", "日k占Ma3"], ["m60", "1小时k占Ma3"]];

function btDay(off) {  // 今天/往前 off 天的 YYYY-MM-DD
  const d = new Date();
  d.setDate(d.getDate() - (off || 0));
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
// K线时间有两种写法：日K 是 "2025-12-25"，分钟K 是 14 位紧凑串 "202512251130"（无分隔符）
// 统一取成 YYYY-MM-DD（直接 slice(0,10) 会把分钟K 截成 "2025122511"），供日期控件与区间比较
function btDateOf(v) {
  const t = String(v || "");
  return /^\d{12,}$/.test(t) ? `${t.slice(0, 4)}-${t.slice(4, 6)}-${t.slice(6, 8)}` : t.slice(0, 10);
}

// 回测结果图（口径见 docs/回测规则口径.md）：区间日K + MA3 + 买卖点。
// 买入点标在当日最低价下方、卖出点标在最高价上方（红买绿卖），鼠标悬停可看该笔价格/数量/本笔盈亏。
function btKOpt(d) {
  const P = chartPal();
  const rows = d.klines || [];
  // 时间标签：日K 到日（2026-10-28），1 小时K 到分钟（2026-10-28 10:30）——后端已统一格式化，
  // 这里只负责取到正确长度，否则同日多根分钟K会挤在同一个类目上
  const cat0 = v => { const s = String(v); return s.length > 10 ? s.slice(0, 16) : s; };
  const cats = rows.map(r => cat0(r[0]));
  const k = rows.map(r => [+r[1], +r[2], +r[4], +r[3]]);  // o,c,l,h
  const ind = d.ind || {};  // 信号判定仍只用 MA3，四条均线仅作图面对照
  // 图面叠四条均线：MA3/MA5/MA85/MA125（长均线靠后端预热段才在区间首根就有值）
  const mas = [["MA3", "--ma3"], ["MA5", "--ma5"], ["MA85", "--ma85"], ["MA125", "--ma125"]]
    .map(([n, v]) => ({ name: n, color: cssVar(v), data: ind[n.toLowerCase()] || [] }));
  const trades = d.trades || [];
  let lo = Math.min(...k.map(v => v[2])), hi = Math.max(...k.map(v => v[3]));
  mas.forEach(m => m.data.forEach(v => {  // 均线也并入 Y 轴范围，防长均线贴边被裁
    if (v == null) return;
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }));
  if (!(hi > lo)) { lo *= 0.999; hi = hi * 1.001 || 1; }
  const pad = (hi - lo) * 0.06;  // 标记离K线留点空，免压住影线
  // Y 轴必须比 K 线极值再各放宽 1.8 个 pad：买卖点本身画在「最高价+pad / 最低价-pad」，
  // 若轴范围只取 K 线极值，落在区间最高价/最低价那一根的标记会落到坐标系外被 ECharts 直接裁掉
  // （如 9-30 卖出价 1.238，当日高 1.241 就是区间最高，S 一直看不见）。
  const yMin = lo - pad * 1.8, yMax = hi + pad * 1.8;
  const HALF = "#e6b800";  // 减半仓的黄色三角与字母 S、半份买入的黄色 B，与全清仓的绿色 S、满份买入的红色 B 区分
  const pts = side => trades.filter(t => t.side === side).map(t => {
    const i = cats.indexOf(t.date);
    const r = rows[i] || [];
    const hf = t.reason === "half" || t.reason === "gb";  // 减半仓（卖一半）：half=回踩进 MA3、gb=绿K走弱
    const hb = t.reason === "hb";    // 中段回踩的半份买入
    return { value: [t.date, side === "buy" ? +r[4] - pad : +r[3] + pad], t,
      itemStyle: (hf || hb) ? { color: HALF } : null,
      label: (hf || hb) ? { show: true, formatter: side === "buy" ? "B" : "S", color: HALF } : null };  // 挂原始成交，tooltip 取用
  });
  const tip = ps => {
    const dt = ps[0].axisValue;
    const i = cats.indexOf(dt);
    const r = rows[i] || [];
    let s = `${dt}<br/>开 ${r[1]} 收 ${r[2]} 高 ${r[3]} 低 ${r[4]}`;
    mas.forEach(m => { if (m.data[i] != null) s += `<br/><span style="color:${m.color}">${m.name} ${m.data[i]}</span>`; });
    trades.filter(t => t.date === dt).forEach(t => {
      const c = t.side === "buy" ? (t.reason === "hb" ? HALF : P.up) : ((t.reason === "half" || t.reason === "gb") ? HALF : P.dn);
      s += `<br/><b style="color:${c}">${t.side === "buy" ? (t.reason === "hb" ? "买一半" : "买入") : ((t.reason === "half" || t.reason === "gb") ? "卖一半" : "卖出")}</b> ${t.price} × ${t.qty} = ${t.amount}`;
      if (t.realized != null) s += ` 本笔盈亏 ${t.realized >= 0 ? "+" : ""}${t.realized}`;
    });
    return s;
  };
  return {
    animation: false,
    backgroundColor: "transparent",
    tooltip: { trigger: "axis", backgroundColor: cssVar("--bg-card"), borderColor: cssVar("--bd-field"),
      textStyle: { color: cssVar("--tx-1"), fontSize: 12 }, axisPointer: { type: "cross" }, formatter: tip },
    grid: { left: 54, right: 58, top: 30, bottom: 46 },
    legend: { show: true, top: 0, left: 64, itemWidth: 14, itemHeight: 8, itemGap: 14,
      data: ["MA3", "MA5", "MA85", "MA125", "买", "卖"],  // 不列 K 线，省空间
      textStyle: { color: cssVar("--tx-4"), fontSize: 11 } },
    xAxis: { type: "category", data: cats, boundaryGap: true, axisLine: { lineStyle: { color: cssVar("--bd-field") } },
      axisLabel: { color: cssVar("--tx-4"), fontSize: 11, hideOverlap: true } },
    yAxis: { scale: true, min: yMin, max: yMax, splitLine: { lineStyle: { color: cssVar("--bg-soft2") } },
      axisLabel: { color: cssVar("--tx-4"), fontSize: 11 } },
    dataZoom: [
      { type: "inside", start: 0, end: 100 },
      { type: "slider", start: 0, end: 100, bottom: 6, height: 16, borderColor: cssVar("--zoom-border"),
        backgroundColor: cssVar("--zoom-bg"), fillerColor: cssVar("--zoom-filler"),
        handleStyle: { color: "#f99502", borderColor: "#f99502" }, moveHandleSize: 0, showDetail: false,
        textStyle: { color: cssVar("--zoom-tx"), fontSize: 10 } },
    ],
    series: [
      { name: "K", type: "candlestick", data: k,
        itemStyle: { color: P.up, color0: P.dn, borderColor: P.up, borderColor0: P.dn } },
      ...mas.map(m => ({ name: m.name, type: "line", data: m.data, showSymbol: false,
        lineStyle: { width: 1, color: m.color } })),
      { name: "买", type: "scatter", data: pts("buy"), symbol: "triangle", symbolSize: 12,
        itemStyle: { color: P.up }, z: 5,
        label: { show: true, position: "bottom", formatter: "B", color: P.up, fontSize: 11, fontWeight: 700 } },
      { name: "卖", type: "scatter", data: pts("sell"), symbol: "triangle", symbolRotate: 180, symbolSize: 12,
        itemStyle: { color: P.dn }, z: 5,
        label: { show: true, position: "top", formatter: "S", color: P.dn, fontSize: 11, fontWeight: 700 } },
    ],
  };
}

// 净值曲线：资金（现金 + 持仓市值）相对本金的逐日涨跌，与 K 线图共用同一批日期
function btNavOpt(nav) {
  const last = nav.length ? nav[nav.length - 1].pct : 0;
  return {
    animation: false,
    backgroundColor: "transparent",
    grid: { left: 12, right: 12, top: 14, bottom: 24, containLabel: true },
    tooltip: {
      trigger: "axis", backgroundColor: cssVar("--bg-card"), borderColor: cssVar("--bd-field"),
      textStyle: { color: cssVar("--tx-1"), fontSize: 12 },
      formatter: ps => `${ps[0].axisValue}<br/>资金 ${ps[0].data && nav[ps[0].dataIndex] ? nav[ps[0].dataIndex].equity : "-"}（${ps[0].data >= 0 ? "+" : ""}${(+ps[0].data).toFixed(2)}%）`,
    },
    xAxis: {
      type: "category", data: nav.map(x => x.date), boundaryGap: false,
      axisLine: { lineStyle: { color: cssVar("--bd-field") } },
      axisLabel: { color: cssVar("--tx-4"), fontSize: 11, hideOverlap: true },
    },
    yAxis: {
      type: "value",
      axisLabel: { color: cssVar("--tx-4"), fontSize: 11, formatter: v => `${v.toFixed(0)}%` },
      splitLine: { lineStyle: { color: cssVar("--bg-soft2") } },
    },
    series: [{
      type: "line", name: "资金曲线", data: nav.map(x => +x.pct.toFixed(2)), showSymbol: false,
      lineStyle: { width: 1.6, color: "#f99502" },
      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: "rgba(249,149,2,.32)" }, { offset: 1, color: "rgba(249,149,2,.02)" }]) },
      markLine: { silent: true, symbol: "none", label: { show: false }, lineStyle: { color: cssVar("--tx-9"), type: "dashed" }, data: [{ yAxis: 0 }] },
      itemStyle: { color: last >= 0 ? "#f99502" : "#2fcf98" },
    }],
  };
}

// 已停用的旧口径（区间首日一次性买入持有）——保留说明，避免后人误把它当现行规则
function btCalcHold(rows) {
  const px = rows.map(r => +r[2]);
  if (px.length < 2 || !(px[0] > 0)) return null;
  const base = px[0];
  let peak = base, mdd = 0;
  const nav = rows.map((r, i) => {
    const p = px[i];
    if (p > peak) peak = p;
    const dd = p / peak - 1;          // 相对区间内历史峰值的回撤
    if (dd < mdd) mdd = dd;
    return { date: r[0], pct: (p / base - 1) * 100 };
  });
  const total = nav[nav.length - 1].pct;
  const days = (new Date(rows[rows.length - 1][0]) - new Date(rows[0][0])) / 86400000;
  const years = days / 365;
  return {
    nav, total, mdd: mdd * 100, n: rows.length,
    hi: (Math.max(...px) / base - 1) * 100,
    lo: (Math.min(...px) / base - 1) * 100,
    first: rows[0][0], last: rows[rows.length - 1][0],
    // 年化：区间太短（<3个月）时复利外推失真，不出数
    ann: years >= 0.25 ? (Math.pow(1 + total / 100, 1 / years) - 1) * 100 : null,
  };
}

// ---------- 回测记录（左导航 + 右详情）----------
// 后端每次 /api/backtest 成功都会自动存一份快照（backtests 表）；这里左边竖着列历史回测，
// 右边看选中那条的票、区间、回测时间与「K线 + 买卖点」，图直接复用 btKOpt，口径跟回测弹窗完全一致。
// 列表头「＋ 新增」回到回测配置再跑一次（后端会再存一条）；每条右上角 ✕ 直接删这条，右侧详情的「删除这条」同义。
function BtHistory({ onClose, theme, onNew }) {
  const [items, setItems] = useState(null);   // null=列表加载中；[]=暂无记录
  const [cur, setCur] = useState(null);       // 选中记录 id
  const [rec, setRec] = useState(null);       // 选中记录详情 {id,name,symbol,start,end,created,data}
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const refK = useRef(null);
  useEffect(() => {  // 每次打开都重拉列表（刚跑完的回测会带上）
    let dead = false;
    (async () => {
      try {
        const d = await getJSON("/api/backtests");
        if (dead) return;
        const list = d.items || [];
        setItems(list);
        if (list.length) setCur(list[0].id);  // 默认选最新一条
      } catch (e) { if (!dead) { setItems([]); setErr(String(e.message || e)); } }
    })();
    return () => { dead = true; };
  }, []);
  useEffect(() => {  // 选中项变化 → 取该条快照
    if (!cur) return;
    let dead = false;
    setBusy(true); setErr("");
    (async () => {
      try {
        const d = await getJSON(`/api/backtests/${cur}`);
        if (!dead) setRec(d);
      } catch (e) { if (!dead) { setRec(null); setErr(String(e.message || e)); } }
      finally { if (!dead) setBusy(false); }
    })();
    return () => { dead = true; };
  }, [cur]);
  useEffect(() => {  // 详情容器随数据渲染才存在，故依赖 rec
    if (!rec || !refK.current) return;
    const ch = echarts.init(refK.current, theme === "dark" ? "dark" : null);
    ch.setOption(btKOpt(rec.data), true);
    const onRs = () => ch.resize();
    window.addEventListener("resize", onRs);
    return () => { window.removeEventListener("resize", onRs); ch.dispose(); };
  }, [rec, theme]);
  const del = async (ev, id) => {
    ev.stopPropagation();
    if (!window.confirm("删掉这条回测记录？")) return;
    try {
      await sendJSON(`/api/backtests/${id}`, "DELETE");
      const list = (items || []).filter(x => x.id !== id);
      setItems(list);
      if (cur === id) { setRec(null); setCur(list.length ? list[0].id : null); }
    } catch (e2) { setErr(String(e2.message || e2)); }
  };
  const sg = v => (v == null ? "—" : `${v >= 0 ? "+" : ""}${v.toFixed(2)}`);
  const st = rec ? (rec.data.stats || {}) : null;
  return html`<div className="btrmask" onClick=${ev => { ev.stopPropagation(); onClose(); }}>
    <div className="btrpanel" onClick=${ev => ev.stopPropagation()}>
      <div className="btrhd">
        <b>回测记录</b><i>左边选一条，右边看该次回测的票、区间、回测时间与 K 线买卖点</i>
        <button className="btrclose" title="关闭" onClick=${onClose}>✕</button>
      </div>
      <div className="btrbody">
        <div className="btrnav">
          <div className="btrnavhd">
            <span title=${items && items.length ? "新的在最上" : ""}>${items ? `共 ${items.length} 条` : "加载中…"}</span>
            ${onNew && html`<button className="btrnew" title="新增一次回测：回到回测配置，选好标的与区间后点「开始回测」" onClick=${onNew}>＋ 新增</button>`}
          </div>
          ${(items || []).map(it => html`<div key=${it.id} className=${`btritem${it.id === cur ? " on" : ""}`}
            onClick=${() => setCur(it.id)}>
            <button className="btrx" title="删除这条回测记录" onClick=${ev => del(ev, it.id)}>✕</button>
            <b>${it.name} <em>${it.symbol}</em></b>
            <span>${it.start} ~ ${it.end}
              <span className="btrpct" style=${{ color: (it.stats.total || 0) >= 0 ? "var(--up)" : "var(--dn)" }}>${sg(it.stats.total)}%</span>
            </span>
            <span><em>${it.strat || "日k占Ma3"} · 回测于 ${it.created}</em></span>
          </div>`)}
        </div>
        <div className="btrdet">
          ${err && html`<div className="bterr">${err}</div>`}
          ${!err && items && items.length === 0 && html`<div className="btph">还没有回测记录：点左侧「＋ 新增」或关掉这里点「开始回测」跑一次，就会自动记一条</div>`}
          ${!rec && !err && items && items.length > 0 && html`<div className="btph">读取记录中…</div>`}
          ${rec && html`<div>
            <div className="btrinfo">
              <span className="btrtitle">${rec.name} <span style=${{ opacity: .5, fontSize: 12, fontWeight: 400 }}>${rec.symbol}</span></span>
              <span>策略<b>${rec.strat || "日k占Ma3"}</b></span>
              <span>区间<b>${st.first || rec.start} ~ ${st.last || rec.end}</b></span>
              <span>回测时间<b>${rec.created}</b></span>
              <span>本金<b>${rec.capital}</b></span>
              <span>每次买入<b>${rec.each}</b></span>
              <button className="btrdel" onClick=${ev => del(ev, rec.id)}>删除这条</button>
            </div>
            <div className="btstat">
              <span>累计收益<b className=${(st.total || 0) >= 0 ? "up" : "dn"}>${sg(st.total)}%</b></span>
              <span>期末资金<b className=${(st.total || 0) >= 0 ? "up" : "dn"}>${(st.end || 0).toFixed(2)}</b></span>
              <span>最大回撤<b className="dn">${(st.mdd || 0).toFixed(2)}%</b></span>
              <span>买入<b>${st.buys || 0}</b>次</span>
              <span>卖出<b>${st.sells || 0}</b>次</span>
              ${st.winrate != null && html`<span>胜率<b>${st.winrate}%</b></span>`}
              <span>K线<b>${(rec.data.klines || []).length}</b>根</span>
              ${busy && html`<span style=${{ color: "var(--tx-5)" }}>读取中…</span>`}
            </div>
            <div className="btrchart" ref=${refK}></div>
            <div className="btrule">图上 B=买入、S=卖出；口径同「回测」弹窗：MA3 上穿 MA5（由不高于 MA5 转为高于 MA5）当根起每根都买（每次=弹窗里「每次买入」的金额，但实体须至少 80% 站在 MA3 上方、整根 K 线也过半在 MA3 上方、底高于前一根且 MA3 朝上）；另有一条半份买入：实体落进 MA3 的部分在 20%~45% 之间、当根是红 K、实体顶高于前一根实体顶、MA3 上行且涨幅不小于 0.5% 时只买半份（图上黄色 B）；日K 按日、1小时K 按每根 60 分钟），MA3 下穿 MA5（死叉）当根、或出现弱势走平箱体（实体顶与底都没高于前一根）当根全部清仓（A 股另加：当根收盘较前一根收盘跌 4% 及以上也全清），若实体已有一半落进 MA3 线内且 MA3 仍向上、或当根是绿 K 且顶低于前一根顶但箱体仍在 MA3 上方，则只卖一半（黄色 S）；被清仓后 MA3 仍在 MA5 上方且仍上行、当根实体底高于前一根实体底 + 前一根实体高度的 2/3 时当根恢复买；按收盘价成交、不计手续费。</div>
          </div>`}
        </div>
      </div>
    </div>
  </div>`;
}

function Backtest({ cards, defStart, defEnd, onClose, theme }) {
  const [sym, setSym] = useState(null);          // 已选标的 {symbol, name}（只选一只）
  const [q, setQ] = useState("");
  const [items, setItems] = useState([]);        // 搜索下拉结果
  const [s, setS] = useState(defStart || "");   // 回测开始日期
  const [e, setE] = useState(defEnd || "");     // 回测结束日期
  const [capital, setCapital] = useState("100000");  // 回测本金
  const [each, setEach] = useState("10000");          // 单次买入金额
  const [strat, setStrat] = useState("day");           // 策略类型：day=日k占Ma3（默认）/ m60=1小时k占Ma3
  const [minD, setMinD] = useState("");          // 当前标的+策略下行情源能回溯到的最早交易日（空=不限）；比它早的日期一律不可选
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [res, setRes] = useState(null);          // {sym, data, warn}；data 为 /api/backtest 全量返回
  const [recGone, setRecGone] = useState(false); // 本次结果对应的回测记录是否已被快捷「删除」删掉
  const [showRec, setShowRec] = useState(false); // 回测记录弹窗（盖在回测弹窗之上）
  const refK = useRef(null);                     // K线图容器（带买卖点）
  const refNav = useRef(null);                   // 资金曲线容器
  const seq = useRef(0);
  useEffect(() => {  // Esc 关闭（回测记录开着时只关记录层，不连回测一起关）
    const onKey = ev => ev.key === "Escape" && !showRec && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose, showRec]);
  useEffect(() => {  // 输入即搜索（300ms 防抖，与顶栏搜索同款）；上游偶发失败保留上次结果
    const t = setTimeout(async () => {
      const term = q.trim();
      if (!term) { setItems([]); return; }
      const my = ++seq.current;
      try {
        const d = await getJSON(`/api/search?q=${encodeURIComponent(term)}`);
        if (my === seq.current) setItems(d.items || []);
      } catch (e2) { console.warn("回测标的搜索失败", e2); }
    }, 300);
    return () => clearTimeout(t);
  }, [q]);
  useEffect(() => {  // 换标的/换策略就探一次「最早能回测到哪天」：日K 单次约 800 根（≈3年）；1小时K 受上游分钟K 单次 800 根限制只有约 200 个交易日
    const sym0 = sym && sym.symbol;
    if (!sym0) { setMinD(""); return; }
    let dead = false;
    (async () => {
      try {
        // 借 /api/kline 带 start/end 取该周期全量窗口（后端内部已卡上游单次上限），首根日期即可回测起点
        const d = await getJSON(`/api/kline?symbol=${sym0}&period=${strat}&limit=676&start=1990-01-01&end=${btDay(0)}`);
        const k0 = (d.klines || [])[0];
        if (!dead) setMinD(k0 ? btDateOf(k0[0]) : "");
      } catch (e2) { if (!dead) setMinD(""); console.warn("回测可回溯起点探测失败", e2); }
    })();
    return () => { dead = true; };
  }, [sym && sym.symbol, strat]);
  useEffect(() => {  // 探测到下限后修正区间：整体早于下限就把区间平移到「下限~今天」，否则只把越界的那一端拉回下限（日期控件已置灰不可点，这里兜住快捷区间与换策略前的旧值）
    if (!minD) return;
    if (e && e < minD) { setS(minD); setE(btDay(0)); return; }
    if (s && s < minD) setS(minD);
  }, [minD]);
  useEffect(() => {  // 结果就绪后画两张图：区间日K（带买卖点）+ 资金曲线（容器随结果渲染才存在，故依赖 res）
    if (!res) return;
    const charts = [];
    const mk = (el, opt) => {
      if (!el) return;
      const ch = echarts.init(el, theme === "dark" ? "dark" : null);  // 亮色用 ECharts 默认主题，暗色用内置 dark（坐标轴/分割线自动跟色）
      ch.setOption(opt, true);
      charts.push(ch);
    };
    mk(refK.current, btKOpt(res.data));
    mk(refNav.current, btNavOpt(res.data.nav || []));
    const onRs = () => charts.forEach(ch => ch.resize());
    window.addEventListener("resize", onRs);
    return () => { window.removeEventListener("resize", onRs); charts.forEach(ch => ch.dispose()); };
  }, [res, theme]);
  const pick = it => { setSym({ symbol: it.symbol, name: it.name }); setQ(""); setItems([]); };
  const run = async () => {
    if (!sym) { setErr("请先选择回测标的"); return; }
    if (s && e && s > e) { setErr("开始日期不能晚于结束日期"); return; }

    try {
      // 规则全部落在后端 /api/backtest（与实盘流水完全隔离），前端只管取回来画图
      const dr = `${s ? `&start=${s}` : ""}${e ? `&end=${e}` : ""}`;
      // name 一并传给后端，存进回测记录（记录列表显示名称而不是只有代码）；tf 选策略类型
      const d = await getJSON(`/api/backtest?symbol=${sym.symbol}&name=${encodeURIComponent(sym.name)}&capital=${cap}&each=${ea}&tf=${strat}${dr}`);
      const rows = d.klines || [];
      if (rows.length < 2) throw new Error("区间内 K 线不足（落在周末/停牌或超出行情源可回溯范围），请换个区间");

      if (s && first > s) w.push(minD && s >= minD

      setRes({ sym, data: d, warn: w.join("；") });

            <span>区间<b>${st.first} ~ ${st.last}</b></span>
          </div>
          <div className="btkchart" ref=${refK}></div>

          ${trades.length === 0 && html`<div className="btph">区间内未触发任何买卖信号</div>`}
          ${trades.length > 0 && html`<div className="bttbl">
            <div className="bttr bthd2"><span>日期</span><span>方向</span><span>价格</span><span>数量</span><span>金额</span><span>本笔盈亏</span><span>触发</span></div>

            : `MA3 上穿 MA5（由不高于 MA5 转为高于 MA5）的那一天起，往后每天都买（每次 ${each || "10000"} 元，但要求实体至少 80% 站在 MA3 上方——MA3 不高于实体底 + 20% 实体高度、在实体顶之下，且不高于整根 K 线最高最低的中点——且当日实体底高于前一日实体底，且 MA3 比前一根至少高 0.5%（MA3 涨幅不到 0.5% 算走平，与下行一样不买），清仓后第一笔不另加实体条件；另有一条半份买入：实体落进 MA3 的部分在 20%~45% 之间、当根是红 K（收盘高于开盘）、实体顶高于前一根实体顶、MA3 仍上行且涨幅不小于 0.5% 时只买半份，图上标黄色 B），直到 MA3 下穿 MA5（死叉）或出现弱势走平箱体（当日实体顶未高于前一日、实体底也未高于前一日）的那一天把持仓全部清仓（A 股另加一条：当日收盘较前一日收盘跌 4% 及以上也全部清仓）；若当根实体已有一半落进 MA3 线内（MA3 不低于实体底 + 一半实体高度、仍在实体顶之下）且 MA3 仍向上，则先卖掉当前持仓的一半（图上黄色 S）；另若当根是绿 K、实体顶低于前一根实体顶、箱体仍大部分在 MA3 上方（MA3 不高于实体底 + 20% 实体高度）且 MA3 仍向上，也先卖一半（同样黄色 S）；每轮持仓只减一次；现金不足一次买入额就停手；被清仓后若 MA3 仍在 MA5 上方且仍上行、当日实体底高于前一日实体底 + 前一日实体高度的 2/3，则当日恢复每天买，否则等下一次金叉；按收盘价成交、不计手续费。`}</div>
        </div>`}
      </div>
    </div>
    ${showRec && html`<${BtHistory} onClose=${() => setShowRec(false)} theme=${theme}
      onNew=${() => { setShowRec(false); setRes(null); setErr(""); setQ(""); setItems([]); }} />`}
  </div>`;
}

    .then(d => setCards(d.cards || [])).catch(e => console.error("卡片加载失败", e));
  useEffect(() => { loadCards(); }, []);  // 首屏拉取

  // 切回页面时重拉卡片：跨真实天后后端（live 次日前置/hist 视点重排）的新顺序无需手动刷新即呈现；
  // 依赖 [dend] 保证闭包里的 loadCards 带最新视点（effect [] 会捕获旧 dend 永远传首屏视点）
  // （卡片按 symbol 为 key 复用组件，图表取数不依赖顺序，重排只移动 DOM 不重载图；同视点内重拉结果相同，无感）
  useEffect(() => {

  // 顶栏选中态由各卡周期推导：全部一致亮对应档位，不一致（或空盘）亮「其他」

  const [showBt, setShowBt] = useState(false);  // 回测弹窗开关（与「全部收益」同一排按钮；hist/live 共用同一个浮层）
  const hseq = useRef(0), oseq = useRef(0), aseq = useRef(0);  // 各接口视点请求序号：切日期后迟到的旧视点响应一律丢弃，防旧数据覆盖新视点显示
  const loadHoldings = () => {

  };
  useEffect(() => { setHoldings({}); loadHoldings(); }, [dend]);  // 切换视点先清空再重拉：视点之前没买入的股票持仓不得残留显示（含首屏）
  useEffect(() => { setOrders([]); setRealizedTotal(0); setAccount(null); loadOrders(); loadAccount(); }, [dend]);  // 订单/已实现/可用资金同随视点重放（含首屏）；买卖/删除后同样刷新
  const symKey = [...new Set([...cards.map(c => c.symbol), ...Object.keys(holdings)])].join(",");  // 卡片+持仓合集变化时重取批量报价（持仓可能不在卡片里）
  useEffect(() => {
    if (!symKey) return;
    let dead = false;
    getJSON(`/api/quotes?symbols=${symKey}`).then(d => { if (!dead) setQuotes(d.quotes || {}); })
      .catch(e => console.error("报价加载失败", e));
    return () => { dead = true; };
  }, [symKey]);
  const [dayPxMap, setDayPxMap] = useState({});  // symbol -> 截止日收盘 {price, prev}：抽屉盈亏锚定视点价（与卡片 dayPx 同源）
  useEffect(() => {
    // 抽屉/汇总的「当天价」：选了结束日期就对视点持仓逐个取截止日收盘（kline.tail），无则清空回落实时报价。
    // 上游同 symbol 同 period 30 秒缓存，与卡片带 end 的请求打同一 URL，不会重复压上游。
    // 刷新依赖必须挂 holdings 本体而非 symKey：symKey 是卡片∪持仓的并集，而买卖的标的本就在卡片里，
    // 持仓单边变化不改变并集——依赖并集时新买入的持仓永远取不到截止日收盘，抽屉盈亏静默跌回实时报价（曾致历史视点显示 45% 假收益）
    if (!dend) { setDayPxMap({}); return; }
    const syms = Object.keys(holdings);
    if (!syms.length) { setDayPxMap({}); return; }
    let dead = false;
    Promise.all(syms.map(s => getJSON(`/api/kline?symbol=${s}&period=day&limit=2&end=${dend}`)
      .then(d => { const t = d.tail || []; return t.length >= 2 ? [s, { price: +t[t.length - 1][2], prev: +t[t.length - 2][2] }] : null; })
      .catch(() => null))).then(rs => {
      if (dead) return;
      const m = {};
      rs.forEach(r => { if (r) m[r[0]] = r[1]; });
      setDayPxMap(m);
    });
    return () => { dead = true; };
  }, [dend, holdings]);
  const toggleTotal = () => setShowTotal(v => {
    const ns = !v;
    if (ns && symKey) getJSON(`/api/quotes?symbols=${symKey}`).then(d => setQuotes(d.quotes || {}))
      .catch(e => console.error("报价刷新失败", e));  // 展开时顺手刷新一次报价
    return ns;
  });
  const onTrade = () => { loadHoldings(); loadOrders(); loadAccount(); };  // 成交后刷新持仓/订单/账户/汇总
  const onDelOrder = id => sendJSON(`/api/orders/${id}`, "DELETE")
    .then(() => { loadOrders(); loadHoldings(); loadAccount(); })
    // 失败（404 记录已不在库里/400 删除被依赖）也要重拉列表：404 时让残留行随刷新消失，避免页面行与库脱节后永远“删不掉”
    .catch(e => { loadOrders(); loadHoldings(); loadAccount(); alert(e.message || e); });
  // 删除持仓=后端清掉该标的全部买卖流水（不分回放视点全删，连已实现收益一起消失）；不用 confirm：沙箱预览 iframe 会静默拦截模态框返回 false，表现为点击毫无反应
  const onDelHolding = s => sendJSON(`/api/holdings/${s}`, "DELETE")
    .then(() => { loadOrders(); loadHoldings(); loadAccount(); })
    .catch(e => { loadOrders(); loadHoldings(); loadAccount(); alert(e.message || e); });
  // 一键清空全部订单：流水删光后持仓清零、收益归 0、总资产/可用资金回到本金；不用 confirm（沙箱预览 iframe 会静默拦截模态框）
  const onClearOrders = () => sendJSON(`/api/orders`, "DELETE")
    .then(() => { loadOrders(); loadHoldings(); loadAccount(); })
    .catch(e => { loadOrders(); loadHoldings(); loadAccount(); alert(e.message || e); });
  const addCard = (symbol, name) => {
    if (!cards.some(c => c.symbol === symbol)) {
      const p = gperiod !== "other" ? gperiod : "day";  // 新卡沿用当前统一周期，混合态回落日K
      applyCards([{ symbol, name, period: p }, ...cards]);  // 新卡插到最前面
    }
    setItems([]); setQ(""); setSel(null);
  };
  // 点 ✕ 删卡：先让后端删库里这行（DELETE /api/cards/{symbol}），成功才收界面；
  // 失败保持原卡片不动，防「界面已删、库里还在，刷新后卡片复活」的 UI 与库脱节
  const removeCard = async symbol => {
    try {
      await sendJSON(`/api/cards/${encodeURIComponent(symbol)}`, "DELETE");
      setCards(prev => prev.filter(c => c.symbol !== symbol));
    } catch (e) { console.error("卡片删除失败", e); }
  };
  const [dragIdx, setDragIdx] = useState(null);
  const moveCard = to => {
    if (dragIdx == null || dragIdx === to) return;
    const a = [...cards];
    const [it] = a.splice(dragIdx, 1);
    a.splice(to, 0, it);
    applyCards(a);
    setDragIdx(null);
  };
  const seq = useRef(0);  // 搜索请求序号：只采纳最后一次请求的结果，防旧响应覆盖新结果
  const doSearch = async (term) => {
    const s = String(term != null ? term : q).trim();
    if (!s) return;
    setSel(null);  // 新一次搜索作废旧选中
    const my = ++seq.current;
    try {
      const d = await getJSON(`/api/search?q=${encodeURIComponent(s)}`);
      if (my === seq.current) setItems(d.items || []);
    } catch (e) { console.warn("搜索失败", e); }  // 上游偶发失败时保留上一次结果
  };
  // 输入即搜索：300ms 防抖（中文输入法中间态一并合并）；清空输入自动收起下拉
  useEffect(() => {
    const t = setTimeout(() => {
      if (q.trim()) doSearch(q);
      else { setItems([]); setSel(null); }
    }, 300);
    return () => clearTimeout(t);
  }, [q]);
  return html`<div>
    <div className="topbar">
      <span className="ptabs">
        ${PAGES.map(([k, t]) => html`<button key=${k} className=${k === page ? "on" : ""} onClick=${() => setPage(k)}>${t}</button>`)}
      </span>
      <${ThemeSwitch} theme=${theme} setTheme=${setTheme} />
      <span className="tabs">
        ${GTABS.map(([p, t]) => html`<button key=${p} className=${p === gperiod ? "on" : ""} onClick=${() => setAllPeriod(p)}>${t}</button>`)}
      </span>
      <span className="dtr">
        <${DP} value=${dstart} onPick=${v => setStart(v)} title="开始日期" />
        →
        <${DP} value=${dend} onPick=${v => setEnd(v)} title="结束日期" />
        ${(dstart || dend) && html`<button className="clr" onClick=${() => setDates("", "")}>清除</button>`}
      </span>
     <span style=${{ display: "flex", gap: 8 }}><button className=${"tbtn" + (showTotal ? " on" : "")} title="打开/关闭全部收益抽屉" onClick=${toggleTotal}>全部收益</button><button className=${"tbtn" + (showBt ? " on" : "")} title="回测：选一只标的与区间，按对应周期K线回放收益" onClick=${() => setShowBt(true)}>回测</button></span>
      <span className="search">
        个股：
        <input value=${q} placeholder="请输入名称/代码"
          onChange=${e => { setQ(e.target.value); setSel(null); }}
          onKeyDown=${e => e.key === "Enter" && !e.nativeEvent.isComposing && doSearch()} />
        <button className=${"add" + (sel ? " on" : "")} title="添加选中的个股"
          onClick=${() => sel ? addCard(sel.symbol, sel.name) : (items[0] ? addCard(items[0].symbol, items[0].name) : doSearch())}>＋</button>
        ${items.length > 0 && html`<div className="drop">
          ${items.map(it => html`<div key=${it.symbol} className=${sel && sel.symbol === it.symbol ? "on" : ""} onClick=${() => setSel(it)}>${it.name} <span style=${{ opacity: .5 }}>${it.symbol}</span></div>`)}
        </div>`}
      </span>
    </div>
    ${showTotal && html`<${TotalDrawer} holdings=${holdings} quotes=${quotes} dayPx=${dayPxMap} dend=${dend} cards=${cards} orders=${orders} realizedTotal=${realizedTotal} account=${account}
      onDelOrder=${onDelOrder} onDelHolding=${onDelHolding} onClearOrders=${onClearOrders} onClose=${() => setShowTotal(false)} />`}
    ${showBt && html`<${Backtest} cards=${cards} defStart=${dstart} defEnd=${dend} onClose=${() => setShowBt(false)} theme=${theme} />`}
    <div className="grid">
      ${cards.map((c, i) => html`<${Card} key=${c.symbol} symbol=${c.symbol} name=${c.name} period=${c.period} onPeriod=${setCardPeriod}
        index=${i} onDragStart=${setDragIdx} onDropCard=${moveCard} onDelete=${removeCard}
        dstart=${dstart} dend=${dend} quote=${quotes[c.symbol]} holding=${holdings[c.symbol]} onTrade=${onTrade} theme=${theme} />`) }
    </div>
  </div>`;
}

// 顶部固定条：一行看完「今天哪些标的优异」——左边红色高亮=命中买入口径（可买），
// 右边=多头未走坏且今日上涨的；每 60 秒自动重扫，也可点「刷新」立刻扫
function SignalBar() {
  const [d, setD] = useState(null);   // /api/heat 返回：{items, at}
  const [busy, setBusy] = useState(false);
  const load = async () => {
    setBusy(true);
    try { setD(await getJSON("/api/heat")); }
    catch (e) { console.warn("优异标的扫描失败", e); }
    finally { setBusy(false); }
  };
  useEffect(() => {  // 挂着就每 60 秒静默刷新一次（39 只并发 3 拉日K，约 6 秒，不打断操作）
    load();
    const t = setInterval(load, 60000);
    return () => clearInterval(t);
  }, []);
  const items = (d && d.items) || [];
  const hits = items.filter(it => it.hit).sort((a, b) => b.pct - a.pct);
  const best = items.filter(it => !it.hit && it.pct > 0).sort((a, b) => b.pct - a.pct).slice(0, 8);
  const pc = v => `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
  return html`<div className="sigbar">
    <span className="sigtag">信号</span>
    ${!d && html`<span className="sigph">扫描中…</span>`}
    ${d && hits.length === 0 && html`<span className="sigph">今日无买点</span>`}
    ${hits.map(it => html`<span key=${it.symbol} className=${"sigitem buy" + (it.pct < 0 ? " dn" : "")}
      title=${`${it.name} ${it.symbol} · MA3 ${it.ma3} 在 MA5 ${it.ma5} 上方（金叉区间，每天买 1 万）· ${it.live ? "盘中价" : "休市按最后收盘"}`}>
      <b>●</b>${it.name || it.symbol}<em>${pc(it.pct)}</em><i>可买</i></span>`)}
    ${hits.length > 0 && best.length > 0 && html`<span className="sigsep"></span>`}
    ${best.map(it => html`<span key=${it.symbol} className="sigitem"
      title=${`${it.name} ${it.symbol} · MA3 ${it.ma3} 未站上 MA5 ${it.ma5}（不在买入区间）`}>${it.name || it.symbol}<em>${pc(it.pct)}</em></span>`)}
    <span className="sigend">
      <span className="sigph">${d ? `更新 ${d.at}` : ""}</span>
      <button className="sigre" title="立刻重扫一遍" disabled=${busy} onClick=${load}>${busy ? "扫描中…" : "刷新"}</button>
    </span>
  </div>`;
}

// 页面壳：两个页面级Tab的切换都走这里；卡片/持仓等状态仍在两页组件内，日期与所在页提升到 App 统一管理
// 偏好（所在页 + 历史仓起止日期 + 实时仓开始日期）改存后端 prefs 表，跟库走不跟浏览器走：换浏览器、换访问
// 地址（IDE预览代理:3000 / 正式:8000）都恢复同一份——此前存 localStorage 时按「浏览器+地址」隔离，复制链接
// 到新浏览器会失忆
function App() {
  const [page, setPageState] = useState("hist");
  const [hd, setHd] = useState({ s: "", e: "" });  // 历史仓开始/结束日期
  const [ls, setLs] = useState("");                // 实时仓开始日期（结束日期恒为今天不持久化，留在 LiveApp 内）
  // 主题：默认深色；初值先读 localStorage（仅用于亮色用户首帧不闪深色），真实值随后由 prefs 覆盖
  const [theme, setThemeState] = useState(() => {
    let v = "dark";
    try { v = localStorage.getItem("kp_theme") === "light" ? "light" : "dark"; } catch (e) {}
    document.documentElement.classList.toggle("light", v === "light");  // 首帧前先挂上类，避免闪一下
    return v;
  });
  const [booted, setBooted] = useState(false);     // 偏好未就绪前不渲染页面：避免先按空日期取一轮K线再返工
  useEffect(() => { try { localStorage.setItem("kp_theme", theme); } catch (e) {} }, [theme]);
  useEffect(() => {
    getJSON("/api/prefs").then(d => {
      const p = d.prefs || {};
      // 一次性迁移：后端从未存过的键，若本浏览器 localStorage 还留着旧版存的值，先补种给后端再应用
      const legacy = { page: "kp_page", hist_dstart: "kp_dstart", hist_dend: "kp_dend", live_dstart: "kp_dstart_live", theme: "kp_theme" };
      const seed = {};
      for (const k in legacy) {
        if (!(k in p)) { try { const v = localStorage.getItem(legacy[k]); if (v != null) seed[k] = v; } catch (e) {} }
      }
      const apply = q => {
        setPageState(q.page === "live" ? "live" : "hist");
        // 旧版本可选到未来日期：库里存的截止日若晚于今天，进页面就夹回今天并写回，避免图表停在未来
        const p2 = n => String(n).padStart(2, "0"), t0 = new Date();
        const tdy = `${t0.getFullYear()}-${p2(t0.getMonth() + 1)}-${p2(t0.getDate())}`;
        const e0 = q.hist_dend && q.hist_dend > tdy ? tdy : (q.hist_dend || "");
        if (e0 !== (q.hist_dend || "")) put({ hist_dend: e0 });
        setHd({ s: q.hist_dstart || "", e: e0 });
        setLs(q.live_dstart || "");
        // 主题：先把类名挂到 <html> 再 setState——子组件的建图 effect 会在父组件 effect 之前跑，
        // 类名晚一步就会让卡片图读到旧主题的变量值（亮色点了变不回、或反之）
        const t = q.theme === "light" ? "light" : "dark";
        document.documentElement.classList.toggle("light", t === "light");
        setThemeState(t);
        setBooted(true);
      };
      if (Object.keys(seed).length)
        sendJSON("/api/prefs", "PUT", { prefs: seed }).catch(e => console.warn("旧偏好迁移失败", e)).finally(() => apply({ ...p, ...seed }));
      else apply(p);
    }).catch(e => { console.error("偏好加载失败", e); setBooted(true); });  // 偏好拿不到也不卡页面，按默认值进
  }, []);
  const put = prefs => sendJSON("/api/prefs", "PUT", { prefs }).catch(e => console.warn("偏好保存失败", e));
  const setPage = k => { setPageState(k); put({ page: k }); };
  // 切主题：先同步改 <html> 类名（同上，必须早于子组件重绘），再记库
  const setTheme = t => {
    document.documentElement.classList.toggle("light", t === "light");
    setThemeState(t);
    put({ theme: t });
  };
  // 差量写库：改哪个键只 PUT 哪个键——全量写两个键会被其他标签页的旧内存值反向覆盖
  //（旧页选一次结束日期会把其内存里的旧起始日期写回库，盖掉新选的值）
  const setStart = s => { setHd(h => ({ ...h, s })); put({ hist_dstart: s }); };
  const setEnd = e => { setHd(h => ({ ...h, e })); put({ hist_dend: e }); };
  const setDates = (s, e) => { setHd({ s, e }); put({ hist_dstart: s, hist_dend: e }); };  // 仅「清除」用：两键同时清空
  const setLiveStart = v => { setLs(v); put({ live_dstart: v }); };
  if (!booted) return html`<div></div>`;
  // 顶部固定条放在两页之外：切历史仓/实时仓都不重建，省掉每切一次重扫 39 只
  return html`<${React.Fragment}>
    <${SignalBar} />
    ${page === "hist"
      ? html`<${HistApp} page=${page} setPage=${setPage} dstart=${hd.s} dend=${hd.e} setStart=${setStart} setEnd=${setEnd} setDates=${setDates} theme=${theme} setTheme=${setTheme} />`
      : html`<${LiveApp} page=${page} setPage=${setPage} dstart=${ls} setDstart=${setLiveStart} theme=${theme} setTheme=${setTheme} />`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
