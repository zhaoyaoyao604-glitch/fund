  .search-live .add-live.on-live { box-shadow: 0 0 0 3px rgba(249,149,2,.22); }  /* 已选中个股，提示可点击添加 */
  .drop-live { position: absolute; top: 32px; right: 0; background: #fff; border: 1px solid #eee; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 10; min-width: 240px; max-height: 260px; overflow: auto; }
  .drop-live div { padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .drop-live div:hover { background: #fff7ea; }
  .drop-live div.on-live { background: #ffedd1; box-shadow: inset 3px 0 0 #f99502; }  /* 选中的结果行 */
  .tbtn-live { border: 1px solid #f99502; background: #fff; color: #f99502; border-radius: 4px;
    padding: 3px 14px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
  .tbtn-live:hover { background: #fff7ea; }
  .tbtn-live.on-live { background: #f99502; color: #fff; }
  /* 全部收益抽屉：右侧滑出、页面不变暗；点抽屉外/×/Esc 关闭 */
  .drawer-mask-live { position: fixed; inset: 0; z-index: 40; }
  .drawer-live { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 94vw); background: #fff;
    box-shadow: -8px 0 28px rgba(0,0,0,.16); display: flex; flex-direction: column; animation: dslide .18s ease-out; }
  @keyframes dslide { from { transform: translateX(100%); } }
  .dhd-live { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 8px; }
  .dhd-live .dtitle-live { font-size: 17px; font-weight: 700; color: #333; }

  .dhd-live .dclose-live:hover { color: #333; }
  .dtabs-live { display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid #eee; }

    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .dtabs-live button:hover { color: #f99502; }
  .dtabs-live button.on-live { color: #333; font-weight: 600; border-bottom-color: #f99502; }
  .dbody-live { flex: 1; overflow-y: auto; padding: 6px 20px 20px; }

  /* 持仓明细：名称/现价/成本/数量/可卖/市值/盈亏金额/盈亏%/买入时间/删除 十列（与历史仓同构） */
  .hhd-live, .hrow-live { display: grid; grid-template-columns: 1.5fr .8fr .8fr .7fr .7fr 1fr .9fr .8fr 1.3fr 28px; gap: 6px; align-items: center;
    font-size: 13px; }

  .hrow-live { padding: 9px 0; border-bottom: 1px solid #f5f6f7; }
  .hhd-live span, .hrow-live > span { text-align: right; }
  .hhd-live span:first-child, .hrow-live .hnm-live { text-align: left; }
  .hrow-live .hnm-live { color: #333; line-height: 1.35; }
  .hrow-live .hnm-live i { display: block; font-style: normal; color: #999; font-size: 11px; margin-left: 0; }
  .hrow-live .hbt-live { font-size: 12px; color: #666; white-space: nowrap; line-height: 1.35; }
  .hrow-live .hbt-live i { display: block; font-style: normal; color: #999; }
  /* 订单列表：买入红/卖出绿，卖出行右侧挂共收益，末列行删除；fr 网格自适应，窄抽屉下不横向溢出 */
  .orow-live { display: grid; grid-template-columns: 44px minmax(0,1.1fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,1.2fr) minmax(0,1.2fr) 28px;
    gap: 6px; align-items: baseline; padding: 10px 0; font-size: 13px; border-bottom: 1px solid #f5f6f7; }
  .orow-live > * { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .orow-live .act-live { font-weight: 600; }
  .orow-live .onm-live { color: #333; }
  .orow-live .ocode-live { color: #999; font-size: 12px; }
  .orow-live .opx-live, .orow-live .oqt-live { color: #333; text-align: right; }
  .orow-live .odt-live { color: #999; font-size: 12px; }
  .orow-live .opl-live { text-align: right; color: #666; font-size: 12px; }
  .orow-live .opl-live b { font-size: 14px; font-weight: 700; margin: 0 3px; }
  .odel-live { border: 0; background: none; color: #ccc; font-size: 13px; cursor: pointer; padding: 0 2px; justify-self: end; }
  .odel-live:hover { color: #e64340; }
  .dnote-live { color: #c0c0c0; font-size: 12px; text-align: center; padding: 16px 0 6px; }

</style>

<body>
<div id="root"></div>
<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useRef } = React;

// 卡片列表已改为持久化：首屏从 GET /api/cards 加载，种子自选股见 server/main.py 的 SEED_CARDS
const TABS = [["min", "分时"], ["day5", "5日"], ["m5", "5分"], ["m30", "30分"], ["m60", "60分"], ["day", "日K"]];
const UP = "#e64340", DN = "#1fa37a"; // 国内红涨绿跌
const MAS = [["ma3", "#e6a23c"], ["ma5", "#409eff"], ["ma85", "#2f855a"], ["ma125", "#805ad5"]]; // 均线3/5/85/125：键名与后端 ind 一致
// 双击 HTML（file://）或本地预览服务器（如 VSCode Live Preview，本机非 8000 端口）打开时，接口指向本机后端；
// 经 uvicorn 托管打开或线上部署时，用同源相对路径
const API_BASE = (location.protocol === "file:" ||
  ((location.hostname === "127.0.0.1" || location.hostname === "localhost") && location.port !== "8000"))
  ? "http://127.0.0.1:8000" : "";

async function getJSON(url) {
  const r = await fetch(API_BASE + url);
  const d = await r.json();
  if (d.error || d.detail) throw new Error(d.error || d.detail);
  return d;
}

// 交易类写操作（POST/DELETE）：与 getJSON 同样把后端 {error|detail} 抛成异常给调用方显示
async function sendJSON(url, method, body) {
  const r = await fetch(API_BASE + url, {
    method, headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json();
  if (d.error || d.detail) throw new Error(d.error || d.detail);
  return d;
}

// 把整份卡片列表回写后端 SQLite（增/删/拖拽排序/切换周期都会全量保存）
async function saveCards(list) {
  try {
    await fetch(API_BASE + "/api/cards", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards: list }),
    });
  } catch (e) { console.error("卡片保存失败", e); }
}

// datetime-local 输入值（本机时区、到分钟）：YYYY-MM-DDTHH:mm，买卖气泡的默认成交时间
const nowLocal = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

function kOpt(d, zoomAll) {
  const rows = d.klines || [];
  const cats = rows.map(r => r[0]);
  const ind = d.ind || {};
  const k = rows.map(r => [+r[1], +r[2], +r[4], +r[3]]); // 东财/腾讯序: o,c,h,l -> echarts: o,c,l,h
  const macd = ind.macd || [];
  const cls = rows.map(r => +r[2]);
  const base = cls.length > 1 ? cls[cls.length - 2] : (cls[0] || 1);  // 涨跌%基准：昨收(倒数第二根收盘)
  let lo = Math.min(...k.map(v => v[2])), hi = Math.max(...k.map(v => v[3]));
  // 85/125日均线含窗口外预热段的价格（如大跌后均线远高于图内K线），Y轴范围须并入均线值，防均线被上下边缘裁掉
  MAS.forEach(([key]) => (ind[key] || []).forEach(v => {
    if (v == null) return;
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }));
  if (!(hi > lo)) { lo *= 0.999; hi = hi * 1.001 || 1; }  // 防单根K线除零
  return {
    animation: false,
    // 十字光标只保留三轴指针标签（左股价/右涨跌%/底部日期），不弹白色浮窗
    tooltip: { trigger: "axis", showContent: false, axisPointer: { type: "cross", link: [{ xAxisIndex: "all" }] } },
    grid: [
      { left: 44, right: 48, top: 8, height: "55%" },
      { left: 44, right: 48, top: "66%", height: "20%" },  // 与主图间隙缩到3%，副图略加高
    ],
    xAxis: [
      { type: "category", data: cats, gridIndex: 0, axisLabel: { show: false } },
      { type: "category", data: cats, gridIndex: 1 },
    ],
    yAxis: [
      { scale: false, min: lo, max: hi, gridIndex: 0,                      // 左：价格
        axisPointer: { label: { show: true, formatter: p => (+p.value).toFixed(3) } } },
      { scale: true, gridIndex: 1, splitLine: { show: false } },           // 中：MACD
      { scale: false, min: lo, max: hi, gridIndex: 0, position: "right",  // 右：涨跌%（与价格同min/max严格对齐）
        axisLine: { show: false }, splitLine: { show: false },
        axisLabel: { formatter: v => ((v - base) / base * 100).toFixed(2) + "%" },
        axisPointer: { label: { show: true, formatter: p => ((p.value - base) / base * 100).toFixed(2) + "%" } } },
    ],
    dataZoom: [{ type: "inside", xAxisIndex: [0, 1], start: zoomAll ? 0 : 80, end: 100 }],  // 平时只看最后60根；有日期筛选时显示整个区间
    series: [
      { name: "K", type: "candlestick", data: k,
        itemStyle: { color: UP, color0: DN, borderColor: UP, borderColor0: DN } },
      ...MAS.map(([key, c]) => ({ name: key.toUpperCase(), type: "line", data: ind[key], showSymbol: false, lineStyle: { width: 1, color: c } })),
      { name: "MACD", type: "bar", xAxisIndex: 1, yAxisIndex: 1, data: macd.map(v => v == null ? null : { value: v, itemStyle: { color: v >= 0 ? UP : DN } }) },
      { name: "DIF", type: "line", xAxisIndex: 1, yAxisIndex: 1, data: ind.dif, showSymbol: false, lineStyle: { width: 1, color: "#333" } },
      { name: "DEA", type: "line", xAxisIndex: 1, yAxisIndex: 1, data: ind.dea, showSymbol: false, lineStyle: { width: 1, color: "#e6a23c" } },
    ],
  };
}

function lineOpt(pts, base) {
  const ys = pts.length ? pts.map(p => p[1]) : [1];
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (!(hi > lo)) { lo *= 0.999; hi = hi * 1.001 || 1; }
  base = base || ys[0] || 1;  // 分时%基准：昨收，缺省用首价
  return {
    animation: false,
    // 同 K 线：只要三轴指针标签，不要白色浮窗
    tooltip: { trigger: "axis", showContent: false, axisPointer: { type: "cross" } },
    grid: { left: 44, right: 48, top: 8, bottom: 20 },
    xAxis: { type: "category", data: pts.map(p => p[0]) },
    yAxis: [
      { scale: false, min: lo, max: hi,
        axisPointer: { label: { show: true, formatter: p => (+p.value).toFixed(3) } } },
      { scale: false, min: lo, max: hi, position: "right", axisLine: { show: false }, splitLine: { show: false },
        axisLabel: { formatter: v => ((v - base) / base * 100).toFixed(2) + "%" },
        axisPointer: { label: { show: true, formatter: p => ((p.value - base) / base * 100).toFixed(2) + "%" } } },
    ],
    dataZoom: [{ type: "inside" }],
    series: [{ type: "line", data: ys, showSymbol: false, lineStyle: { color: "#f99502" } }],
  };
}

function Card({ symbol, name, period, onPeriod, dstart, dend, index, onDragStart, onDropCard, onDelete, quote, holding, onTrade }) {
  const ref = useRef();
  const tradeRef = useRef();  // 交易行（含气泡）引用：用于判断气泡外点击
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(true);
  // 卡片内联交易：form=null 只显示按钮；点买/卖弹出气泡（时间/价格/总价/数量±100，总价↔数量自动换算），提交走 POST /api/orders
  const [form, setForm] = useState(null);
  const [fprice, setFprice] = useState("");
  const [fqty, setFqty] = useState("");
  const [ftime, setFtime] = useState("");  // 成交时间：默认顶栏结束日期（空则开始日期）＋当前钟点，可改
  const [terr, setTerr] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState("");
  const [dayPx, setDayPx] = useState(null);  // 选了结束日期时：截止日最后一根K线收盘与前一根收盘（当日股价/涨跌基准）
  const [zoom, setZoom] = useState(false);  // 放大视图：右上角放大icon → 大图弹层
  const zref = useRef();
  const [zload, setZload] = useState(false);
  const [zerr, setZerr] = useState("");
  useEffect(() => {
    const chart = echarts.init(ref.current);
    let dead = false;
    setErr(""); setLoading(true); setDayPx(null);
    (async () => {
      try {
        if (period === "day5") throw new Error("5日待接入(东财 trends2)");
        if (period === "min") {
          const d = await getJSON(`/api/minute?symbol=${symbol}`);
          const pts = (d.points || []).map(s => { const a = s.split(" "); return [a[0], +a[1]]; });
          chart.setOption(lineOpt(pts, +((d.quote || [])[4])), true);  // quote[4]=昨收
        } else {
          const dr = (dstart || dend) ? `&start=${dstart}&end=${dend}` : "";
          const d = await getJSON(`/api/kline?symbol=${symbol}&period=${period}&limit=300${dr}`);
          chart.setOption(kOpt(d, Boolean(dstart || dend)), true);
          const tail = d.tail || [];  // 截止日收盘：不晚于结束日期的最后两根K线（区间落在周末等非交易日、图内为空时也能取到"当日价"）
          if (dend && tail.length >= 2)
            setDayPx({ price: +tail[tail.length - 1][2], prev: +tail[tail.length - 2][2] });
        }
      } catch (e) { if (!dead) setErr(String(e.message || e)); }
      finally { if (!dead) setLoading(false); }
    })();
    const onRs = () => chart.resize();
    window.addEventListener("resize", onRs);
    return () => { dead = true; window.removeEventListener("resize", onRs); chart.dispose(); };
  }, [symbol, period, dstart, dend]);
  // 买卖气泡：点气泡外或按 Esc 关闭（两个买卖按钮在 tradeRef 内，点按钮不触发外部关闭，由按钮自己切换）
  useEffect(() => {
    if (!form) return;
    const onDoc = e => { if (tradeRef.current && !tradeRef.current.contains(e.target)) setForm(null); };
    const onKey = e => e.key === "Escape" && setForm(null);
    document.addEventListener("mousedown", onDoc);
    window.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); window.removeEventListener("keydown", onKey); };
  }, [form]);
  // 现价/涨跌：无结束日期走 App 批量报价（各卡一致）；选了结束日期则取截止日最后一根K线收盘=当日价，
  // 涨跌基准=前一根收盘（与图右轴%口径一致，颜色随当日涨跌）
  const px = dayPx ? dayPx.price : (quote ? quote.price : null);
  const prevPx = dayPx ? dayPx.prev : (quote ? quote.prev : null);
  const chg = px != null && prevPx ? (px - prevPx) / prevPx * 100 : null;
  // 持仓盈亏按「当天价」算：无日期筛选=实时报价；选结束日期=截止日收盘（持仓集合已随视点回放，
  // 视点早于建仓日时无持仓自然不显示——26号回看不到27号买的仓）
  const pl = px != null && holding ? (px - holding.cost) * holding.shares : null;
  const plpct = px != null && holding && holding.cost ? (px - holding.cost) / holding.cost * 100 : null;
  const sellable = holding ? (holding.sellable != null ? holding.sellable : holding.shares) : 0;  // 可卖数量：A股当日买入的份额 T+1 锁到明日，仅锁卖出按钮，盈亏照常显示
  const flag = symbol.startsWith("hk") ? "hk" : symbol.startsWith("us") ? "us" : "";
  const openForm = side => {
    if (side === "sell" && sellable <= 0) return;
    if (form === side) { setForm(null); return; }  // 再点同一按钮＝收起气泡
    const now = nowLocal(), day = dend || dstart;  // 买入/卖出时间默认 = 顶栏结束日期当天 0 点（空则开始日期当天；都无则当前时刻）
    setForm(side); setTerr("");
    setFprice(px != null ? String(px) : "");       // 价格默认当天股价（选了结束日期=截止日收盘，否则实时现价）；卖出数量默认全部可卖，买入默认100
    setFqty(side === "sell" ? String(sellable) : "100");
    setFtime(day ? day + "T00:00" : now);
  };
  // 总价只展示不输入：总价 = 价格 × 数量，价格或数量任一变化即重算；价格或数量无效时显示 —（两位小数）
  const fmtAmt = x => String(Math.round(x * 100) / 100);
  const p = parseFloat(fprice), q = parseFloat(fqty);
  const famtShow = p > 0 && q > 0 ? fmtAmt(p * q) : "—";
  const onPrice = v => setFprice(v);
  const onQty = v => setFqty(v);
  const stepQty = d => onQty(String(Math.max(0, (parseFloat(fqty) || 0) + d * 100)));  // 数量加减，每次100
  // —— 放大视图：独立大图弹层，取数与卡片同口径（day5 占位/分时 lineOpt/其余 kOpt），Esc/遮罩/✕ 关闭 ——
  useEffect(() => {
    if (!zoom) return;
    const chart = echarts.init(zref.current);
    let dead = false;
    setZerr(""); setZload(true);
    (async () => {
      try {
        if (period === "day5") throw new Error("5日待接入(东财 trends2)");
        if (period === "min") {
          const d = await getJSON(`/api/minute?symbol=${symbol}`);
          const pts = (d.points || []).map(s => { const a = s.split(" "); return [a[0], +a[1]]; });
          chart.setOption(lineOpt(pts, +((d.quote || [])[4])), true);
        } else {
          const dr = (dstart || dend) ? `&start=${dstart}&end=${dend}` : "";
          const d = await getJSON(`/api/kline?symbol=${symbol}&period=${period}&limit=300${dr}`);
          chart.setOption(kOpt(d, Boolean(dstart || dend)), true);
        }
      } catch (e) { if (!dead) setZerr(String(e.message || e)); }
      finally { if (!dead) setZload(false); }
    })();
    const onRs = () => chart.resize();
    window.addEventListener("resize", onRs);
    return () => { dead = true; window.removeEventListener("resize", onRs); chart.dispose(); };
  }, [zoom, symbol, period, dstart, dend]);
  useEffect(() => {
    if (!zoom) return;
    const onKey = e => e.key === "Escape" && setZoom(false);
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [zoom]);
  const submitTrade = async () => {
    const price = parseFloat(fprice), qty = parseFloat(fqty);
    if (!(price > 0) || !(qty > 0)) { setTerr("价格/数量需大于0"); return; }
    setBusy(true); setTerr("");
    try {
      await sendJSON("/api/orders", "POST", { symbol, name, side: form, price, qty, ts: ftime });
      setForm(null); setDone(form); setTimeout(() => setDone(""), 1500);
      onTrade();  // 刷新持仓/订单/汇总（不在卡里的新持仓会随 symKey 联动补报价）
    } catch (e) { setTerr(String(e.message || e)); }
    finally { setBusy(false); }
  };
  return html`<div className="card"
    onDragOver=${e => e.preventDefault()}
    onDrop=${() => onDropCard(index)}>
    <button className="del zbtn" title="放大" onClick=${() => setZoom(true)}><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 5V1h4M7 1h4v4M11 7v4H7M5 11H1V7" fill="none" stroke="currentColor" strokeWidth="1.4"/></svg></button>
    <button className="del" title="删除卡片" onClick=${() => onDelete(symbol)}>✕</button>
    <div className="hd">
      <span className="grip" draggable="true"
        onDragStart=${e => { e.dataTransfer.setData("text/plain", String(index)); e.dataTransfer.effectAllowed = "move"; onDragStart(index); }}>
        ≡ <b>${name}</b><span style=${{ opacity: .55, fontSize: 12 }}>${symbol}</span>${flag && html`<img className="flag" draggable="false" src=${"vendor/flags/" + flag + ".svg"} alt="" />`}
      </span>
      <div className="hrow2">
        <span>${px != null && chg != null && html`<span className=${"px" + (chg > 0 ? " up" : chg < 0 ? " dn" : "")}>${px}</span><span className=${"chg" + (chg > 0 ? " up" : chg < 0 ? " dn" : "")}>${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`}</span>
        ${holding && pl != null && html`<span className="hold">持仓盈亏<b className=${pl >= 0 ? "up" : "dn"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b><span className=${plpct >= 0 ? "up" : "dn"}>${plpct >= 0 ? "+" : ""}${plpct.toFixed(2)}%</span></span>`}
      </div>
      <div className="tabrow">
        <span className="tabs">
          ${TABS.map(([p, t]) => html`<button key=${p} className=${p === period ? "on" : ""} onClick=${() => onPeriod(symbol, p)}>${t}</button>`)}
        </span>
        <div className="trade" ref=${tradeRef}>
          <button className="tbn" disabled=${busy} onClick=${() => openForm("buy")}>${done === "buy" ? "已买入" : "买入"}</button>
          <button className="tbn sell" disabled=${sellable <= 0 || busy}
            title=${sellable > 0 ? "可卖 " + sellable : holding ? "A股当日买入，次日可卖" : "无持仓"}
            onClick=${() => openForm("sell")}>${done === "sell" ? "已卖出" : "卖出"}</button>
          ${form && html`<div className="pop">
            <div className="prow">
              <label>${form === "buy" ? "买入时间" : "卖出时间"}</label>
              <input type="datetime-local" value=${ftime} onChange=${e => setFtime(e.target.value)} />
            </div>
            <div className="prow">
              <label>价格</label>
              <input type="number" step="any" min="0" value=${fprice} onChange=${e => onPrice(e.target.value)} placeholder="价格" />
            </div>
            <div className="prow">
              <label>数量</label>
              <button className="step" disabled=${busy} onClick=${() => stepQty(-1)}>−</button>
              <input type="number" step="any" min="0" value=${fqty} onChange=${e => onQty(e.target.value)} placeholder="数量" />
              <button className="step" disabled=${busy} onClick=${() => stepQty(1)}>＋</button>
            </div>
            <div className="prow">
              <label>总价</label>
              <b className="amt">${famtShow}</b>
            </div>
            ${terr && html`<span className="terr">${terr}</span>`}
            <div className="pact">
              <button className="tbn ok" disabled=${busy} onClick=${submitTrade}>${busy ? "提交中…" : "确认"}</button>
              <button className="tbn" style=${{ borderColor: "#d9d9de", color: "#999", background: "#fff" }} disabled=${busy} onClick=${() => setForm(null)}>取消</button>
            </div>
          </div>`}
        </div>
      </div>
    </div>
    <div className="chart" ref=${ref}></div>
    ${loading && !err && html`<div className="ld">加载中…</div>`}
    ${err && html`<div className="err">${err}</div>`}
    ${zoom && html`<div className="zmask" onClick=${() => setZoom(false)}>
      <div className="zpanel" onClick=${e => e.stopPropagation()}>
        <div className="zhd">
          <b>${name}</b>
          <span style=${{ opacity: .55, fontSize: 12 }}>${symbol} · ${(TABS.find(t => t[0] === period) || ["", ""])[1]}</span>
          ${px != null && chg != null && html`<span className="px">${px}</span><span className=${chg > 0 ? "up" : chg < 0 ? "dn" : ""} style=${{ fontSize: 12, fontWeight: 600 }}>${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`}
          <button className="zclose" title="关闭" onClick=${() => setZoom(false)}>✕</button>
        </div>
        <div className="zchart" ref=${zref}></div>
        ${zload && !zerr && html`<div className="znote">加载中…</div>`}
        ${zerr && html`<div className="znote" style=${{ color: "#e64340" }}>${zerr}</div>`}
      </div>
    </div>`}
  </div>`;
}

// 全部收益抽屉（hist）：右侧滑出。持仓/订单/已实现收益/可用资金均随回放视点截断（as_of）；
// 持仓 tab 价格锚定视点：选了结束日期用截止日收盘（dayPx 与卡片同源），无则批量报价实时算
function TotalDrawer({ holdings, quotes, dayPx, dend, cards, orders, realizedTotal, account, onDelOrder, onDelHolding, onClose }) {
  const [tab, setTab] = useState("hold");
  useEffect(() => {  // Esc 关闭，同时锁住页面滚动
    const onKey = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [onClose]);
  const names = {};
  cards.forEach(c => { names[c.symbol] = c.name; });
  // 价格锚定回放视点：选了结束日期只用截止日收盘（dayPx 与卡片同源），未取到/无数据显示 —，绝不回落实时报价
  // （历史视点混入当前价格会算出假盈亏）；无结束日期用实时报价。全部持仓行都列出，
  // 汇总只统计有价的行；全部收益% = 总盈亏 / 总成本（与原汇总条口径一致）
  const rows = Object.entries(holdings).map(([s, h]) => ({ s, ...h, p: dayPx[s] ? dayPx[s].price : (dend ? null : (quotes[s] ? quotes[s].price : null)) }));
  const valid = rows.filter(x => x.p != null);
  const tCost = valid.reduce((a, x) => a + x.shares * x.cost, 0);
  const tMv = valid.reduce((a, x) => a + x.shares * x.p, 0);
  const tFloat = tMv - tCost;                // 浮动盈亏
  const tPl = tFloat + realizedTotal;        // 全部收益 = 浮动 + 已实现（卖出落袋）
  const tPct = tCost ? tPl / tCost * 100 : 0;
  return html`<div className="drawer-mask" onClick=${onClose}>
    <div className="drawer" onClick=${e => e.stopPropagation()}>
      <div className="dhd">
        <span className="dtitle">全部收益</span>
        <button className="dclose" title="关闭" onClick=${onClose}>✕</button>
      </div>
      <div className="dtabs">
        <button className=${tab === "hold" ? "on" : ""} onClick=${() => setTab("hold")}>持仓(${Object.keys(holdings).length})</button>
        <button className=${tab === "order" ? "on" : ""} onClick=${() => setTab("order")}>订单</button>
      </div>
      <div className="dbody">
        ${tab === "hold" ? html`<div>
          <div className="dtot">
            <span>全部收益<b className=${tPl >= 0 ? "up" : "dn"}>${tPl >= 0 ? "+" : ""}${tPl.toFixed(2)}</b><span className=${tPct >= 0 ? "up" : "dn"}>(${tPct >= 0 ? "+" : ""}${tPct.toFixed(2)}%)</span></span>
            ${realizedTotal !== 0 && html`<span>已实现<b className=${realizedTotal >= 0 ? "up" : "dn"}>${realizedTotal >= 0 ? "+" : ""}${realizedTotal.toFixed(2)}</b></span>`}
            ${account && html`<span>总资产<b>${(account.cash + tMv).toFixed(2)}</b></span><span>可用资金<b>${account.cash.toFixed(2)}</b></span>`}
            <span>总市值<b>${tMv.toFixed(2)}</b></span>
            <span>总成本<b>${tCost.toFixed(2)}</b></span>
          </div>
          <div className="hhd"><span>名称</span><span>现价</span><span>成本</span><span>数量</span><span title="A股当日买入的份额次日可卖（T+1）">可卖</span><span>市值</span><span>盈亏金额</span><span>盈亏%</span><span>买入时间</span><span>删除</span></div>
          ${rows.map(x => {
            const pl = x.p != null ? (x.p - x.cost) * x.shares : null;
            const plp = x.p != null && x.cost ? (x.p - x.cost) / x.cost * 100 : null;
            return html`<div className="hrow" key=${x.s}>
              <span className="hnm">${names[x.s] || x.name || x.s}<i>${x.s}</i></span>
              <span>${x.p != null ? x.p.toFixed(3) : "—"}</span>
              <span>${x.cost.toFixed(3)}</span>
              <span>${x.shares}</span>
              <span>${x.sellable != null ? x.sellable : x.shares}</span>
              <span>${x.p != null ? (x.shares * x.p).toFixed(2) : "—"}</span>
              <span className="hpl">${pl != null ? html`<b className=${pl >= 0 ? "up" : "dn"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b>` : "—"}</span>
              <span className="hpp">${plp != null ? html`<span className=${plp >= 0 ? "up" : "dn"}>${plp >= 0 ? "+" : ""}${plp.toFixed(2)}%</span>` : "—"}</span>
              <span className="hbt">${x.buy_ts ? html`${x.buy_ts.slice(0, 10)}<i>${x.buy_ts.slice(11)}</i>` : "—"}</span>
              <button className="odel" title="删除此持仓：该标的全部买卖流水一并清除" onClick=${() => onDelHolding(x.s)}>✕</button>
            </div>`;
          })}
        </div>` : html`<div>
          ${orders.length ? html`${orders.map(o => html`<div className="orow" key=${o.id}>
            <b className=${"act " + (o.side === "buy" ? "up" : "dn")}>${o.side === "buy" ? "买入" : "卖出"}</b>
            <span className="onm">${o.name}</span>
            <span className="ocode">${o.symbol}</span>
            <span className="opx">${o.price.toFixed(2)}元</span>
            <span className="oqt">${+o.qty}股</span>
            <span className="odt">${o.ts}</span>
            <span className="opl">${o.realized != null && html`共收益<b className=${o.realized >= 0 ? "up" : "dn"}>${o.realized >= 0 ? "+" : ""}${o.realized.toFixed(2)}</b>元`}</span>
            <button className="odel" title="删除此笔记录" onClick=${() => onDelOrder(o.id)}>✕</button>
          </div>`)}
          <div className="dnote">买入行的收益体现在持仓盈亏中；删除任一记录后持仓与收益自动重算</div>`
          : html`<div className="dnote">暂无交易记录，去卡片点「买入」模拟一笔</div>`}
        </div>`}
      </div>
    </div>
  </div>`;
}

const GTABS = [["min", "分时"], ["day5", "5日"], ["m5", "5分"], ["m30", "30分"], ["m60", "60分"], ["day", "日K"], ["other", "其他"]];
const PAGES = [["hist", "历史模拟仓"], ["live", "实时跟随仓"]];  // 页面级Tab：hist=历史模拟仓（原表、原class）；live=实时跟随仓（表加 _live、class 加 -live，实现见下方克隆区）

// 日期选择器（历史仓）：点按钮弹出自绘日历浮层——原生 date 输入无法把特定日期置灰禁用；
// 周六/周日格子置灰且不可点，value 为空时按钮显示占位文字，选中日期回调 onPick("YYYY-MM-DD") 并收起；
// 点标题「2026年9月」上翻到选月视图、再点「2026年」上翻到选年视图（‹/›：日视图翻月、月视图翻年、年视图翻12年）
function DP({ value, onPick, title }) {
  const [open, setOpen] = useState(false);
  const [vym, setVym] = useState("");       // 面板浏览中的月份 YYYY-MM（每次打开按 value/今天重置）
  const [view, setView] = useState("day");  // day=日历 / month=选月 / year=选年
  const pad2 = n => String(n).padStart(2, "0");
  const d0 = new Date(), today = `${d0.getFullYear()}-${pad2(d0.getMonth() + 1)}-${pad2(d0.getDate())}`;
  const openCal = () => { setVym((value || today).slice(0, 7)); setView("day"); setOpen(true); };
  const shift = delta => {  // 上一页/下一页（跨年由 Date 归一）：日视图翻1月，月视图翻1年，年视图翻12年
    const [y, m] = vym.split("-").map(Number);
    const t = view === "year" ? new Date(y + delta * 12, m - 1, 1)
      : new Date(y, m - 1 + (view === "month" ? delta * 12 : delta), 1);
    setVym(`${t.getFullYear()}-${pad2(t.getMonth() + 1)}`);
  };
  let panel = null;
  if (open) {
    const [y, m] = vym.split("-").map(Number);
    let head, body;
    if (view === "year") {  // 选年：以浏览年为中心前后各推，点某年回选月视图
      head = html`<b>${y - 5}年 - ${y + 6}年</b>`;
      body = html`<div className="dp-ym">
        ${Array.from({ length: 12 }, (_, i) => { const yy = y - 5 + i;
          const cls = "dp-d" + (String(yy) === value.slice(0, 4) ? " sel" : "") + (String(yy) === today.slice(0, 4) ? " td" : "");
          return html`<button key=${yy} className=${cls}
            onClick=${() => { setVym(`${yy}-${pad2(m)}`); setView("month"); }}>${yy}</button>`; })}
      </div>`;
    } else if (view === "month") {  // 选月：点某月回日历视图
      head = html`<b onClick=${() => setView("year")}>${y}年</b>`;
      body = html`<div className="dp-ym">
        ${Array.from({ length: 12 }, (_, i) => { const ym = `${y}-${pad2(i + 1)}`;
          const cls = "dp-d" + (ym === value.slice(0, 7) ? " sel" : "") + (ym === today.slice(0, 7) ? " td" : "");
          return html`<button key=${ym} className=${cls}
            onClick=${() => { setVym(ym); setView("day"); }}>${i + 1}月</button>`; })}
      </div>`;
    } else {  // 日历：周六/周日置灰且不可点
      head = html`<b onClick=${() => setView("month")}>${y}年${m}月</b>`;
      const first = (new Date(y, m - 1, 1).getDay() + 6) % 7;  // 当月1号前的空位数（周一为首列）
      const days = new Date(y, m, 0).getDate();
      body = html`<div>
        <div className="dp-wk">${["一", "二", "三", "四", "五", "六", "日"].map((w, i) => html`<span key=${i} className=${i > 4 ? "w" : ""}>${w}</span>`)}</div>
        <div className="dp-grid">
          ${Array.from({ length: first }, (_, i) => html`<span key=${ "b" + i }></span>`)}
          ${Array.from({ length: days }, (_, i) => {
            const ds = `${y}-${pad2(m)}-${pad2(i + 1)}`;
            const wk = (first + i) % 7 >= 5;  // 周六/周日：禁用置灰
            const cls = "dp-d" + (ds === value ? " sel" : "") + (ds === today ? " td" : "");
            return html`<button key=${ds} className=${cls} disabled=${wk}
              onClick=${() => { onPick(ds); setOpen(false); }}>${i + 1}</button>`;
          })}
        </div>
      </div>`;
    }
    panel = html`<span>
      <div className="dp-mask" onClick=${() => setOpen(false)}></div>
      <div className="dp-panel">
        <div className="dp-nav">
          <button onClick=${() => shift(-1)}>‹</button>
          ${head}
          <button onClick=${() => shift(1)}>›</button>
        </div>
        ${body}
      </div>
    </span>`;
  }
  return html`<span className="dp">
    <button className=${"dp-btn" + (value ? "" : " ph")} title=${title} onClick=${() => open ? setOpen(false) : openCal()}>${value || title}</button>
    ${panel}
  </span>`;
}


// ==================== 实时跟随仓（live）克隆区 ====================
// CardLive / TotalDrawerLive / LiveApp 为上方历史模拟仓各组件的完整克隆：
// 前端 class 一律带 -live 后缀、后端表带 _live 后缀、读写接口带 ?scope=live；两套代码可独立修改互不影响。

// live 页卡片列表回写（PUT /api/cards?scope=live）
async function saveCardsLive(list) {
  try {
    await fetch(API_BASE + "/api/cards?scope=live", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards: list }),
    });
  } catch (e) { console.error("卡片保存失败(live)", e); }
}

function CardLive({ symbol, name, period, onPeriod, dstart, dend, index, onDragStart, onDropCard, onDelete, quote, holding, onTrade }) {
  const ref = useRef();
  const tradeRef = useRef();  // 交易行（含气泡）引用：用于判断气泡外点击
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(true);
  // 卡片内联交易：form=null 只显示按钮；点买/卖弹出气泡（时间/价格/数量±100），提交走 POST /api/orders
  const [form, setForm] = useState(null);
  const [fprice, setFprice] = useState("");
  const [fqty, setFqty] = useState("");
  const [ftime, setFtime] = useState("");  // 下单时间：默认真实当前时刻，可改
  const [terr, setTerr] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState("");
  const [dayPx, setDayPx] = useState(null);  // 选了结束日期时：截止日最后一根K线收盘与前一根收盘（当日股价/涨跌基准）
  useEffect(() => {
    const chart = echarts.init(ref.current);
    let dead = false;
    setErr(""); setLoading(true); setDayPx(null);
    (async () => {
      try {
        if (period === "day5") throw new Error("5日待接入(东财 trends2)");
        if (period === "min") {
          const d = await getJSON(`/api/minute?symbol=${symbol}`);
          const pts = (d.points || []).map(s => { const a = s.split(" "); return [a[0], +a[1]]; });
          chart.setOption(lineOpt(pts, +((d.quote || [])[4])), true);  // quote[4]=昨收
        } else {
          const dr = (dstart || dend) ? `&start=${dstart}&end=${dend}` : "";
          const d = await getJSON(`/api/kline?symbol=${symbol}&period=${period}&limit=300${dr}`);
          chart.setOption(kOpt(d, Boolean(dstart || dend)), true);
          const tail = d.tail || [];  // 截止日收盘：不晚于结束日期的最后两根K线（区间落在周末等非交易日、图内为空时也能取到"当日价"）
          if (dend && tail.length >= 2)
            setDayPx({ price: +tail[tail.length - 1][2], prev: +tail[tail.length - 2][2] });
        }
      } catch (e) { if (!dead) setErr(String(e.message || e)); }
      finally { if (!dead) setLoading(false); }
    })();
    const onRs = () => chart.resize();
    window.addEventListener("resize", onRs);
    return () => { dead = true; window.removeEventListener("resize", onRs); chart.dispose(); };
  }, [symbol, period, dstart, dend]);
  // 买卖气泡：点气泡外或按 Esc 关闭（两个买卖按钮在 tradeRef 内，点按钮不触发外部关闭，由按钮自己切换）
  useEffect(() => {
    if (!form) return;
    const onDoc = e => { if (tradeRef.current && !tradeRef.current.contains(e.target)) setForm(null); };
    const onKey = e => e.key === "Escape" && setForm(null);
    document.addEventListener("mousedown", onDoc);
    window.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); window.removeEventListener("keydown", onKey); };
  }, [form]);
  // 现价/涨跌：无结束日期走 App 批量报价（各卡一致）；选了结束日期则取截止日最后一根K线收盘=当日价，
  // 涨跌基准=前一根收盘（与图右轴%口径一致，颜色随当日涨跌）
  const px = dayPx ? dayPx.price : (quote ? quote.price : null);
  const prevPx = dayPx ? dayPx.prev : (quote ? quote.prev : null);
  const chg = px != null && prevPx ? (px - prevPx) / prevPx * 100 : null;
  // 持仓盈亏始终按实时报价算（仓位是当下的，不随历史日期回放）：盈亏 = (现价-成本)×数量
  const pl = quote && holding ? (quote.price - holding.cost) * holding.shares : null;
  const plpct = quote && holding && holding.cost ? (quote.price - holding.cost) / holding.cost * 100 : null;
  const sellable = holding ? (holding.sellable != null ? holding.sellable : holding.shares) : 0;  // 可卖数量：A股当日买入的份额 T+1 锁到明日，仅锁卖出按钮，盈亏照常显示
  const flag = symbol.startsWith("hk") ? "hk" : symbol.startsWith("us") ? "us" : "";
  const openForm = side => {
    if (side === "sell" && sellable <= 0) return;
    if (form === side) { setForm(null); return; }  // 再点同一按钮＝收起气泡
    const now = nowLocal();  // 实时仓下单时间=真实当前时刻，不随顶栏日期筛选锚定（区别于历史仓锚结束日期）
    setForm(side); setTerr("");
    setFprice(quote ? String(quote.price) : "");   // 价格默认现价；卖出数量默认全部可卖
    setFqty(side === "sell" ? String(sellable) : "100");
    setFtime(now);
  };
  const stepQty = d => setFqty(v => String(Math.max(0, (parseFloat(v) || 0) + d * 100)));  // 数量加减，每次100
  const submitTrade = async () => {
    const price = parseFloat(fprice), qty = parseFloat(fqty);
    if (!(price > 0) || !(qty > 0)) { setTerr("价格/数量需大于0"); return; }
    setBusy(true); setTerr("");
    try {
      await sendJSON("/api/orders?scope=live", "POST", { symbol, name, side: form, price, qty, ts: ftime });
      setForm(null); setDone(form); setTimeout(() => setDone(""), 1500);
      onTrade();  // 刷新持仓/订单/汇总（不在卡里的新持仓会随 symKey 联动补报价）
    } catch (e) { setTerr(String(e.message || e)); }
    finally { setBusy(false); }
  };
  return html`<div className="card-live"
    onDragOver=${e => e.preventDefault()}
    onDrop=${() => onDropCard(index)}>
    <button className="del-live" title="删除卡片" onClick=${() => onDelete(symbol)}>✕</button>
    <div className="hd-live">
      <span className="grip-live" draggable="true"
        onDragStart=${e => { e.dataTransfer.setData("text/plain", String(index)); e.dataTransfer.effectAllowed = "move"; onDragStart(index); }}>
        ≡ <b>${name}</b><span style=${{ opacity: .55, fontSize: 12 }}>${symbol}</span>${flag && html`<img className="flag-live" draggable="false" src=${"vendor/flags/" + flag + ".svg"} alt="" />`}
      </span>
      <div className="hrow2-live">
        <span>${px != null && chg != null && html`<span className=${"px-live" + (chg > 0 ? " up-live" : chg < 0 ? " dn-live" : "")}>${px}</span><span className=${"chg-live" + (chg > 0 ? " up-live" : chg < 0 ? " dn-live" : "")}>${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`}</span>
        ${holding && pl != null && html`<span className="hold-live">持仓盈亏<b className=${pl >= 0 ? "up-live" : "dn-live"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b><span className=${plpct >= 0 ? "up-live" : "dn-live"}>${plpct >= 0 ? "+" : ""}${plpct.toFixed(2)}%</span></span>`}
      </div>
      <div className="tabrow-live">
        <span className="tabs-live">
          ${TABS.map(([p, t]) => html`<button key=${p} className=${p === period ? "on-live" : ""} onClick=${() => onPeriod(symbol, p)}>${t}</button>`)}
        </span>
        <div className="trade-live" ref=${tradeRef}>
          <button className="tbn-live" disabled=${busy} onClick=${() => openForm("buy")}>${done === "buy" ? "已买入" : "买入"}</button>
          <button className="tbn-live sell-live" disabled=${sellable <= 0 || busy}
            title=${sellable > 0 ? "可卖 " + sellable : holding ? "A股当日买入，次日可卖" : "无持仓"}
            onClick=${() => openForm("sell")}>${done === "sell" ? "已卖出" : "卖出"}</button>
        ${form && html`<div className="pop-live">
          <div className="prow-live">
            <label>${form === "buy" ? "买入时间" : "卖出时间"}</label>
            <input type="datetime-local" value=${ftime} onChange=${e => setFtime(e.target.value)} />
          </div>
          <div className="prow-live">
            <label>价格</label>
            <input type="number" step="any" min="0" value=${fprice} onChange=${e => setFprice(e.target.value)} placeholder="价格" />
          </div>
          <div className="prow-live">
            <label>数量</label>
            <button className="step-live" disabled=${busy} onClick=${() => stepQty(-1)}>−</button>
            <input type="number" step="any" min="0" value=${fqty} onChange=${e => setFqty(e.target.value)} placeholder="数量" />
            <button className="step-live" disabled=${busy} onClick=${() => stepQty(1)}>＋</button>
          </div>
          ${terr && html`<span className="terr-live">${terr}</span>`}
          <div className="pact-live">
            <button className="tbn-live ok-live" disabled=${busy} onClick=${submitTrade}>${busy ? "提交中…" : "确认"}</button>
            <button className="tbn-live" style=${{ borderColor: "#d9d9de", color: "#999", background: "#fff" }} disabled=${busy} onClick=${() => setForm(null)}>取消</button>
          </div>
        </div>`}
        </div>
      </div>
    </div>
    <div className="chart-live" ref=${ref}></div>
    ${loading && !err && html`<div className="ld-live">加载中…</div>`}
    ${err && html`<div className="err-live">${err}</div>`}
  </div>`;
}

// 全部收益抽屉：右侧滑出。持仓 tab 用 /api/holdings + 批量报价实时计算；订单 tab 用 /api/orders 真实流水（每笔 realized + 行删除）

function TotalDrawerLive({ holdings, quotes, cards, orders, realizedTotal, onDelOrder, onDelHolding, onClose }) {
  const [tab, setTab] = useState("hold");
  useEffect(() => {  // Esc 关闭，同时锁住页面滚动
    const onKey = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [onClose]);
  const names = {};
  cards.forEach(c => { names[c.symbol] = c.name; });
  // 全部持仓行都列出（无报价的列显示 —），汇总只统计有报价的行；全部收益% = 总盈亏 / 总成本（与原汇总条口径一致）
  const rows = Object.entries(holdings).map(([s, h]) => ({ s, ...h, q: quotes[s] }));
  const valid = rows.filter(x => x.q);
  const tCost = valid.reduce((a, x) => a + x.shares * x.cost, 0);
  const tMv = valid.reduce((a, x) => a + x.shares * x.q.price, 0);
  const tFloat = tMv - tCost;                // 浮动盈亏
  const tPl = tFloat + realizedTotal;        // 全部收益 = 浮动 + 已实现（卖出落袋）
  const tPct = tCost ? tPl / tCost * 100 : 0;
  return html`<div className="drawer-mask-live" onClick=${onClose}>
    <div className="drawer-live" onClick=${e => e.stopPropagation()}>
      <div className="dhd-live">
        <span className="dtitle-live">全部收益</span>
        <button className="dclose-live" title="关闭" onClick=${onClose}>✕</button>
      </div>
      <div className="dtabs-live">
        <button className=${tab === "hold" ? "on-live" : ""} onClick=${() => setTab("hold")}>持仓(${Object.keys(holdings).length})</button>
        <button className=${tab === "order" ? "on-live" : ""} onClick=${() => setTab("order")}>订单</button>
      </div>
      <div className="dbody-live">
        ${tab === "hold" ? html`<div>
          <div className="dtot-live">
            <span>全部收益<b className=${tPl >= 0 ? "up-live" : "dn-live"}>${tPl >= 0 ? "+" : ""}${tPl.toFixed(2)}</b><span className=${tPct >= 0 ? "up-live" : "dn-live"}>(${tPct >= 0 ? "+" : ""}${tPct.toFixed(2)}%)</span></span>
            ${realizedTotal !== 0 && html`<span>已实现<b className=${realizedTotal >= 0 ? "up-live" : "dn-live"}>${realizedTotal >= 0 ? "+" : ""}${realizedTotal.toFixed(2)}</b></span>`}
            <span>总市值<b>${tMv.toFixed(2)}</b></span>
            <span>总成本<b>${tCost.toFixed(2)}</b></span>
          </div>
          <div className="hhd-live"><span>名称</span><span>现价</span><span>成本</span><span>数量</span><span title="A股当日买入的份额次日可卖（T+1）">可卖</span><span>市值</span><span>盈亏金额</span><span>盈亏%</span><span>买入时间</span><span>删除</span></div>
          ${rows.map(x => {
            const pl = x.q ? (x.q.price - x.cost) * x.shares : null;
            const plp = x.q && x.cost ? (x.q.price - x.cost) / x.cost * 100 : null;
            return html`<div className="hrow-live" key=${x.s}>
              <span className="hnm-live">${names[x.s] || x.name || x.s}<i>${x.s}</i></span>
              <span>${x.q ? x.q.price.toFixed(3) : "—"}</span>
              <span>${x.cost.toFixed(3)}</span>
              <span>${x.shares}</span>
              <span>${x.sellable != null ? x.sellable : x.shares}</span>
              <span>${x.q ? (x.shares * x.q.price).toFixed(2) : "—"}</span>
              <span className="hpl-live">${pl != null ? html`<b className=${pl >= 0 ? "up-live" : "dn-live"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b>` : "—"}</span>
              <span className="hpp-live">${plp != null ? html`<span className=${plp >= 0 ? "up-live" : "dn-live"}>${plp >= 0 ? "+" : ""}${plp.toFixed(2)}%</span>` : "—"}</span>
              <span className="hbt-live">${x.buy_ts ? html`${x.buy_ts.slice(0, 10)}<i>${x.buy_ts.slice(11)}</i>` : "—"}</span>
              <button className="odel-live" title="删除此持仓：该标的全部买卖流水一并清除" onClick=${() => onDelHolding(x.s)}>✕</button>
            </div>`;
          })}
        </div>` : html`<div>
          ${orders.length ? html`${orders.map(o => html`<div className="orow-live" key=${o.id}>
            <b className=${"act-live " + (o.side === "buy" ? "up-live" : "dn-live")}>${o.side === "buy" ? "买入" : "卖出"}</b>
            <span className="onm-live">${o.name}</span>
            <span className="ocode-live">${o.symbol}</span>
            <span className="opx-live">${o.price.toFixed(2)}元</span>
            <span className="oqt-live">${+o.qty}股</span>
            <span className="odt-live">${o.ts}</span>
            <span className="opl-live">${o.realized != null && html`共收益<b className=${o.realized >= 0 ? "up-live" : "dn-live"}>${o.realized >= 0 ? "+" : ""}${o.realized.toFixed(2)}</b>元`}</span>
            <button className="odel-live" title="删除此笔记录" onClick=${() => onDelOrder(o.id)}>✕</button>

  </div>`;
}

// 日期选择器（live 实时仓）：与上方 DP 同构的 -live 克隆，行为一致（周六/周日置灰且不可点；
// 点标题逐级上翻选月/选年，‹/›：日视图翻月、月视图翻年、年视图翻12年）
function DPLive({ value, onPick, title }) {
  const [open, setOpen] = useState(false);
  const [vym, setVym] = useState("");       // 面板浏览中的月份 YYYY-MM（每次打开按 value/今天重置）
  const [view, setView] = useState("day");  // day=日历 / month=选月 / year=选年
  const pad2 = n => String(n).padStart(2, "0");
  const d0 = new Date(), today = `${d0.getFullYear()}-${pad2(d0.getMonth() + 1)}-${pad2(d0.getDate())}`;
  const openCal = () => { setVym((value || today).slice(0, 7)); setView("day"); setOpen(true); };
  const shift = delta => {  // 上一页/下一页（跨年由 Date 归一）：日视图翻1月，月视图翻1年，年视图翻12年
    const [y, m] = vym.split("-").map(Number);
    const t = view === "year" ? new Date(y + delta * 12, m - 1, 1)
      : new Date(y, m - 1 + (view === "month" ? delta * 12 : delta), 1);
    setVym(`${t.getFullYear()}-${pad2(t.getMonth() + 1)}`);
  };
  let panel = null;
  if (open) {
    const [y, m] = vym.split("-").map(Number);
    let head, body;
    if (view === "year") {  // 选年：以浏览年为中心前后各推，点某年回选月视图
      head = html`<b>${y - 5}年 - ${y + 6}年</b>`;
      body = html`<div className="dp-ym-live">
        ${Array.from({ length: 12 }, (_, i) => { const yy = y - 5 + i;
          const cls = "dp-d-live" + (String(yy) === value.slice(0, 4) ? " sel-live" : "") + (String(yy) === today.slice(0, 4) ? " td-live" : "");
          return html`<button key=${yy} className=${cls}
            onClick=${() => { setVym(`${yy}-${pad2(m)}`); setView("month"); }}>${yy}</button>`; })}
      </div>`;
    } else if (view === "month") {  // 选月：点某月回日历视图
      head = html`<b onClick=${() => setView("year")}>${y}年</b>`;
      body = html`<div className="dp-ym-live">
        ${Array.from({ length: 12 }, (_, i) => { const ym = `${y}-${pad2(i + 1)}`;
          const cls = "dp-d-live" + (ym === value.slice(0, 7) ? " sel-live" : "") + (ym === today.slice(0, 7) ? " td-live" : "");
          return html`<button key=${ym} className=${cls}
            onClick=${() => { setVym(ym); setView("day"); }}>${i + 1}月</button>`; })}
      </div>`;
    } else {  // 日历：周六/周日置灰且不可点
      head = html`<b onClick=${() => setView("month")}>${y}年${m}月</b>`;
      const first = (new Date(y, m - 1, 1).getDay() + 6) % 7;  // 当月1号前的空位数（周一为首列）
      const days = new Date(y, m, 0).getDate();
      body = html`<div>
        <div className="dp-wk-live">${["一", "二", "三", "四", "五", "六", "日"].map((w, i) => html`<span key=${i} className=${i > 4 ? "w-live" : ""}>${w}</span>`)}</div>
        <div className="dp-grid-live">
          ${Array.from({ length: first }, (_, i) => html`<span key=${ "b" + i }></span>`)}
          ${Array.from({ length: days }, (_, i) => {
            const ds = `${y}-${pad2(m)}-${pad2(i + 1)}`;
            const wk = (first + i) % 7 >= 5;  // 周六/周日：禁用置灰
            const cls = "dp-d-live" + (ds === value ? " sel-live" : "") + (ds === today ? " td-live" : "");
            return html`<button key=${ds} className=${cls} disabled=${wk}
              onClick=${() => { onPick(ds); setOpen(false); }}>${i + 1}</button>`;
          })}
        </div>
      </div>`;
    }
    panel = html`<span>
      <div className="dp-mask-live" onClick=${() => setOpen(false)}></div>
      <div className="dp-panel-live">
        <div className="dp-nav-live">
          <button onClick=${() => shift(-1)}>‹</button>
          ${head}
          <button onClick=${() => shift(1)}>›</button>
        </div>
        ${body}
      </div>
    </span>`;
  }
  return html`<span className="dp-live">
    <button className=${"dp-btn-live" + (value ? "" : " ph-live")} title=${title} onClick=${() => open ? setOpen(false) : openCal()}>${value || title}</button>
    ${panel}
  </span>`;
}

function LiveApp({ page, setPage, dstart, setDstart }) {
  const [cards, setCards] = useState([]);  // 首屏卡片从后端 SQLite 加载，不再写死在页面里
  const applyCards = ns => { setCards(ns); saveCardsLive(ns); };  // 所有增删改统一：更新界面并回写数据库
  const loadCards = () => getJSON("/api/cards?scope=live").then(d => setCards(d.cards || [])).catch(e => console.error("卡片加载失败", e));
  useEffect(() => { loadCards(); }, []);  // 首屏拉取
  // 切回页面时重拉卡片：跨天后后端「买入次日前置」的新顺序无需手动刷新即呈现
  // （卡片按 symbol 为 key 复用组件，图表取数不依赖顺序，重排只移动 DOM 不重载图；同日内重拉结果相同，无感）
  useEffect(() => {
    const onVis = () => { if (document.visibilityState === "visible") loadCards(); };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, []);
  // 顶栏选中态由各卡周期推导：全部一致亮对应档位，不一致（或空盘）亮「其他」
  const gperiod = cards.length > 0 && cards.every(c => c.period === cards[0].period) ? cards[0].period : "other";
  const setAllPeriod = p => { if (p !== "other") applyCards(cards.map(c => ({ ...c, period: p }))); };  // 「其他」为混合态指示，点击不强制切换
  const setCardPeriod = (symbol, p) => applyCards(cards.map(c => (c.symbol === symbol ? { ...c, period: p } : c)));
  // 实时仓日期逻辑（区别于历史仓）：开始日期由用户自选并持久记忆最后一次选择（含清空），刷新后原样恢复——
  // 记忆改存后端 prefs（App 统一读写 /api/prefs），跨浏览器/跨地址共用一份；结束日期默认最新一天（今天）且
  // 不持久化——每次刷新自动跟上最新；当次会话内可手改，点「清除」或刷新即回到今天
  const todayLive = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
  const [dend, setDend] = useState(() => todayLive());
  const [q, setQ] = useState("");
  const [items, setItems] = useState([]);
  const [sel, setSel] = useState(null);  // 下拉里点选的个股：点右侧＋才加卡，输入变化或重新搜索时取消选中
  const [holdings, setHoldings] = useState({});  // symbol -> {shares, cost, sellable, name, buy_ts}，来自 GET /api/holdings（重演推导）
  const [quotes, setQuotes] = useState({});      // symbol -> {price, prev}，来自 GET /api/quotes 批量报价
  const [orders, setOrders] = useState([]);      // 交易流水，来自 GET /api/orders（含每笔 realized 收益）
  const [realizedTotal, setRealizedTotal] = useState(0);  // 已实现总收益（卖出落袋合计）
  const [showTotal, setShowTotal] = useState(false);  // 全部收益抽屉开关（顶部按钮 → 右侧滑出）
  const loadHoldings = () => getJSON("/api/holdings?scope=live").then(d => {
    const m = {};
    (d.holdings || []).forEach(h => { m[h.symbol] = { shares: h.shares, cost: h.cost, sellable: h.sellable, name: h.name, buy_ts: h.buy_ts }; });
    setHoldings(m);
  }).catch(e => console.error("持仓加载失败", e));
  const loadOrders = () => getJSON("/api/orders?scope=live").then(d => {
    setOrders(d.orders || []);
    setRealizedTotal(d.realized_total || 0);
  }).catch(e => console.error("订单加载失败", e));
  useEffect(() => { loadHoldings(); loadOrders(); }, []);  // 首屏拉取；买卖/删除后同样调这两个刷新推导账本
  const symKey = [...new Set([...cards.map(c => c.symbol), ...Object.keys(holdings)])].join(",");  // 卡片+持仓合集变化时重取批量报价（持仓可能不在卡片里）
  useEffect(() => {
    if (!symKey) return;
    let dead = false;
    getJSON(`/api/quotes?symbols=${symKey}`).then(d => { if (!dead) setQuotes(d.quotes || {}); })
      .catch(e => console.error("报价加载失败", e));
    return () => { dead = true; };
  }, [symKey]);
  const toggleTotal = () => setShowTotal(v => {
    const ns = !v;
    if (ns && symKey) getJSON(`/api/quotes?symbols=${symKey}`).then(d => setQuotes(d.quotes || {}))
      .catch(e => console.error("报价刷新失败", e));  // 展开时顺手刷新一次报价
    return ns;
  });

// 页面壳：两个页面级Tab的切换都走这里；卡片/持仓等状态仍在两页组件内，日期与所在页提升到 App 统一管理
// 偏好（所在页 + 历史仓起止日期 + 实时仓开始日期）改存后端 prefs 表，跟库走不跟浏览器走：换浏览器、换访问
// 地址（IDE预览代理:3000 / 正式:8000）都恢复同一份——此前存 localStorage 时按「浏览器+地址」隔离，复制链接
// 到新浏览器会失忆
function App() {
  const [page, setPageState] = useState("hist");

  const [ls, setLs] = useState("");                // 实时仓开始日期（结束日期恒为今天不持久化，留在 LiveApp 内）
  const [booted, setBooted] = useState(false);     // 偏好未就绪前不渲染页面：避免先按空日期取一轮K线再返工
  useEffect(() => {
    getJSON("/api/prefs").then(d => {
      const p = d.prefs || {};
      // 一次性迁移：后端从未存过的键，若本浏览器 localStorage 还留着旧版存的值，先补种给后端再应用
      const legacy = { page: "kp_page", hist_dstart: "kp_dstart", hist_dend: "kp_dend", live_dstart: "kp_dstart_live" };
      const seed = {};
      for (const k in legacy) {
        if (!(k in p)) { try { const v = localStorage.getItem(legacy[k]); if (v != null) seed[k] = v; } catch (e) {} }
      }
      const apply = q => {
        setPageState(q.page === "live" ? "live" : "hist");
        setHd({ s: q.hist_dstart || "", e: q.hist_dend || "" });
        setLs(q.live_dstart || "");
        setBooted(true);
      };
      if (Object.keys(seed).length)
        sendJSON("/api/prefs", "PUT", { prefs: seed }).catch(e => console.warn("旧偏好迁移失败", e)).finally(() => apply({ ...p, ...seed }));
      else apply(p);
    }).catch(e => { console.error("偏好加载失败", e); setBooted(true); });  // 偏好拿不到也不卡页面，按默认值进
  }, []);
  const put = prefs => sendJSON("/api/prefs", "PUT", { prefs }).catch(e => console.warn("偏好保存失败", e));
  const setPage = k => { setPageState(k); put({ page: k }); };
  // 差量写库：改哪个键只 PUT 哪个键——全量写两个键会被其他标签页的旧内存值反向覆盖
  //（旧页选一次结束日期会把其内存里的旧起始日期写回库，盖掉新选的值）
  const setStart = s => { setHd(h => ({ ...h, s })); put({ hist_dstart: s }); };
  const setEnd = e => { setHd(h => ({ ...h, e })); put({ hist_dend: e }); };
  const setDates = (s, e) => { setHd({ s, e }); put({ hist_dstart: s, hist_dend: e }); };  // 仅「清除」用：两键同时清空
  const setLiveStart = v => { setLs(v); put({ live_dstart: v }); };
  if (!booted) return html`<div></div>`;
  return page === "hist"
    ? html`<${HistApp} page=${page} setPage=${setPage} dstart=${hd.s} dend=${hd.e} setStart=${setStart} setEnd=${setEnd} setDates=${setDates} />`
    : html`<${LiveApp} page=${page} setPage=${setPage} dstart=${ls} setDstart=${setLiveStart} />`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
