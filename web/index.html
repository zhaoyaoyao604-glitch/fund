<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>基金看盘 - 粗糙版</title>
<!-- 四个前端库已本地化到 vendor/（2026-09-24：jsdelivr 被网络阻断导致整页空白，改走本地）；相对路径同时兼容 http 托管与 file:// 直开 -->

<script src="vendor/react-dom.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script src="vendor/echarts.min.js"></script>
<style>  /* ===== 主题调色板：深色为默认(:root)，亮色由 html.light 覆盖整套变量 =====
     切换开关只做一件事：给 <html> 加/去掉 light 类名，其余样式全部读变量 */
  :root {
    color-scheme: dark;
    --bd-dn: #2fcf98;
    --bd-1: 1px solid #3a3f47;
    --bd-up: 1px solid #ff5f5f;
    --bd-2: 1px solid #343941;
    --bd-3: 1px solid #2b2f36;
    --bd-amber: 1px solid #8a6a30;
    --bd-4: 1px solid #2b2f36;
    --bd-5: 1px solid #262a30;
    --bd-tip: 1px solid #7a6420;
    --bd-1c: #3a3f47;
    --bd-up-c: #ff5f5f;
    --bd-amber-c: #8a6a30;
    --bg-dn-weak: rgba(47,207,152,.14);
    --bg-soft: #262a30;
    --bg-page: #121317;
    --bg-soft2: #262a30;
    --bg-up-weak: rgba(255,95,95,.14);
    --bg-accent-weak2: rgba(249,149,2,.22);
    --bg-card: #1c1f24;
    --bg-accent-weak: rgba(249,149,2,.12);
    --bg-tip: rgba(48,42,26,.96);
    --sh-flag: 0 0 0 1px rgba(255,255,255,.14);
    --sh-card: 0 1px 4px rgba(0,0,0,.5);
    --sh-pop: 0 2px 8px rgba(0,0,0,.6);
    --sh-pop2: 0 6px 20px rgba(0,0,0,.6);
    --sh-drawer: -8px 0 28px rgba(0,0,0,.6);
    --dn: #2fcf98;
    --tx-1: #e6e8ec;
    --tx-2: #b0b4bc;
    --tx-3: #949aa3;
    --tx-4: #8a9099;
    --tx-5: #767c85;
    --amber: #e8b04a;
    --tx-6: #6b717a;
    --tx-7: #63686f;
    --tx-9: #5a6068;
    --tx-8: #5d626a;
    --link: #ffab2e;
    --up: #ff5f5f;
    --bg-field: #22262c;
    --bd-field: #3a3f47;
    /* 图表专字色（K线/均线/MACD/缩放条/画线）：ECharts 读不到 CSS，由 chartPal() 取这些变量 */
    --dif: #c8ccd4;
    --ma3: #e6a23c;
    --ma5: #409eff;
    --ma85: #3ecf8e;
    --ma125: #a78bfa;
    --draw: rgba(255,196,0,.85);
    --draw-sel: #e8590c;
    --zoom-border: #343941;
    --zoom-bg: #22262c;
    --zoom-tx: #8a9099;
    --zoom-line: #4a4f58;
    --zoom-area: #2a2e35;
    --zoom-sel-line: #8a6a30;
    --zoom-filler: rgba(249,149,2,.18);
  }
  html.light {
    color-scheme: light;
    --bd-dn: #1fa37a;
    --bd-1: 1px solid #ddd;
    --bd-up: 1px solid #e64340;
    --bd-2: 1px solid #ececf0;
    --bd-3: 1px solid #eee;
    --bd-amber: 1px solid #f0b75c;
    --bd-4: 1px solid #f0f0f2;
    --bd-5: 1px solid #f5f6f7;
    --bd-tip: 1px solid #ffd666;
    --bd-1c: #d9d9de;
    --bd-up-c: #e64340;
    --bd-amber-c: #f0b75c;
    --bg-dn-weak: #e8f7f0;
    --bg-soft: #f0f0f2;
    --bg-page: #f2f3f5;
    --bg-soft2: #f7f7f8;
    --bg-up-weak: #fdecec;
    --bg-accent-weak2: #ffedd1;
    --bg-card: #fff;
    --bg-accent-weak: #fff7ea;
    --bg-tip: rgba(255,248,225,.96);
    --sh-flag: 0 0 0 1px rgba(0,0,0,.1);
    --sh-card: 0 1px 4px rgba(0,0,0,.08);
    --sh-pop: 0 2px 8px rgba(0,0,0,.15);
    --sh-pop2: 0 6px 20px rgba(0,0,0,.15);
    --sh-drawer: -8px 0 28px rgba(0,0,0,.16);
    --dn: #1fa37a;
    --tx-1: #333;
    --tx-2: #666;
    --tx-3: #888;
    --tx-4: #999;
    --tx-5: #aaa;
    --amber: #b97c00;
    --tx-6: #bbb;
    --tx-7: #c0c0c0;
    --tx-9: #c2c2c8;
    --tx-8: #c8c8cc;
    --link: #d46b08;
    --up: #e64340;
    --bg-field: #fff;
    --bd-field: #ddd;
    --dif: #333;
    --ma85: #2f855a;
    --ma125: #805ad5;
    --draw: rgba(212,136,6,.9);
    --zoom-border: #ececf0;
    --zoom-bg: #fafafb;
    --zoom-tx: #999;
    --zoom-line: #dcdce0;
    --zoom-area: #f2f2f5;
    --zoom-sel-line: #f0b75c;
  }
  input, textarea, select { background: var(--bg-field); color: var(--tx-1); border-color: var(--bd-field); }
  input::placeholder { color: var(--tx-6); }


  body { margin: 0; background: var(--bg-page); font-family: system-ui, "Microsoft YaHei", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
  @media (min-width: 1600px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { position: relative; background: var(--bg-card); border-radius: 8px; box-shadow: var(--sh-card); padding: 8px; }
  .grip { cursor: move; }
  .del { position: absolute; top: 6px; right: 38px; border: 0; background: var(--bg-soft); color: var(--tx-3); border-radius: 4px; cursor: pointer; font-size: 12px; padding: 1px 7px; z-index: 5; }
  .del:hover { background: #e64340; color: #fff; }
  .zbtn { right: 8px; }  /* 放大icon：按参考图位于删除icon右侧，删除居左放大居右（del宽约22px，间距8px→right38） */
  .zbtn:hover { background: #f99502; color: #fff; }
  .zmask { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .zpanel { position: relative; background: var(--bg-card); border-radius: 10px; width: min(1960px, 90vw); height: min(880px, 80vh); display: flex; flex-direction: column; padding: 10px 14px 14px; }
  .zhd { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; }
  .zhd b { font-size: 15px; }
  .zclose { margin-left: auto; border: 0; background: var(--bg-soft); color: var(--tx-3); border-radius: 4px; cursor: pointer; font-size: 12px; padding: 2px 8px; align-self: center; }
  .zclose:hover { background: #e64340; color: #fff; }
  .zdelcard { border: 0; background: var(--bg-up-weak); color: var(--up); border-radius: 4px; cursor: pointer;
    font-size: 12px; padding: 2px 8px; margin-left: 8px; align-self: center; }
  .zdelcard:hover { background: #e64340; color: #fff; }
  .zchart { flex: 1; min-height: 0; }
  .znote { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--tx-4); font-size: 13px; }
  .hd { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 4px; font-size: 13px; }
  .hd .chg { font-size: 12px; margin-left: 6px; font-weight: 600; }
  .px { font-size: 15px; font-weight: 700; color: var(--tx-1); }
  .hrow2 { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
  .hold { font-size: 12px; color: var(--tx-4); }
  .hold b { font-weight: 700; margin: 0 3px 0 1px; }
  .flag { height: 12px; margin: 0 2px 0 4px; vertical-align: -1px; border-radius: 1px; box-shadow: var(--sh-flag); }
  /* 卡片交易行：买入红描边/卖出绿描边，无持仓或A股当日买入时卖出灰掉；点按钮弹出买卖气泡 */
  .trade { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 2px; }
  .tbn { border: var(--bd-up); color: var(--up); background: var(--bg-card); border-radius: 4px; padding: 2px 12px;
    font-size: 12px; cursor: pointer; white-space: nowrap; transition: background-color .15s ease; }
  .tbn:hover { background: var(--bg-up-weak); }
  .tbn.sell { border-color: var(--bd-dn); color: var(--dn); }
  .tbn.sell:hover { background: var(--bg-dn-weak); }
  .tbn[disabled] { border-color: var(--bd-1c); color: var(--tx-9); background: var(--bg-soft2); cursor: not-allowed; }
  .tbn.ok { border-color: #f99502; color: #f99502; }
  /* 买卖气泡：挂在交易行下方，含时间/价格/数量(±100)与确认/取消 */
  .pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 250px; background: var(--bg-card);
    border: var(--bd-2); border-radius: 8px; box-shadow: var(--sh-pop2); padding: 10px 12px; }
  .pop::before { content: ""; position: absolute; top: -5px; left: 22px; width: 8px; height: 8px; background: var(--bg-card);
    border-left: var(--bd-2); border-top: var(--bd-2); transform: rotate(45deg); }
  .pop .prow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .pop .prow label { width: 56px; flex: none; font-size: 12px; color: var(--tx-2); }
  .pop .prow input { flex: 1; width: auto; min-width: 0; border: var(--bd-1); border-radius: 4px; padding: 3px 6px; font-size: 12px; }
  .pop .prow input.over { border-color: var(--bd-up-c); }  /* 卖出数量超过可卖：红边警示 */
  .pop .step { flex: none; width: 26px; border: var(--bd-amber); background: var(--bg-accent-weak); color: var(--amber);
    border-radius: 4px; padding: 4px 0; font-size: 13px; line-height: 1; cursor: pointer; }
  .pop .step:hover { background: var(--bg-accent-weak2); }
  .pop .step[disabled] { opacity: .5; cursor: not-allowed; }
  .pop .amt { flex: 1; text-align: right; font-size: 13px; font-weight: 600; color: var(--tx-1); line-height: 22px; }
  .trade .terr { display: block; font-size: 11px; color: var(--up); margin: 0 0 8px 62px; }
  .pop .pact { display: flex; justify-content: flex-end; gap: 8px; }
  .up { color: var(--up); } .dn { color: var(--dn); }
  .tabs button { border: 0; background: var(--bg-soft); padding: 2px 8px; margin-left: 4px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .tabs button.on { background: #f99502; color: #fff; }
  /* 周期行（按参考图）：Tab 居左、买/卖按钮居右；持仓盈亏已移到价格行右侧 */
  .tabrow { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 6px; }
  .tabrow .trade { width: auto; margin-top: 0; flex: none; }  /* 交易组并入周期行右侧，不再占满整行 */
  .tabrow .pop { left: auto; right: 0; }  /* 气泡改为右对齐向下展开，避免溢出卡片 */
  .tabrow .pop::before { left: auto; right: 22px; }
  .hrow2 .hold { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chart { width: 100%; height: 230px; }
  /* 画线：黄色半透明 1px；画线模式按钮高亮，图内底部给操作提示（清空按钮可点） */
  .drbtn { right: 68px; }  /* 放大按钮左侧 */
  .drbtn.on { background: #f99502; color: #fff; }
  .drtip { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6; pointer-events: none;
    background: var(--bg-tip); border: var(--bd-tip); border-radius: 4px; padding: 2px 8px;
    color: var(--amber); font-size: 11px; white-space: normal; max-width: calc(100% - 24px); text-align: center; line-height: 1.45; }
  .drtip button { pointer-events: auto; margin-left: 6px; border: 0; background: none; color: var(--link); cursor: pointer;
    font-size: 11px; padding: 0 2px; }
  .zdraw { border: 0; background: var(--bg-soft); color: var(--tx-3); border-radius: 4px; cursor: pointer; font-size: 12px;
    padding: 2px 8px; margin-left: 8px; align-self: center; }
  .zdraw.on { background: #f99502; color: #fff; }
  .err { color: var(--up); font-size: 12px; }
  .ld { color: var(--tx-4); font-size: 12px; }
  /* 顶部固定「优异标的」一行（hist/live 两页共用）：sticky 贴视口最上，横向超出一行可滚 */
  .sigbar { position: sticky; top: 0; z-index: 35; display: flex; align-items: center; gap: 8px; height: 28px;
    padding: 0 12px; background: var(--bg-soft); border-bottom: var(--bd-3); font-size: 12px; color: var(--tx-2);
    overflow-x: auto; overflow-y: hidden; white-space: nowrap; }
  .sigbar::-webkit-scrollbar { height: 0; }
  .sigtag { flex: none; color: var(--amber); font-weight: 600; }
  .sigitem { flex: none; padding: 1px 8px; border-radius: 4px; background: var(--bg-card); }
  .sigitem em { font-style: normal; margin-left: 4px; color: var(--up); }  /* 涨幅：A 股习惯红涨 */
  .sigitem.dn em { color: var(--dn); }
  .sigitem.buy { background: var(--bg-accent-weak); color: var(--tx-1); box-shadow: inset 0 0 0 1px var(--bd-amber-c); }
  .sigitem.buy b { color: var(--amber); margin-right: 4px; }
  .sigitem.buy i { font-style: normal; color: var(--amber); margin-left: 4px; }
  .sigsep { flex: none; width: 1px; height: 14px; background: var(--bd-1c); }
  .sigph { flex: none; color: var(--tx-5); }
  .sigend { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
  .sigre { border: 0; background: none; color: #f99502; cursor: pointer; font-size: 12px; }
  .sigre[disabled] { opacity: .5; cursor: not-allowed; }
  .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 8px 12px; box-shadow: var(--sh-card); }
  .topbar .tabs button { padding: 4px 14px; }
  /* 页面级Tab（顶栏最左）：历史模拟仓 / 实时跟随仓 */
  .ptabs { display: flex; gap: 20px; }
  .ptabs button { border: 0; background: none; padding: 2px 2px 6px; font-size: 14px; color: var(--tx-4); cursor: pointer; border-bottom: 2px solid transparent; }
  .ptabs button:hover { color: #f99502; }
  .ptabs button.on { color: var(--tx-1); font-weight: 600; border-bottom-color: #f99502; }
  /* 亮/暗主题开关：两页顶栏共用（主题是全局偏好，不按视图分叉，故不另做 -live 副本） */
  .thm { display: inline-flex; gap: 2px; background: var(--bg-soft); border-radius: 6px; padding: 2px; }
  .thm button { border: 0; background: none; color: var(--tx-4); font-size: 12px; padding: 3px 10px; border-radius: 4px; cursor: pointer; }
  .thm button:hover { color: var(--tx-1); }
  .thm button.on { background: #f99502; color: #fff; }
  .dtr { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--tx-2); }
  .dtr input { border: var(--bd-1); border-radius: 4px; padding: 3px 6px; font-size: 12px; }
  .dtr .clr { border: 0; background: none; color: #f99502; cursor: pointer; font-size: 12px; padding: 0 2px; }
  /* 日期选择器：点按钮弹出自绘日历浮层——原生 date 输入无法把特定日期置灰禁用；
     周六/周日格子置灰不可点；空值显示占位文字，选中回调 onPick，点面板外/再次点按钮收起 */
  .dp { position: relative; display: inline-flex; }
  .dp-btn { border: var(--bd-1); border-radius: 4px; padding: 3px 6px; font-size: 12px; min-width: 96px;
    background: var(--bg-card); color: var(--tx-1); cursor: pointer; text-align: left; font-family: inherit; }
  .dp-btn:hover { border-color: var(--bd-amber-c); }
  .dp-btn.ph { color: var(--tx-6); }  /* 空值占位态 */
  .dp-mask { position: fixed; inset: 0; z-index: 44; }  /* 点面板外关闭：透明遮罩低于 zmask(50) */
  .dp-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 45; width: 224px; background: var(--bg-card);
    border: var(--bd-2); border-radius: 8px; box-shadow: var(--sh-pop2); padding: 8px; }
  .dp-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 0 6px; font-size: 13px; color: var(--tx-1); }
  .dp-nav button { border: 0; background: none; color: var(--tx-4); font-size: 14px; cursor: pointer; padding: 2px 10px; border-radius: 4px; }
  .dp-nav button:hover { background: var(--bg-soft); color: var(--tx-1); }
  .dp-nav b { cursor: pointer; border-radius: 4px; padding: 1px 6px; font-weight: 600; }  /* 标题可点：逐级上翻选月/选年 */
  .dp-nav b:hover { background: var(--bg-soft); }
  .dp-ym { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px 0; }  /* 选月/选年网格：格子复用 .dp-d 样式 */
  .dp-ym .dp-d { padding: 7px 0; }  /* 年/月格子比日期格子稍高 */
  .dp-wk, .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-wk { font-size: 11px; color: var(--tx-5); text-align: center; padding-bottom: 2px; }
  .dp-wk .w { color: var(--tx-8); }  /* 周末列表头同步淡化 */
  .dp-d { border: 0; background: none; font-size: 12px; color: var(--tx-1); padding: 5px 0; border-radius: 4px;
    cursor: pointer; font-family: inherit; }
  .dp-d:hover { background: var(--bg-accent-weak); color: #f99502; }
  .dp-d[disabled] { color: var(--tx-8); cursor: not-allowed; }  /* 周六/周日、未来日期、早于回测可回溯起点：置灰不可点 */
  .dp-d[disabled]:hover { background: none; color: var(--tx-8); }
  .dp-d.sel, .dp-d.sel:hover { background: #f99502; color: #fff; }  /* 当前选中值 */
  .dp-d.td { box-shadow: inset 0 0 0 1px #f99502; }  /* 今天描边 */
  .dp-d.sel.td { box-shadow: none; }
  .search { position: relative; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .search input { border: var(--bd-1); border-radius: 4px; padding: 4px 8px; width: 200px; }
  .search .add { background: #f99502; color: #fff; border: 0; border-radius: 4px; padding: 4px 12px; cursor: pointer;
    transition: background-color .15s ease, box-shadow .15s ease, transform .06s ease; }
  .search .add:hover { background: #e88a00; box-shadow: 0 2px 6px rgba(249,149,2,.35); }
  .search .add:active { background: #cf7a00; transform: translateY(1px) scale(.96); box-shadow: none; }
  .search .add.on { box-shadow: 0 0 0 3px rgba(249,149,2,.22); }  /* 已选中个股，提示可点击添加 */
  .drop { position: absolute; top: 32px; right: 0; background: var(--bg-card); border: var(--bd-3); border-radius: 4px; box-shadow: var(--sh-pop); z-index: 10; min-width: 240px; max-height: 260px; overflow: auto; }
  .drop div { padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .drop div:hover { background: var(--bg-accent-weak); }
  .drop div.on { background: var(--bg-accent-weak2); box-shadow: inset 3px 0 0 #f99502; }  /* 选中的结果行 */
  .tbtn { border: 1px solid #f99502; background: var(--bg-card); color: #f99502; border-radius: 4px;
    padding: 3px 14px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
  .tbtn:hover { background: var(--bg-accent-weak); }
  .tbtn.on { background: #f99502; color: #fff; }
  /* 回测弹窗（hist/live 共用同一浮层）：居中+遮罩变暗；配置行固定不滚，结果区内部滚动 */
  .btmask { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
  .btpanel { background: var(--bg-card); border-radius: 10px; width: min(1080px, 96vw); max-height: 90vh;
    display: flex; flex-direction: column; box-shadow: 0 10px 36px rgba(0,0,0,.7); }
  .bthd { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 8px; }
  .bthd b { font-size: 15px; color: var(--tx-1); }
  .bthd i { font-size: 12px; color: var(--tx-4); font-style: normal; }
  .btclose { margin-left: auto; border: 0; background: var(--bg-soft); color: var(--tx-3); border-radius: 4px;
    cursor: pointer; font-size: 12px; padding: 2px 9px; align-self: center; }
  .btclose:hover { background: #e64340; color: #fff; }
  .btcfg { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 0 16px 10px;
    border-bottom: var(--bd-3); font-size: 13px; color: var(--tx-2); }
  .btcfg b { color: var(--tx-1); }

  /* 全部收益抽屉：右侧滑出、页面不变暗；点抽屉外/×/Esc 关闭 */

  .hhd, .hrow { display: grid; grid-template-columns: 1.5fr .8fr .8fr .7fr .7fr 1fr .9fr .8fr 1.3fr 28px; gap: 6px; align-items: center;

  /* ================= 实时跟随仓（live）样式镜像 =================

  /* 持仓明细：名称/现价/成本/数量/可卖/市值/盈亏金额/盈亏%/买入时间/删除 十列（与历史仓同构） */
  .hhd-live, .hrow-live { display: grid; grid-template-columns: 1.5fr .8fr .8fr .7fr .7fr 1fr .9fr .8fr 1.3fr 28px; gap: 6px; align-items: center;
    font-size: 13px; }

  .orow-live { display: grid; grid-template-columns: 44px minmax(0,1.1fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,1.2fr) minmax(0,1.2fr) 28px;
    gap: 6px; align-items: baseline; padding: 10px 0; font-size: 13px; border-bottom: var(--bd-5); }

<body>
<div id="root"></div>
<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useRef } = React;

// 卡片列表已改为持久化：首屏从 GET /api/cards 加载，种子自选股见 server/main.py 的 SEED_CARDS
const TABS = [["min", "分时"], ["day5", "5日"], ["m5", "5分"], ["m30", "30分"], ["m60", "60分"], ["day", "日K"]];
// ===== 主题 =====
// 亮/暗两套颜色只写在 CSS 变量里（:root 是深色，html.light 是亮色），切主题就是给 <html> 加/去 light 类。
// ECharts 读不到样式表，所以建图时用 chartPal() 把当前生效的变量值取出来交给 option；
// 主题一变、卡片 effect 重跑（theme 在依赖里），图就按新主题重绘。
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const chartPal = () => ({
  up: cssVar("--up"), dn: cssVar("--dn"), dif: cssVar("--dif"),  // 国内红涨绿跌
  ma: [["ma3", cssVar("--ma3")], ["ma5", cssVar("--ma5")], ["ma85", cssVar("--ma85")], ["ma125", cssVar("--ma125")]],
  zoom: { border: cssVar("--zoom-border"), bg: cssVar("--zoom-bg"), tx: cssVar("--zoom-tx"),
          line: cssVar("--zoom-line"), area: cssVar("--zoom-area"),
          selLine: cssVar("--zoom-sel-line"), filler: cssVar("--zoom-filler") },
  draw: cssVar("--draw"), drawSel: cssVar("--draw-sel"),
});
// 双击 HTML（file://）或本地预览服务器（如 VSCode Live Preview，本机非 8000 端口）打开时，接口指向本机后端；
// 经 uvicorn 托管打开或线上部署时，用同源相对路径
const API_BASE = (location.protocol === "file:" ||
  ((location.hostname === "127.0.0.1" || location.hostname === "localhost") && location.port !== "8000"))
  ? "http://127.0.0.1:8000" : "";

async function getJSON(url) {
  const r = await fetch(API_BASE + url);
  const d = await r.json();
  if (d.error || d.detail) throw new Error(d.error || d.detail);
  return d;
}

// 交易类写操作（POST/DELETE）：与 getJSON 同样把后端 {error|detail} 抛成异常给调用方显示
async function sendJSON(url, method, body) {
  const r = await fetch(API_BASE + url, {
    method, headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json();
  if (d.error || d.detail) throw new Error(d.error || d.detail);
  return d;
}

// 把整份卡片列表回写后端 SQLite（增/删/拖拽排序/切换周期都会全量保存）
async function saveCards(list) {
  try {
    await fetch(API_BASE + "/api/cards", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards: list }),
    });
  } catch (e) { console.error("卡片保存失败", e); }
}

// datetime-local 输入值（本机时区、到分钟）：YYYY-MM-DDTHH:mm，买卖气泡的默认成交时间
const nowLocal = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

function kOpt(d, zoomAll) {
  const P = chartPal();  // 当前主题配色（深/亮各一套变量值）
  const rows = d.klines || [];
  const cats = rows.map(r => r[0]);
  const ind = d.ind || {};
  const k = rows.map(r => [+r[1], +r[2], +r[4], +r[3]]); // 东财/腾讯序: o,c,h,l -> echarts: o,c,l,h
  const macd = ind.macd || [];
  const cls = rows.map(r => +r[2]);
  const base = cls.length > 1 ? cls[cls.length - 2] : (cls[0] || 1);  // 涨跌%基准：昨收(倒数第二根收盘)
  let lo = Math.min(...k.map(v => v[2])), hi = Math.max(...k.map(v => v[3]));
  // 85/125日均线含窗口外预热段的价格（如大跌后均线远高于图内K线），Y轴范围须并入均线值，防均线被上下边缘裁掉
  P.ma.forEach(([key]) => (ind[key] || []).forEach(v => {
    if (v == null) return;
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }));
  if (!(hi > lo)) { lo *= 0.999; hi = hi * 1.001 || 1; }  // 防单根K线除零
  return {
    animation: false,
    backgroundColor: "transparent",  // 交给卡片/弹窗的深色底，画布不再自带浅底
    // 十字光标只保留三轴指针标签（左股价/右涨跌%/底部日期），不弹白色浮窗
    tooltip: { trigger: "axis", showContent: false, axisPointer: { type: "cross", link: [{ xAxisIndex: "all" }] } },
    grid: [
      { left: 44, right: 48, top: 8, height: "55%" },
      { left: 44, right: 48, top: "66%", height: "20%" },  // 与主图间隙缩到3%，副图略加高
    ],
    xAxis: [
      { type: "category", data: cats, gridIndex: 0, axisLabel: { show: false } },
      { type: "category", data: cats, gridIndex: 1 },
    ],
    yAxis: [
      { scale: false, min: lo, max: hi, gridIndex: 0,                      // 左：价格
        axisPointer: { label: { show: true, formatter: p => (+p.value).toFixed(3) } } },
      { scale: true, gridIndex: 1, splitLine: { show: false } },           // 中：MACD
      { scale: false, min: lo, max: hi, gridIndex: 0, position: "right",  // 右：涨跌%（与价格同min/max严格对齐）
        axisLine: { show: false }, splitLine: { show: false },
        axisLabel: { formatter: v => ((v - base) / base * 100).toFixed(2) + "%" },
        axisPointer: { label: { show: true, formatter: p => ((p.value - base) / base * 100).toFixed(2) + "%" } } },
    ],
    dataZoom: [{ type: "inside", xAxisIndex: [0, 1], start: zoomAll ? 0 : 80, end: 100 }],  // 平时只看最后60根；有日期筛选时显示整个区间
    series: [
      { name: "K", type: "candlestick", data: k,
        itemStyle: { color: P.up, color0: P.dn, borderColor: P.up, borderColor0: P.dn } },
      ...P.ma.map(([key, c]) => ({ name: key.toUpperCase(), type: "line", data: ind[key], showSymbol: false, lineStyle: { width: 1, color: c } })),
      { name: "MACD", type: "bar", xAxisIndex: 1, yAxisIndex: 1, data: macd.map(v => v == null ? null : { value: v, itemStyle: { color: v >= 0 ? P.up : P.dn } }) },
      { name: "DIF", type: "line", xAxisIndex: 1, yAxisIndex: 1, data: ind.dif, showSymbol: false, lineStyle: { width: 1, color: P.dif } },
      { name: "DEA", type: "line", xAxisIndex: 1, yAxisIndex: 1, data: ind.dea, showSymbol: false, lineStyle: { width: 1, color: "#e6a23c" } },
    ],
  };
}

// 放大视图专用：在 kOpt 结果上补一条底部横向缩放轴（拖两端看更多/更少K线），
// 同时把副图改成 top+bottom 定位，给滑块和日期轴标签留出空间（卡片小图仍不带滑块）
function withSlider(opt) {
  const Z = chartPal().zoom;
  const z = opt.dataZoom[0];
  return {
    ...opt,
    grid: [opt.grid[0], { ...opt.grid[1], top: "64%", bottom: 58 }],
    dataZoom: [
      { ...z },
      { type: "slider", xAxisIndex: [0, 1], left: 44, right: 48, bottom: 4, height: 20,
        borderColor: Z.border, backgroundColor: Z.bg, fillerColor: Z.filler,
        handleStyle: { color: "#f99502", borderColor: "#f99502" }, moveHandleSize: 0, showDetail: false,
        textStyle: { color: Z.tx, fontSize: 10 },
        dataBackground: { lineStyle: { color: Z.line }, areaStyle: { color: Z.area } },
        selectedDataBackground: { lineStyle: { color: Z.selLine }, areaStyle: { color: "rgba(249,149,2,.12)" } } },
    ],
  };
}

function lineOpt(pts, base) {
  const ys = pts.length ? pts.map(p => p[1]) : [1];
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (!(hi > lo)) { lo *= 0.999; hi = hi * 1.001 || 1; }
  base = base || ys[0] || 1;  // 分时%基准：昨收，缺省用首价
  return {
    animation: false,
    backgroundColor: "transparent",  // 同 kOpt：画布透明，用深色卡片底
    // 同 K 线：只要三轴指针标签，不要白色浮窗
    tooltip: { trigger: "axis", showContent: false, axisPointer: { type: "cross" } },
    grid: { left: 44, right: 48, top: 8, bottom: 20 },
    xAxis: { type: "category", data: pts.map(p => p[0]) },
    yAxis: [
      { scale: false, min: lo, max: hi,
        axisPointer: { label: { show: true, formatter: p => (+p.value).toFixed(3) } } },
      { scale: false, min: lo, max: hi, position: "right", axisLine: { show: false }, splitLine: { show: false },
        axisLabel: { formatter: v => ((v - base) / base * 100).toFixed(2) + "%" },
        axisPointer: { label: { show: true, formatter: p => ((p.value - base) / base * 100).toFixed(2) + "%" } } },
    ],
    dataZoom: [{ type: "inside" }],
    series: [{ type: "line", data: ys, showSymbol: false, lineStyle: { color: "#f99502" } }],
  };
}

// ==================== 画线：趋势线 / 水平线 ====================
// 数据 {id, kind:"trend"|"h", pts:[{x:类目, y:价格}]}；所有线合并成一条 id=__drawings 的折线 series，
// 段与段之间用 null 断开——缩放/刷新时随 K 线自动跟随，删除时整条 series 重算即可。
// 画线模式下单击=水平线（横贯当前窗口）、拖拽=任意角度斜线；点击线=选中（加粗高亮），选中后：按住线身=整条线平移、拖两端白心圆点=单独挪这一端（水平线拖一端即变斜线）、Delete/Backspace 删该线；右键点在线上=删该线；提示条上的清空=删当前标的+周期全部线
// 画线配色也跟主题走：建图时由 createDrawings 从 CSS 变量同步（对象就地改值，图内各处按引用取用）
const DRAW_STYLE = { color: "", width: 1 };  // 黄色半透明 1px
const DRAW_SEL = { color: "", width: 2.5 };  // 选中线：加粗 + 实色橙，叠在原线之上

function createDrawings(chart, opt) {
  DRAW_STYLE.color = chartPal().draw;
  DRAW_SEL.color = chartPal().drawSel;
  const st = { mode: false, rows: [], lines: [], seg: [], drag: null, cur: "", vkey: "", sel: null, zlock: null };
  const zr = chart.getZr();
  let down = null, last = null;

  // 当前 dataZoom 可视区首末类别：h 线的两端手柄必须落在窗口内才拖得到（缩放后也不会跑到画外）
  const viewEnds = () => {
    if (st.vends !== undefined) return st.vends;
    const n = st.rows.length;
    if (!n) return (st.vends = null);
    const dz = (chart.getOption().dataZoom || [])[0] || {};
    let i0 = 0, i1 = n - 1;
    if (dz.startValue != null || dz.endValue != null) {
      const a = st.rows.findIndex(r => r[0] === dz.startValue);
      const b = st.rows.findIndex(r => r[0] === dz.endValue);
      if (a >= 0) i0 = a;
      if (b >= 0) i1 = b;
    } else if (dz.start != null || dz.end != null) {
      i0 = Math.round((+dz.start || 0) / 100 * (n - 1));
      i1 = Math.round((dz.end != null ? +dz.end : 100) / 100 * (n - 1));
    }
    i0 = Math.min(Math.max(i0, 0), n - 1);
    i1 = Math.min(Math.max(i1, i0), n - 1);
    st.vends = [st.rows[i0][0], st.rows[i1][0]];
    return st.vends;
  };
  // 线的两个端点：h 线横贯当前窗口（可视区首末类目同一价格），trend 取自己存的两点
  const endsOf = l => {
    const pts = l.pts || [];
    if (l.kind === "h") {
      if (!pts.length) return null;
      const v = viewEnds();
      return v ? [[v[0], pts[0].y], [v[1], pts[0].y]] : null;
    }
    return pts.length >= 2 ? [[pts[0].x, pts[0].y], [pts[1].x, pts[1].y]] : null;
  };
  const pxOf = p => {
    const v = chart.convertToPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [p[0], p[1]]);
    return v && isFinite(v[0]) && isFinite(v[1]) ? v : null;
  };
  // 命中端点手柄（9px 内）→ {id, idx, pts}：按住圆点拖动 = 挪这一端；画线模式下全图可拖，否则抓中即选中该线
  const hitHandle = (mx, my) => {
    let best = null, bd = 9;
    st.lines.forEach(l => {
      const e = endsOf(l);
      if (!e) return;
      e.forEach((p, idx) => {
        const c = pxOf(p);
        if (!c) return;
        const d = Math.hypot(c[0] - mx, c[1] - my);
        if (d <= bd) { bd = d; best = { id: l.id, idx, pts: e.map(q => ({ x: q[0], y: q[1] })) }; }
      });
    });
    return best;
  };
  const setCur = c => { if (st.cur !== c) { st.cur = c; zr.setCursorStyle(c); } };

  // 点到线段的像素距离：6px 内算点中，用于单击选中线
  const distToSeg = (px, py, a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = dx * dx + dy * dy;
    let t = L ? ((px - a[0]) * dx + (py - a[1]) * dy) / L : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (a[0] + t * dx), py - (a[1] + t * dy));
  };
  const hitLine = (mx, my) => {
    if (!st.rows.length) return null;
    let best = null, bd = 6;
    st.lines.forEach(l => {
      const e = endsOf(l);
      if (!e) return;
      const a = pxOf(e[0]), b = pxOf(e[1]);
      if (!a || !b) return;
      const d = distToSeg(mx, my, a, b);
      if (d <= bd) { bd = d; best = l.id; }
    });
    return best;
  };

  const render = () => {
    const data = [], seg = [], hd = [];
    let selData = [];
    // 拖动中：这条线按草稿出图（端点拖拽=trend，整线平移保留原 kind），松手才落库
    const lines = st.drag ? st.lines.map(l => l.id === st.drag.id ? { id: l.id, kind: st.drag.kind, pts: st.drag.pts } : l) : st.lines;
    if (st.sel != null && !lines.some(l => l.id === st.sel)) st.sel = null;  // 选中的线已被删：清掉选中态
    if (st.rows.length) {
      lines.forEach(l => {
        const e = endsOf(l);
        if (!e) return;
        const i0 = data.length;
        data.push(e[0], e[1], null);  // null 断段：多条线共用一条 series
        seg.push({ id: l.id, from: i0, to: i0 + 1 });
        if (st.mode || l.id === st.sel) hd.push(e[0], e[1]);  // 端点手柄：画线模式全部、否则只给选中的线
        if (l.id === st.sel) selData = [e[0], e[1]];  // 选中线叠一条加粗高亮
      });
    }
    st.seg = seg;
    chart.setOption({ series: [{
      id: "__drawings", type: "line", xAxisIndex: 0, yAxisIndex: 0, z: 10,
      data, showSymbol: false, triggerLineEvent: true, animation: false,
      lineStyle: DRAW_STYLE, itemStyle: { color: DRAW_STYLE.color },
    }, {
      id: "__drawh", type: "scatter", xAxisIndex: 0, yAxisIndex: 0, z: 30, clip: false,
      data: hd, symbol: "circle", symbolSize: 8, silent: true, animation: false,
      tooltip: { show: false },
      itemStyle: { color: "#fff", borderColor: st.mode ? DRAW_STYLE.color : DRAW_SEL.color, borderWidth: 1.5 },
    }, {
      id: "__drawsel", type: "line", xAxisIndex: 0, yAxisIndex: 0, z: 11, silent: true, animation: false,
      data: selData, showSymbol: false, triggerLineEvent: false,
      lineStyle: DRAW_SEL,
    }] });
    // 画线模式或已选中线：锁住缩放/平移，否则拖端点会连同鼠标一起把图拖走
    const zl = st.mode || st.sel != null;
    if (st.zlock !== zl) { st.zlock = zl; chart.setOption({ dataZoom: [{ disabled: zl }] }); }
  };

  const toPoint = (px, py) => {
    const v = chart.convertFromPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [px, py]);
    if (!v) return null;
    const i = Math.round(v[0]), y = +v[1];
    if (!(i >= 0 && i < st.rows.length) || !(y > 0)) return null;
    return { x: st.rows[i][0], y: +y.toFixed(3) };
  };

  // 拖拽预览：按下后虚线实时跟随鼠标，松手才落成正式线（斜线角度一眼可见）
  const preview = (a, b) => {
    const p = toPoint(a[0], a[1]), q = toPoint(b[0], b[1]);
    chart.setOption({ series: [{
      id: "__drawprev", type: "line", xAxisIndex: 0, yAxisIndex: 0, z: 20, silent: true, animation: false,
      data: p && q ? [[p.x, p.y], [q.x, q.y]] : [], showSymbol: false,
      lineStyle: { color: DRAW_STYLE.color, width: 1, type: "dashed" },
    }] });
  };
  const clearPreview = () => chart.setOption({ series: [{ id: "__drawprev", data: [] }] });
  const finish = (nx, ny) => {
    if (st.drag) {  // 端点拖拽收尾：有位移才落库（水平线拖一端即变斜线，两端高度可分别调）
      const d = st.drag; st.drag = null;
      if (!d.moved) { render(); return; }
      // 不立即重绘：保持拖完的位置，等 setLines 回写后重绘；失败才按原线回滚
      const pr = opt.onUpdate(d.id, d.kind, d.pts);
      if (pr && pr.catch) pr.catch(() => render());
      return;
    }
    if (!st.mode || !down) return;
    const [x0, y0] = down;
    down = null;
    clearPreview();
    const a = toPoint(x0, y0);
    if (!a) return;
    if (Math.abs(nx - x0) < 3 && Math.abs(ny - y0) < 3) {  // 原地单击：点在线上=选中，空白处=画水平线
      const hit = hitLine(nx, ny);
      if (hit != null) { st.sel = hit; render(); return; }
      opt.onAdd("h", [a]);
      return;
    }
    const b = toPoint(nx, ny);
    if (b && !(b.x === a.x && Math.abs(b.y - a.y) < 1e-6)) opt.onAdd("trend", [a, b]);  // 任意角度（含竖线）
  };

  zr.on("mousedown", e => {
    if (e.which && e.which !== 1) return;  // 只响应左键，右键留给删线
    const h = hitHandle(e.offsetX, e.offsetY);  // 端点优先：抓住圆点=挪这一端，并顺手选中该线
    if (h) { st.sel = h.id; st.drag = { id: h.id, kind: "trend", idx: h.idx, pts: h.pts, moved: false }; down = null; render(); return; }
    if (!st.mode) {
      // 已选中的线：按住线身=整条线平移（两端一起跟手）；未选中的线先交给 click 去选中
      if (st.sel != null && hitLine(e.offsetX, e.offsetY) === st.sel) {
        const l = st.lines.find(x => x.id === st.sel);
        const v = chart.convertFromPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [e.offsetX, e.offsetY]);
        if (l && v && l.pts && l.pts.length) {
          const isH = l.kind === "h";
          const pts = isH ? [{ x: l.pts[0].x, y: l.pts[0].y }] : (endsOf(l) || []).map(q => ({ x: q[0], y: q[1] }));
          const ii = isH ? null : pts.map(q => st.rows.findIndex(r => r[0] === q.x));
          st.drag = { id: l.id, kind: l.kind, idx: null, pts, base: pts.map(q => ({ ...q })), moved: false,
                      i0: v[0], y0: +v[1], ii: ii && ii.every(k => k >= 0) ? ii : null };
          down = null; render(); return;
        }
      }
      return;  // 没抓到端点也没按住已选中的线：交还给缩放/平移
    }
    down = [e.offsetX, e.offsetY];
    last = down;
  });
  zr.on("mousemove", e => {
    last = [e.offsetX, e.offsetY];
    if (st.drag) {
      const d = st.drag;
      if (d.idx == null) {  // 整条线平移：两端按同一位移跟手（x 按类目吸整、y 按价格）
        const v = chart.convertFromPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [e.offsetX, e.offsetY]);
        if (v) {
          const dy = +v[1] - d.y0;
          let di = 0;
          if (d.ii) {
            di = Math.round(v[0] - d.i0);
            const lo = Math.min(...d.ii), hi = Math.max(...d.ii);
            di = Math.min(Math.max(di, -lo), st.rows.length - 1 - hi);  // 两端不能挪出数据范围
          }
          d.pts = d.base.map((p, k) => ({
            x: d.ii ? st.rows[d.ii[k] + di][0] : p.x,
            y: +Math.max(0.001, p.y + dy).toFixed(3),
          }));
          d.moved = true;
          render();
        }
        return;
      }
      const p = toPoint(e.offsetX, e.offsetY);
      if (p) { d.pts[d.idx] = p; d.moved = true; render(); }
      return;
    }
    if (!st.mode) {
      setCur(hitHandle(e.offsetX, e.offsetY) ? "ns-resize" : hitLine(e.offsetX, e.offsetY) != null ? (st.sel != null ? "move" : "pointer") : "default");
      return;
    }
    if (down) preview(down, last);
    else setCur(hitHandle(e.offsetX, e.offsetY) ? "ns-resize" : "crosshair");
  });
  zr.on("click", e => {  // 非画线模式：点线=选中，点空白=取消（画线模式的选中在 finish 里做，不重复）
    if (st.mode) return;
    const hit = hitLine(e.offsetX, e.offsetY);
    if (hit !== st.sel) { st.sel = hit; render(); }
  });
  zr.on("mouseup", e => finish(e.offsetX, e.offsetY));
  const onWinUp = () => { if (st.drag || (down && last)) finish(last[0], last[1]); };  // 拖到画布外松手也能落线
  window.addEventListener("mouseup", onWinUp);
  chart.on("contextmenu", p => {  // 右键线删除
    if (p.seriesId !== "__drawings") return;
    const s = st.seg.find(v => p.dataIndex >= v.from && p.dataIndex <= v.to);
    if (s) opt.onDel(s.id);
  });
  const onKey = e => {  // Delete/Backspace 删选中的线（焦点在输入框时不拦截，避免删字变删线）
    if (e.key !== "Delete" && e.key !== "Backspace") return;
    if (st.sel == null) return;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    const id = st.sel; st.sel = null;
    opt.onDel(id);
    e.preventDefault();
  };
  window.addEventListener("keydown", onKey);
  const onDocDown = e => {  // 点到本图以外：取消选中，避免多张卡同时持有选中态
    if (st.sel == null || chart.getDom().contains(e.target)) return;
    st.sel = null; render();
  };
  document.addEventListener("mousedown", onDocDown, true);
  chart.getDom().addEventListener("contextmenu", e => e.preventDefault());  // 不让浏览器右键菜单挡住删线
  const onZoom = () => {  // 缩放/平移后重新对齐 h 线的窗口端点与手柄
    st.vends = undefined;
    const v = viewEnds(), key = v ? v.join("|") : "";
    if (key === st.vkey) return;  // 窗口没变就不重绘，防止自触发循环
    st.vkey = key; render();
  };
  chart.on("dataZoom", onZoom);
  chart.on("datazoom", onZoom);  // 事件名两种写法都挂上，避免版本差异导致不触发

  return {
    destroy() {
      window.removeEventListener("mouseup", onWinUp);
      window.removeEventListener("keydown", onKey);
      document.removeEventListener("mousedown", onDocDown, true);
    },
    setMode(on) {
      st.mode = on;
      setCur(on ? "crosshair" : "default");
      render();  // 模式切换：开=全部线显示端点手柄；缩放锁在 render 里同步
    },
    setRows(rows) { st.rows = rows || []; st.vends = undefined; render(); },
    setLines(lines) { st.lines = lines || []; render(); },
  };
}

function Card({ symbol, name, period, onPeriod, dstart, dend, index, onDragStart, onDropCard, onDelete, quote, holding, onTrade, theme }) {
  const ref = useRef();
  const tradeRef = useRef();  // 交易行（含气泡）引用：用于判断气泡外点击

  const [zoom, setZoom] = useState(false);  // 放大视图：右上角放大icon → 大图弹层

  const [zerr, setZerr] = useState("");

  const [lines, setLines] = useState([]);
  const [drawOn, setDrawOn] = useState(false);
  const ctlRef = useRef(null), zctlRef = useRef(null);
  const dref = useRef({ lines: [], on: false });
  dref.current.lines = lines; dref.current.on = drawOn;
  useEffect(() => {
    let dead = false;
    getJSON(`/api/drawings?symbol=${symbol}&period=${period}`)
      .then(d => { if (!dead) setLines(d.items || []); })
      .catch(() => {});
    return () => { dead = true; };
  }, [symbol, period]);
  useEffect(() => {  // 线增删或模式切换：同步给卡片图和放大图

  useEffect(() => {

  const clearLines = () => {  // 清空当前标的+周期的全部线（后端删库，前端立即清屏）
    setLines([]);
    fetch(API_BASE + `/api/drawings?symbol=${symbol}&period=${period}`, { method: "DELETE" }).catch(() => {});
  };
  const drawApi = {  // 画线增/删/改：落库成功后回写 state，图随 state 重绘
    onAdd: (kind, pts) => sendJSON("/api/drawings", "POST", { symbol, period, kind, pts })
      .then(d => setLines(v => [...v, d.item])).catch(() => {}),
    onDel: id => fetch(API_BASE + "/api/drawings/" + id, { method: "DELETE" })
      .then(() => setLines(v => v.filter(x => x.id !== id))).catch(() => {}),
    onUpdate: (id, kind, pts) => sendJSON("/api/drawings/" + id, "PUT", { kind, pts })  // 拖端点改两端高度
      .then(d => setLines(v => v.map(x => x.id === id ? d.item : x)))

        if (period === "day5") throw new Error("5日待接入(东财 trends2)");
        if (period === "min") {
          const d = await getJSON(`/api/minute?symbol=${symbol}`);
          const pts = (d.points || []).map(s => { const a = s.split(" "); return [a[0], +a[1]]; });
          chart.setOption(lineOpt(pts, +((d.quote || [])[4])), true);
        } else {
          const dr = (dstart || dend) ? `&start=${dstart}&end=${dend}` : "";
          const d = await getJSON(`/api/kline?symbol=${symbol}&period=${period}&limit=300${dr}`);
          chart.setOption(withSlider(kOpt(d, Boolean(dstart || dend))), true);
          const ctl = createDrawings(chart, drawApi);
          zctlRef.current = ctl;
          ctl.setRows(d.klines || []);
          ctl.setLines(dref.current.lines);
          ctl.setMode(dref.current.on);
        }
      } catch (e) { if (!dead) setZerr(String(e.message || e)); }
      finally { if (!dead) setZload(false); }
    })();
    const onRs = () => chart.resize();
    window.addEventListener("resize", onRs);
    return () => { dead = true; if (zctlRef.current) zctlRef.current.destroy(); zctlRef.current = null; window.removeEventListener("resize", onRs); chart.dispose(); };
  }, [zoom, symbol, period, dstart, dend, theme]);
  useEffect(() => {
    if (!zoom) return;
    const onKey = e => e.key === "Escape" && setZoom(false);
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [zoom]);
  const submitTrade = async () => {
    const price = parseFloat(fprice), qty = parseFloat(fqty);
    if (!(price > 0) || !(qty > 0)) { setTerr("价格/数量需大于0"); return; }
    if (form === "sell" && qty > sellable) { setTerr("卖出数量超过可卖 " + sellable); return; }
    setBusy(true); setTerr("");
    try {
      await sendJSON("/api/orders", "POST", { symbol, name, side: form, price, qty, ts: ftime });
      setForm(null); setDone(form); setTimeout(() => setDone(""), 1500);
      onTrade();  // 刷新持仓/订单/汇总（不在卡里的新持仓会随 symKey 联动补报价）
    } catch (e) { setTerr(String(e.message || e)); }
    finally { setBusy(false); }
  };
  return html`<div className="card"
    onDragOver=${e => e.preventDefault()}
    onDrop=${() => onDropCard(index)}>
    ${period !== "min" && period !== "day5" && html`<button className=${"del drbtn" + (drawOn ? " on" : "")} title="画线：单击画水平线，拖拽画斜线，拖线两端圆点调高度，点线选中后按 Delete 删除；右键线删除" onClick=${() => setDrawOn(v => !v)}><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 10l.7-2.6L8 2.1l1.9 1.9-5.3 5.3L2 10z" fill="none" stroke="currentColor" strokeWidth="1.2"/></svg></button>`}
    <button className="del zbtn" title="放大" onClick=${() => setZoom(true)}><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 5V1h4M7 1h4v4M11 7v4H7M5 11H1V7" fill="none" stroke="currentColor" strokeWidth="1.4"/></svg></button>
    <button className="del" title="删除卡片" onClick=${() => onDelete(symbol)}>✕</button>
    <div className="hd">
      <span className="grip" draggable="true"
        onDragStart=${e => { e.dataTransfer.setData("text/plain", String(index)); e.dataTransfer.effectAllowed = "move"; onDragStart(index); }}>
        ≡ <b>${name}</b><span style=${{ opacity: .55, fontSize: 12 }}>${symbol}</span>${flag && html`<img className="flag" draggable="false" src=${"vendor/flags/" + flag + ".svg"} alt="" />`}
      </span>
      <div className="hrow2">
        <span>${px != null && chg != null && html`<span className=${"px" + (chg > 0 ? " up" : chg < 0 ? " dn" : "")}>${px}</span><span className=${"chg" + (chg > 0 ? " up" : chg < 0 ? " dn" : "")}>${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`}</span>
        ${holding && pl != null && html`<span className="hold">持仓盈亏<b className=${pl >= 0 ? "up" : "dn"}>${pl >= 0 ? "+" : ""}${pl.toFixed(2)}</b><span className=${plpct >= 0 ? "up" : "dn"}>${plpct >= 0 ? "+" : ""}${plpct.toFixed(2)}%</span></span>`}
      </div>
      <div className="tabrow">
        <span className="tabs">
          ${TABS.map(([p, t]) => html`<button key=${p} className=${p === period ? "on" : ""} onClick=${() => onPeriod(symbol, p)}>${t}</button>`)}
        </span>
        <div className="trade" ref=${tradeRef}>
          <button className="tbn" disabled=${busy} onClick=${() => openForm("buy")}>${done === "buy" ? "已买入" : "买入"}</button>
          <button className="tbn sell" disabled=${sellable <= 0 || busy}
            title=${sellable > 0 ? "可卖 " + sellable : holding ? "A股当日买入，次日可卖" : "无持仓"}
            onClick=${() => openForm("sell")}>${done === "sell" ? "已卖出" : "卖出"}</button>
          ${form && html`<div className="pop">
            <div className="prow">
              <label>${form === "buy" ? "买入时间" : "卖出时间"}</label>
              <input type="datetime-local" value=${ftime} max=${nowLocal()} onChange=${e => setFtime(e.target.value)} />
            </div>
            <div className="prow">
              <label>价格</label>
              <input type="number" step="any" min="0" value=${fprice} onChange=${e => onPrice(e.target.value)} placeholder="价格" />
            </div>
            <div className="prow">
              <label>数量</label>
              <button className="step" disabled=${busy} onClick=${() => stepQty(-1)}>−</button>
              <input type="number" step="any" min="0" max=${qmax != null ? String(qmax) : undefined} className=${qOver ? "over" : ""} value=${fqty} onChange=${e => onQty(e.target.value)} placeholder="数量" title=${qmax != null ? "最多可卖 " + qmax : undefined} />
              <button className="step" disabled=${busy || (qmax != null && q >= qmax)} onClick=${() => stepQty(1)}>＋</button>
            </div>
            ${qmax != null && html`<div className="prow" style=${{ marginTop: "-4px" }}>
              <label style=${{ width: "auto", fontSize: "11px", color: cssVar("--tx-4") }}>可卖 ${sellable} 股 / 持仓 ${holding ? holding.shares : 0} 股（数量已默认填满可卖）</label>
            </div>`}
            <div className="prow">
              <label>总价</label>
              <b className="amt">${famtShow}</b>
            </div>
            ${terr && html`<span className="terr">${terr}</span>`}
            <div className="pact">
              <button className="tbn ok" disabled=${busy} onClick=${submitTrade}>${busy ? "提交中…" : "确认"}</button>
              <button className="tbn" style=${{ borderColor: cssVar("--bd-1c"), color: cssVar("--tx-4"), background: cssVar("--bg-card") }} disabled=${busy} onClick=${() => setForm(null)}>取消</button>
            </div>
          </div>`}
        </div>
      </div>
    </div>
    <div className="chart" ref=${ref}></div>
    ${drawOn && html`<div className="drtip">单击画线 · 拖拽画斜线 · 点线后：拖线身整条挪、拖圆点调两端、Delete 删除${lines.length > 0 && html`<button onClick=${clearLines}>清空</button>`}</div>`}
    ${loading && !err && html`<div className="ld">加载中…</div>`}
    ${err && html`<div className="err">${err}</div>`}
    ${zoom && html`<div className="zmask" onClick=${() => setZoom(false)}>
      <div className="zpanel" onClick=${e => e.stopPropagation()}>
        <div className="zhd">
          <b>${name}</b>
          <span style=${{ opacity: .55, fontSize: 12 }}>${symbol} · ${(TABS.find(t => t[0] === period) || ["", ""])[1]}</span>
          ${px != null && chg != null && html`<span className="px">${px}</span><span className=${chg > 0 ? "up" : chg < 0 ? "dn" : ""} style=${{ fontSize: 12, fontWeight: 600 }}>${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`}
          <button className=${"zdraw" + (drawOn ? " on" : "")} title="画线：单击画水平线，拖拽画斜线，拖线两端圆点调高度，点线选中后按 Delete 删除；右键线删除" onClick=${() => setDrawOn(v => !v)}>画线</button>
          <button className="zdelcard" title="删除这张卡片：库里该行一并删除，主页面同步移除" onClick=${() => onDelete(symbol)}>删除卡片</button>
          <button className="zclose" title="关闭" onClick=${() => setZoom(false)}>✕</button>
        </div>
        <div className="zchart" ref=${zref}></div>
        ${drawOn && html`<div className="drtip" style=${{ bottom: 26 }}>单击画线 · 拖拽画斜线 · 点线后：拖线身整条挪、拖圆点调两端、Delete 删除${lines.length > 0 && html`<button onClick=${clearLines}>清空</button>`}</div>`}
        ${zload && !zerr && html`<div className="znote">加载中…</div>`}
        ${zerr && html`<div className="znote" style=${{ color: cssVar("--up") }}>${zerr}</div>`}
