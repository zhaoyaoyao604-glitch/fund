<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= 粒子背景 ================= */
  var cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, pts = [], mouse = { x: -9999, y: -9999 };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * DPR);
    H = cv.height = Math.floor(innerHeight * DPR);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    var n = Math.min(100, Math.round(innerWidth * innerHeight / 16000));
    pts = [];
    for (var i = 0; i < n; i++) {
      pts.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .3 * DPR,
        vy: (Math.random() - .5) * .3 * DPR,
        r: (Math.random() * 1.4 + .7) * DPR
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var i, j, p, q, dx, dy, d, R = 150 * DPR;

    for (i = 0; i < pts.length; i++) {
      p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      dx = p.x - mouse.x; dy = p.y - mouse.y;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < R && d > .1) {
        var f = (1 - d / R) * .9;
        p.x += dx / d * f * DPR;
        p.y += dy / d * f * DPR;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(140,205,255,.5)';
      ctx.fill();
    }

    var maxD = 130 * DPR;
    for (i = 0; i < pts.length; i++) {
      p = pts[i];
      for (j = i + 1; j < pts.length; j++) {
        q = pts[j];
        dx = p.x - q.x; dy = p.y - q.y;
        d = Math.sqrt(dx * dx + dy * dy);
        if (d < maxD) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = 'rgba(90,150,240,' + ((1 - d / maxD) * .3).toFixed(3) + ')';
          ctx.lineWidth = .8 * DPR;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  addEventListener('mousemove', function (e) {
    mouse.x = e.clientX * DPR; mouse.y = e.clientY * DPR;
  });
  addEventListener('resize', resize);
  resize();
  if (!reduce) draw();

  /* ================= 鼠标光晕 ================= */
  var gl = document.getElementById('cglow');
  var gx = 0, gy = 0, tx = 0, ty = 0, first = false;
  addEventListener('mousemove', function (e) {
    tx = e.clientX; ty = e.clientY;
    if (!first) { gx = tx; gy = ty; first = true; gl.style.opacity = '1'; }
  });
  addEventListener('mouseleave', function () { gl.style.opacity = '0'; });
  (function follow() {
    gx += (tx - gx) * .12; gy += (ty - gy) * .12;
    gl.style.transform = 'translate(' + gx.toFixed(1) + 'px,' + gy.toFixed(1) + 'px)';
    requestAnimationFrame(follow);
  })();

  /* ================= 输入框交互 ================= */
  var ta = document.getElementById('ta');
  var composer = document.getElementById('composer');
  var sendBtn = document.getElementById('send');
  var thread = document.getElementById('thread');
  var chips = document.getElementById('chips');

  function grow() {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  }

  ta.addEventListener('input', function () {
    grow();
    sendBtn.disabled = !ta.value.trim();
  });
  ta.addEventListener('focus', function () { composer.classList.add('focus'); });
  ta.addEventListener('blur', function () { composer.classList.remove('focus'); });

  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);
  sendBtn.disabled = true;

  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    ta.value = b.textContent;
    grow();
    send();
  });

  /* ================= toast ================= */
  var toastEl = document.getElementById('toast'), toastT = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 1700);
  }

  /* ================= 会话与侧栏 ================= */
  var DEMOS = [
    {
      title: '设计科技感酷炫的 agent 页面', time: '7分钟前',
      msgs: [
        { r: 'u', text: '设计一个酷炫的 agent 页面，最简单的首页就行，但是要科技感酷炫' },
        { r: 'b', text: '已生成深色科技风对话首页：粒子星网背景、渐变辉光标题、悬浮光斑卡片，左侧带会话侧栏。', tool: { name: 'ui.generate', ms: 412 } }
      ]
    },
    {
      title: '维护可定制化办公数据页面', time: '2天前',
      msgs: [
        { r: 'u', text: '这个办公数据页需要支持自定义列' },
        { r: 'b', text: '把列配置抽成一份 schema，渲染层按 schema 出表头与单元格，用户改配置只动数据不动代码。', tool: null }
      ]
    },
    {
      title: '生成拼多多周报 AI 产品', time: '11月3日',
      msgs: [
        { r: 'u', text: '生成上周的 AI 产品周报' },
        { r: 'b', text: '已按「数据 → 结论 → 下周计划」三段式整理，异常项单独标了原因。', tool: { name: 'report.build', ms: 288 } }
      ]
    },
    {
      title: '庄家预判止损交易策略', time: '11月1日',
      msgs: [
        { r: 'u', text: '帮我看下止损反手的预判逻辑' },
        { r: 'b', text: '关键在触发条件与仓位口径两处：先定触发（跌破 N 根均线），再定动作（减半还是清仓），两者不要混在一个判断里。', tool: null }
      ]
    },
    {
      title: '网络', time: '11月1日',
      msgs: [
        { r: 'u', text: '网络这块单独开一个任务' },
        { r: 'b', text: '好的，这个任务先占个位，等你有具体内容再展开。', tool: null }
      ]
    },
    {
      title: '行情数据复盘脚本', time: '10月28日',
      msgs: [
        { r: 'u', text: '写个脚本把每天的分时数据存下来' },
        { r: 'b', text: '可以，按「拉取 → 落库 → 去重」三步走，异常数据先记日志不阻塞主流程。', tool: null }
      ]
    }
  ];

  var LS = 'agent.sidebar.v1';
  var now = Date.now();
  var SEED_TS = [now - 7 * 60000, now - 2 * 864e5, now - 8 * 864e5, now - 10 * 864e5, now - 10 * 864e5 + 36e5, now - 14 * 864e5];
  var SPACE_COLORS = ['#35e6ff', '#7c5cff', '#ff3ea5', '#4be09a', '#ffb03a'];

  var sbList = document.getElementById('sbList');
  var spaceList = document.getElementById('spaceList');
  var tbTitle = document.getElementById('tbTitle');
  var moreLink = document.getElementById('moreLink');
  var taskCount = document.getElementById('taskCount');
  var spaceCount = document.getElementById('spaceCount');
  var qEl = document.getElementById('q');
  var ctxEl = document.getElementById('ctx');
  var appsPanel = document.getElementById('appsPanel');
  var spaceFilter = null;

  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function seed() {
    return {
      convs: DEMOS.map(function (d, i) {
        return {
          id: 'c' + i,
          title: d.title,
          ts: SEED_TS[i] || Date.now(),
          msgs: d.msgs,
          pin: i === 3,
          spaceId: i === 2 || i === 5 ? 's1' : (i === 1 ? 's2' : null)
        };
      }),
      spaces: [
        { id: 's1', name: '基金看盘', color: SPACE_COLORS[0] },
        { id: 's2', name: '办公自动化', color: SPACE_COLORS[1] }
      ],
      curId: null,
      expanded: false,
      collapsed: false
    };
  }

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(LS) || 'null');
      if (s && s.convs instanceof Array && s.spaces instanceof Array) return s;
    } catch (e) {}
    return seed();
  }

  var st = load();
  var convs = st.convs;
  var spaces = st.spaces;
  var cur = null, expanded = !!st.expanded;
  if (st.collapsed) document.body.classList.add('collapsed');

  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        convs: convs, spaces: spaces, curId: cur ? cur.id : null,
        expanded: expanded, collapsed: document.body.classList.contains('collapsed')
      }));
    } catch (e) {}
  }

  var ICON = {
    pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><path d="M12 15v5"/></svg>',
    edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M14 6l4 4"/></svg>',
    copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a2 2 0 0 0-2 2v9"/></svg>',
    del: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
    folder: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>',
    dots: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>'
  };

  function rel(ts) {
    var d = Date.now() - ts;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.max(1, Math.floor(d / 60000)) + '分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + '小时前';
    var t = new Date(ts), n = new Date();
    if (t.getFullYear() !== n.getFullYear()) return t.getFullYear() + '年' + (t.getMonth() + 1) + '月';
    return (t.getMonth() + 1) + '月' + t.getDate() + '日';
  }

  function groupOf(c) {
    var t = new Date(c.ts), n = new Date();
    var day = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var diff = (day(n) - day(t)) / 864e5;
    if (diff <= 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff < 7) return '最近 7 天';
    return '更早';
  }

  function visible() {
    var kw = qEl.value.trim().toLowerCase();
    return convs.filter(function (c) {
      if (spaceFilter && c.spaceId !== spaceFilter) return false;
      if (!kw) return true;
      var hay = c.title + ' ' + (c.msgs || []).map(function (m) { return m.text || ''; }).join(' ');
      return hay.toLowerCase().indexOf(kw) >= 0;
    }).sort(function (a, b) {
      if (!!a.pin !== !!b.pin) return a.pin ? -1 : 1;
      return b.ts - a.ts;
    });
  }

  function convRow(c) {
    var row = document.createElement('div');
    row.className = 'conv' + (cur && cur.id === c.id ? ' on' : '');
    row.dataset.id = c.id;
    row.tabIndex = 0;

    if (c.pin) {
      var p = document.createElement('span');
      p.className = 'conv-pin';
      p.innerHTML = ICON.pin;
      row.appendChild(p);
    }
    var t = document.createElement('span');
    t.className = 'conv-t';
    t.textContent = c.title;
    var d = document.createElement('span');
    d.className = 'conv-d';
    d.textContent = rel(c.ts);
    row.appendChild(t);
    row.appendChild(d);

    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'conv-more';
    more.title = '更多操作';
    more.innerHTML = ICON.dots;
    more.addEventListener('click', function (e) { e.stopPropagation(); openConvMenu(c, more); });
    row.appendChild(more);

    row.addEventListener('click', function () { openConv(c); });
    row.addEventListener('keydown', function (e) { if (e.key === 'Enter') openConv(c); });
    row.addEventListener('contextmenu', function (e) { e.preventDefault(); openConvMenu(c, row); });
    return row;
  }

  function renderSidebar() {
    taskCount.textContent = '(' + convs.length + ')';
    spaceCount.textContent = '(' + spaces.length + ')';
    sbList.innerHTML = '';

    var list = visible();
    if (!list.length) {
      var e = document.createElement('div');
      e.className = 'sb-empty';
      e.textContent = qEl.value.trim() ? '没有匹配的任务' : (spaceFilter ? '这个空间还没有任务' : '暂无任务，发一句话就开始');
      sbList.appendChild(e);
    } else {
      var shown = expanded ? list : list.slice(0, 6);
      var order = ['置顶', '今天', '昨天', '最近 7 天', '更早'];
      var buckets = {};
      shown.forEach(function (c) {
        var g = c.pin ? '置顶' : groupOf(c);
        (buckets[g] = buckets[g] || []).push(c);
      });
      order.forEach(function (g) {
        if (!buckets[g]) return;
        var h = document.createElement('div');
        h.className = 'grp-sub';
        h.textContent = g;
        sbList.appendChild(h);
        buckets[g].forEach(function (c) { sbList.appendChild(convRow(c)); });
      });
    }

    var rest = list.length - 6;
    if (rest > 0) {
      moreLink.style.display = 'block';
      moreLink.textContent = expanded ? '收起' : '查看更多 (' + rest + ')';
    } else {
      moreLink.style.display = 'none';
    }
  }

  function renderSpaces() {
    spaceList.innerHTML = '';
    var mk = function (label, count, color, active, onClick) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'spc' + (active ? ' on' : '');
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = color;
      dot.style.color = color;
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = count;
      var tx = document.createElement('span');
      tx.className = 'tx';
      tx.textContent = label;
      b.appendChild(dot);
      b.appendChild(tx);
      b.appendChild(n);
      b.addEventListener('click', onClick);
      return b;
    };

    spaceList.appendChild(mk('全部任务', convs.length, '#35e6ff', spaceFilter === null, function () {
      spaceFilter = null;
      renderAll();
    }));

    if (!spaces.length) {
      var e = document.createElement('div');
      e.className = 'sb-empty';
      e.textContent = '点上面的 + 新建空间';
      spaceList.appendChild(e);
      return;
    }

    spaces.forEach(function (s) {
      var cnt = convs.filter(function (c) { return c.spaceId === s.id; }).length;
      var row = mk(s.name, cnt, s.color, spaceFilter === s.id, function () {
        spaceFilter = spaceFilter === s.id ? null : s.id;
        renderAll();
      });
      row.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        openSpaceMenu(s, row);
      });
      spaceList.appendChild(row);
    });
  }

  function renderAll() { renderSidebar(); renderSpaces(); save(); }

  function closeDrawer() { document.body.classList.remove('sb-open'); }

  /* 收起态点需要文字的入口（发现应用/更多）时先展开侧栏 */
  function unfoldSidebar() {
    if (!document.body.classList.contains('collapsed')) return;
    document.body.classList.remove('collapsed');
    save();
  }

  /* ---- 浮层菜单 ---- */
  function closeCtx() { ctxEl.classList.remove('on'); ctxEl.innerHTML = ''; }

  function openCtx(items, x, y, up) {
    ctxEl.innerHTML = '';
    items.forEach(function (it) {
      if (it.sep) { var s = document.createElement('div'); s.className = 'ctx-sep'; ctxEl.appendChild(s); return; }
      if (it.hd) { var h = document.createElement('div'); h.className = 'ctx-hd'; h.textContent = it.hd; ctxEl.appendChild(h); return; }
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ctx-item' + (it.danger ? ' danger' : '') + (it.on ? ' on' : '');
      if (it.icon) b.insertAdjacentHTML('afterbegin', it.icon);
      var sp = document.createElement('span');
      sp.textContent = it.label;
      b.appendChild(sp);
      if (it.k) { var k = document.createElement('em'); k.className = 'k'; k.textContent = it.k; b.appendChild(k); }
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        closeCtx();
        if (it.run) it.run();
      });
      ctxEl.appendChild(b);
    });

    ctxEl.style.left = '0px';
    ctxEl.style.top = '0px';
    ctxEl.classList.add('on');
    var w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
    var left = Math.max(8, Math.min(x, innerWidth - w - 10));
    var top = up ? y - h - 6 : y;
    if (top + h > innerHeight - 10) top = Math.max(10, y - h - 6);
    if (top < 8) top = 8;
    ctxEl.style.left = left + 'px';
    ctxEl.style.top = top + 'px';
  }

  function copyText(s) {
    var fb = function () {
      var tmp = document.createElement('textarea');
      tmp.value = s;
      tmp.style.position = 'fixed';
      tmp.style.left = '-9999px';
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); toast('已复制'); } catch (err) { toast('复制失败'); }
      tmp.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function () { toast('已复制'); }, fb);
    } else {
      fb();
    }
  }

  function openConvMenu(c, anchor) {
    var r = anchor.getBoundingClientRect();
    var items = [
      { icon: ICON.pin, label: c.pin ? '取消置顶' : '置顶任务', run: function () { c.pin = !c.pin; renderAll(); toast(c.pin ? '已置顶' : '已取消置顶'); } },
      { icon: ICON.edit, label: '重命名', run: function () { startRename(c); } },
      { icon: ICON.copy, label: '复制标题', run: function () { copyText(c.title); } },
      { sep: true },
      { hd: '移动到空间' },
      { icon: ICON.folder, label: '不分组', on: !c.spaceId, run: function () { c.spaceId = null; renderAll(); } }
    ];
    spaces.forEach(function (s) {
      items.push({
        icon: ICON.folder, label: s.name, on: c.spaceId === s.id,
        run: function () { c.spaceId = s.id; renderAll(); toast('已移动到「' + s.name + '」'); }
      });
    });
    items.push({ sep: true });
    items.push({ icon: ICON.del, label: '删除任务', danger: true, run: function () { askDeleteConv(c); } });
    openCtx(items, r.left, r.bottom + 6, false);
  }

  function openSpaceMenu(s, anchor) {
    var r = anchor.getBoundingClientRect();
    openCtx([
      { icon: ICON.edit, label: '重命名空间', run: function () { askRenameSpace(s); } },
      { icon: ICON.folder, label: '只看这个空间', run: function () { spaceFilter = s.id; renderAll(); } },
      { sep: true },
      { icon: ICON.del, label: '删除空间', danger: true, run: function () { askDeleteSpace(s); } }
    ], r.left + 8, r.bottom + 6, false);
  }

  /* ---- 自绘弹层（不用 confirm/prompt） ---- */
  var modalMask = document.getElementById('modalMask');
  var modalTitle = document.getElementById('modalTitle');
  var modalDesc = document.getElementById('modalDesc');
  var modalInput = document.getElementById('modalInput');
  var modalOk = document.getElementById('modalOk');
  var modalCancel = document.getElementById('modalCancel');
  var modalCb = null;

  function closeModal() { modalMask.classList.remove('on'); modalCb = null; }

  function ask(opts) {
    modalTitle.textContent = opts.title;
    modalDesc.textContent = opts.desc || '';
    modalDesc.style.display = opts.desc ? 'block' : 'none';
    modalInput.style.display = opts.input ? 'block' : 'none';
    modalInput.value = opts.value || '';
    modalOk.textContent = opts.ok || '确定';
    modalOk.className = 'btn ' + (opts.danger ? 'danger' : 'primary');
    modalCb = opts.onOk || null;
    modalMask.classList.add('on');
    if (opts.input) setTimeout(function () { modalInput.focus(); modalInput.select(); }, 80);
  }

  modalOk.addEventListener('click', function () {
    var cb = modalCb, v = modalInput.value.trim();
    closeModal();
    if (cb) cb(v);
  });
  modalCancel.addEventListener('click', closeModal);
  modalMask.addEventListener('click', function (e) { if (e.target === modalMask) closeModal(); });
  modalInput.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); modalOk.click(); }
  });

  function askDeleteConv(c) {
    ask({
      title: '删除任务',
      desc: '「' + c.title + '」及其对话记录会一并移除，不可恢复。',
      ok: '删除', danger: true,
      onOk: function () {
        convs = convs.filter(function (x) { return x.id !== c.id; });
        if (cur && cur.id === c.id) {
          cur = null;
          thread.innerHTML = '';
          document.body.classList.remove('chatting');
          tbTitle.textContent = '新对话';
        }
        renderAll();
        toast('已删除');
      }
    });
  }

  function askRenameSpace(s) {
    ask({
      title: '重命名空间', desc: '仅影响侧栏显示名称。', input: true, value: s.name, ok: '保存',
      onOk: function (v) {
        if (!v) return;
        s.name = v.slice(0, 20);
        renderAll();
        toast('已重命名');
      }
    });
  }

  function askDeleteSpace(s) {
    var cnt = convs.filter(function (c) { return c.spaceId === s.id; }).length;
    ask({
      title: '删除空间',
      desc: cnt ? '空间下 ' + cnt + ' 个任务会回到「不分组」，任务本身不会被删除。' : '这个空间下还没有任务。',
      ok: '删除', danger: true,
      onOk: function () {
        spaces = spaces.filter(function (x) { return x.id !== s.id; });
        convs.forEach(function (c) { if (c.spaceId === s.id) c.spaceId = null; });
        if (spaceFilter === s.id) spaceFilter = null;
        renderAll();
        toast('已删除空间');
      }
    });
  }

  /* ---- 就地重命名 ---- */
  function startRename(c) {
    var row = sbList.querySelector('[data-id="' + c.id + '"]');
    if (!row) {
      qEl.value = '';
      spaceFilter = null;
      expanded = true;
      renderSidebar();
      row = sbList.querySelector('[data-id="' + c.id + '"]');
    }
    if (!row) return;
    var t = row.querySelector('.conv-t');
    if (!t) return;

    var inp = document.createElement('input');
    inp.className = 'conv-rename';
    inp.value = c.title;
    inp.setAttribute('spellcheck', 'false');
    row.replaceChild(inp, t);
    inp.focus();
    inp.select();

    var done = false;
    var commit = function (ok) {
      if (done) return;
      done = true;
      var v = inp.value.trim();
      if (ok && v && v !== c.title) {
        c.title = v.slice(0, 40);
        if (cur && cur.id === c.id) tbTitle.textContent = c.title;
        save();
        toast('已重命名');
      }
      renderSidebar();
      renderSpaces();
    };
    inp.addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commit(true); }
      else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    });
    inp.addEventListener('blur', function () { commit(true); });
  }

  function openConv(c) {
    cur = c;
    thread.innerHTML = '';
    document.body.classList.add('chatting');
    c.msgs.forEach(function (m) {
      if (m.r === 'u') addUser(m.text);
      else renderBot(m.text, m.tool);
    });
    tbTitle.textContent = c.title;
    renderSidebar();
    renderSpaces();
    save();
    closeDrawer();
    toBottom();
  }

  document.getElementById('collapseBtn').addEventListener('click', function () {
    if (innerWidth <= 900) closeDrawer();
    else { document.body.classList.add('collapsed'); save(); }
  });
  document.getElementById('expandBtn').addEventListener('click', function () {
    if (innerWidth <= 900) document.body.classList.add('sb-open');
    else { document.body.classList.remove('collapsed'); save(); }
  });
  document.getElementById('sbMask').addEventListener('click', closeDrawer);

  function newTask() {
    cur = null;
    document.body.classList.remove('chatting');
    thread.innerHTML = '';
    tbTitle.textContent = '新对话';
    ta.value = ''; grow();
    sendBtn.disabled = true;
    renderAll();
    closeDrawer();
    scrollTo({ top: 0 });
    setTimeout(function () { ta.focus(); }, 320);
  }

  /* 菜单 / 发现应用 / 更多 */
  var LABEL = {
    assistant: '助理',
    experts: '专家 · 技能 · 连接器',
    cron: '定时任务',
    lib: '资料库',
    setting: '设置',
    help: '帮助与反馈'
  };

  function openApps() { appsPanel.classList.add('on'); }
  function closeApps() { appsPanel.classList.remove('on'); }

  document.getElementById('sidebar').addEventListener('click', function (e) {
    var el = e.target.closest('[data-k]');
    if (!el) return;
    var k = el.dataset.k;

    if (k === 'newtask') {
      document.querySelectorAll('.mi').forEach(function (m) { m.classList.remove('on'); });
      el.classList.add('on');
      newTask();
      return;
    }
    if (k === 'discover') {
      unfoldSidebar();
      openApps();
      return;
    }
    if (k === 'more') {
      unfoldSidebar();
      el.classList.toggle('open');
      document.getElementById('moreSub').classList.toggle('open');
      return;
    }
    document.querySelectorAll('.mi').forEach(function (m) { m.classList.remove('on'); });
    el.classList.add('on');
    toast((LABEL[k] || k) + ' · 演示入口，暂无实际页面');
    if (innerWidth <= 900) closeDrawer();
  });

  document.getElementById('appsBack').addEventListener('click', closeApps);

  moreLink.addEventListener('click', function () {
    expanded = !expanded;
    renderSidebar();
    save();
  });

  /* 新建空间 */
  document.getElementById('spaceNew').addEventListener('click', function () {
    ask({
      title: '新建空间', desc: '把任务按项目分组，侧栏可一键切换查看。',
      input: true, value: '', ok: '创建',
      onOk: function (v) {
        if (!v) { toast('名字不能为空'); return; }
        var s = {
          id: uid('s'),
          name: v.slice(0, 20),
          color: SPACE_COLORS[spaces.length % SPACE_COLORS.length]
        };
        spaces.push(s);
        spaceFilter = s.id;
        renderAll();
        toast('已创建「' + s.name + '」');
      }
    });
  });

  /* 底部账户菜单 */
  document.getElementById('userBox').addEventListener('click', function (e) {
    e.stopPropagation();
    var r = this.getBoundingClientRect();
    openCtx([
      { hd: '本地工作区' },
      { icon: ICON.edit, label: '账户与空间', run: function () { toast('演示入口，暂无实际页面'); } },
      { icon: ICON.copy, label: '复制工作区标识', k: 'LOCAL', run: function () { copyText('local-workspace'); } },
      { sep: true },
      { label: '偏好设置', run: function () { toast('设置 · 演示入口，暂无实际页面'); } },
      { label: '检查更新', k: 'v2.0.0', run: function () { toast('已是最新版本 v2.0.0'); } },
      { sep: true },
      {
        label: '恢复初始数据', danger: true,
        run: function () {
          ask({
            title: '恢复初始数据',
            desc: '任务、空间与置顶状态会重置为演示数据，刷新后生效。',
            ok: '恢复', danger: true,
            onOk: function () {
              try { localStorage.removeItem(LS); } catch (err) {}
              location.reload();
            }
          });
        }
      }
    ], r.left, r.top, true);
  });

  /* 搜索 */
  qEl.addEventListener('input', function () {
    if (qEl.value.trim()) expanded = true;
    renderSidebar();
  });
  qEl.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Escape') { qEl.value = ''; renderSidebar(); qEl.blur(); }
    if (e.key === 'Enter') { var first = visible()[0]; if (first) openConv(first); }
  });

  /* 发现应用面板 */
  var APP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9h6v6H9z"/></svg>';
  var APPS = [
    ['智能搜索', '联网检索 · 引用来源'],
    ['数据分析', '表格 · 图表 · 结论'],
    ['文档起草', '方案 · 周报 · 邮件'],
    ['代码执行', '本地脚本 · 沙箱运行'],
    ['定时任务', 'cron 与周期提醒'],
    ['知识库', '资料入库与检索'],
    ['文件处理', '解析 · 转换 · 归档'],
    ['行情监视', 'K 线 · 异动提醒']
  ];
  (function renderApps() {
    var grid = document.getElementById('appsGrid');
    APPS.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'app-card';
      b.innerHTML = '<span class="ic">' + APP_ICON + '</span>';
      var nm = document.createElement('b');
      nm.textContent = a[0];
      var ds = document.createElement('i');
      ds.textContent = a[1];
      b.appendChild(nm);
      b.appendChild(ds);
      b.addEventListener('click', function () {
        closeApps();
        toast(a[0] + ' · 演示入口');
      });
      grid.appendChild(b);
    });
  })();

  /* 快捷键 */
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      document.body.classList.remove('collapsed');
      qEl.focus();
      qEl.select();
      return;
    }
    if (e.key === 'Escape') {
      if (modalMask.classList.contains('on')) { closeModal(); return; }
      if (ctxEl.classList.contains('on')) { closeCtx(); return; }
      if (appsPanel.classList.contains('on')) { closeApps(); return; }
    }
  });
  document.addEventListener('click', function () { closeCtx(); });

  /* 初始化 */
  renderSpaces();
  renderSidebar();
  if (st.collapsed && innerWidth > 900) document.body.classList.add('collapsed');
  if (st.curId) {
    var found = convs.filter(function (c) { return c.id === st.curId; })[0];
    if (found) openConv(found);
  }

  /* ================= 消息渲染 ================= */
  function toBottom() {
    setTimeout(function () {
      scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }, 60);
  }

  function addUser(text) {
    var d = document.createElement('div');
    d.className = 'msg user';
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    d.appendChild(b);
    thread.appendChild(d);
  }

  function makeBot() {
    var d = document.createElement('div');
    d.className = 'msg bot';
    var a = document.createElement('div');
    a.className = 'ava';
    var b = document.createElement('div');
    b.className = 'bubble';
    d.appendChild(a); d.appendChild(b);
    thread.appendChild(d);
    return b;
  }

  function think(bubble) {
    bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  }

  function toolTag(tool) {
    var t = document.createElement('div');
    t.className = 'toolcall';
    t.innerHTML = '<b></b><span></span>';
    t.querySelector('b').textContent = tool.name;
    t.querySelector('span').textContent = tool.ms + 'ms';
    return t;
  }

  function typeOut(bubble, text, tool) {
    bubble.innerHTML = '';
    if (tool) bubble.appendChild(toolTag(tool));
    var span = document.createElement('span');
    var caret = document.createElement('span');
    caret.className = 'caret';
    bubble.appendChild(span);
    bubble.appendChild(caret);

    var i = 0;
    (function step() {
      if (i >= text.length) { caret.remove(); return; }
      var n = Math.min(2, text.length - i);
      span.textContent += text.slice(i, i + n);
      i += n;
      toBottom();
      setTimeout(step, 16 + Math.random() * 14);
    })();
  }

  function renderBot(text, tool) {
    var bubble = makeBot();
    if (tool) bubble.appendChild(toolTag(tool));
    var span = document.createElement('span');
    span.textContent = text;
    bubble.appendChild(span);
  }

  /* ================= 模拟回复 ================= */
  function pickReply(text) {
    var t = text.toLowerCase();
    if (/你好|hi|hello|在吗|嗨/.test(t)) {
      return { tool: null, text: '在。直接把要做的事说给我，我来拆步骤。' };
    }
    if (/能做什么|你是谁|介绍|功能/.test(t)) {
      return {
        tool: { name: 'capability.scan', ms: 12 },
        text: '简单说：你给目标，我给结果。\n\n· 自主规划：把模糊目标拆成可执行步骤\n· 工具编排：按需调用搜索、文件、脚本执行\n· 长程记忆：跨会话记住你的偏好和上下文\n· 多 Agent：复杂任务分工并行再汇总\n\n想试哪一项？'
      };
    }
    if (/行情|股票|日报|数据|表格|分析/.test(t)) {
      return {
        tool: { name: 'data.fetch', ms: 218 },
        text: '这类任务我一般这么跑：\n\n1. 拉取区间数据（K线 / 成交额 / 异动标记）\n2. 计算指标与偏离度\n3. 生成图表 + 一段人话结论\n4. 投递到你指定的地方\n\n当前是演示模式，接入数据源后就能真跑。'
      };
    }
    if (/写|代码|脚本|函数|程序/.test(t)) {
      return {
        tool: { name: 'code.draft', ms: 341 },
        text: '可以。给我这些信息我就能直接写：\n\n· 输入长什么样（样例最好）\n· 期望输出什么\n· 跑在哪儿（本地 / 服务器 / 定时任务）\n\n不确定的地方我先按最稳妥的默认来，写完再跟你确认。'
      };
    }
    return {
      tool: { name: 'plan.resolve', ms: 96 },
      text: '收到。我的推进方式是：先确认目标和边界，再拆成可执行步骤，逐步调用工具，最后把结果整理成你要的形态交给你。\n\n（当前是演示模式，还没有接入模型服务，所以这句是本地模拟的回复。）'
    };
  }

  var busy = false;

  function send() {
    var text = ta.value.trim();
    if (!text || busy) return;
    busy = true;

    if (!cur) {
      cur = {
        id: uid('c'),
        title: text.length > 18 ? text.slice(0, 18) + '…' : text,
        ts: Date.now(),
        msgs: [],
        pin: false,
        spaceId: spaceFilter
      };
      convs.unshift(cur);
      tbTitle.textContent = cur.title;
      renderAll();
    }

    document.body.classList.add('chatting');
    addUser(text);
    cur.msgs.push({ r: 'u', text: text });

    ta.value = ''; grow();
    sendBtn.disabled = true;

    composer.classList.add('pulse');
    setTimeout(function () { composer.classList.remove('pulse'); }, 520);

    toBottom();

    var bubble = makeBot();
    think(bubble);
    toBottom();

    var r = pickReply(text);
    setTimeout(function () {
      cur.msgs.push({ r: 'b', text: r.text, tool: r.tool });
      typeOut(bubble, r.text, r.tool);
      busy = false;
    }, 620);
  }

  /* ================= 底部状态栏 ================= */
  var stPop = document.getElementById('stPop');
  var stBell = document.getElementById('stBell');
  var stDev = document.getElementById('stDev');
  var stBadge = document.getElementById('stBadge');
  var stOpen = null;

  var NOTIS = [
    { t: '任务「行情日报」已完成', d: '3 分钟前 · 产出 1 份日报', read: false },
    { t: '定时任务 15:00 即将执行', d: '1 小时前 · 收盘前买入提醒', read: false },
    { t: '桌面端已同步会话', d: '昨天 · AGENT v2.0.0', read: true }
  ];

  function unread() {
    return NOTIS.filter(function (n) { return !n.read; }).length;
  }

  function paintBadge() {
    stBadge.classList.toggle('on', unread() > 0);
  }

  function notiHtml() {
    var h = '<div class="st-pop-hd"><span>通知 · ' + unread() + ' 条未读</span><button type="button" data-act="readall">全部已读</button></div>';
    NOTIS.forEach(function (n, i) {
      h += '<div class="st-item' + (n.read ? ' read' : '') + '" data-n="' + i + '">' +
        '<i></i><div><b>' + n.t + '</b><span>' + n.d + '</span></div></div>';
    });
    return h;
  }

  function devHtml() {
    return '<div class="st-pop-hd"><span>设备 · 2 台</span><button type="button" data-act="pair">配对新设备</button></div>' +
      '<div class="st-item" data-act="dev"><i></i><div><b>本机 · Windows</b><span>在线 · 当前设备</span></div></div>' +
      '<div class="st-item read" data-act="dev"><i></i><div><b>手机 · iOS</b><span>未连接 · 扫码配对</span></div></div>';
  }

  function closeStPop() {
    stPop.classList.remove('on');
    stBell.classList.remove('on');
    stDev.classList.remove('on');
    stOpen = null;
  }

  function openStPop(kind) {
    if (stOpen === kind) { closeStPop(); return; }
    stPop.innerHTML = kind === 'noti' ? notiHtml() : devHtml();
    stPop.classList.add('on');
    stBell.classList.toggle('on', kind === 'noti');
    stDev.classList.toggle('on', kind === 'dev');
    stOpen = kind;
  }

  stBell.addEventListener('click', function (e) {
    e.stopPropagation();
    openStPop('noti');
  });

  stDev.addEventListener('click', function (e) {
    e.stopPropagation();
    openStPop('dev');
  });

  stPop.addEventListener('click', function (e) {
    e.stopPropagation();
    var all = e.target.closest('[data-act="readall"]');
    if (all) {
      NOTIS.forEach(function (n) { n.read = true; });
      stPop.innerHTML = notiHtml();
      paintBadge();
      toast('已全部标记为已读');
      return;
    }
    if (e.target.closest('[data-act="pair"]')) { toast('扫码配对 · 演示入口'); return; }
    var row = e.target.closest('.st-item');
    if (!row) return;
    if (row.hasAttribute('data-n')) {
      var n = NOTIS[+row.getAttribute('data-n')];
      n.read = true;
      stPop.innerHTML = notiHtml();
      paintBadge();
      toast(n.t);
      return;
    }
    closeStPop();
    toast(row.textContent.split('·')[0].trim() + ' · 演示入口');
  });

  document.getElementById('stLogo').addEventListener('click', function () {
    toast('Runtime 就绪 · AGENT v2.0.0');
  });
  document.getElementById('stAva').addEventListener('click', function () {
    toast('本地工作区 · FREE PLAN');
  });

  document.addEventListener('click', function () { if (stOpen) closeStPop(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stOpen) closeStPop();
  });

  paintBadge();

  renderSidebar();
})();
</script>
</body>
</html>
