<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGENT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg:#05070c;
    --cyan:#35e6ff;
    --violet:#7c5cff;
    --pink:#ff3ea5;
    --txt:#e8eefc;
    --dim:#8194b8;
    --glass:rgba(14,20,33,.68);
    --sbw:278px;
  }
  body.collapsed{--sbw:76px}

  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* ============ 背景层 ============ */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(58% 40% at 50% -6%, rgba(53,230,255,.16), transparent 70%),
      radial-gradient(40% 36% at 90% 12%, rgba(124,92,255,.20), transparent 72%),
      radial-gradient(44% 40% at 4% 70%, rgba(255,62,165,.09), transparent 72%);
  }
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
  .grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(120,160,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,160,255,.05) 1px, transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(ellipse 76% 60% at 50% 24%, #000 16%, transparent 74%);
    mask-image:radial-gradient(ellipse 76% 60% at 50% 24%, #000 16%, transparent 74%);
  }
  .cursor-glow{
    position:fixed;left:0;top:0;width:700px;height:700px;margin:-350px 0 0 -350px;
    z-index:1;pointer-events:none;will-change:transform;opacity:0;transition:opacity .5s;
    background:radial-gradient(circle, rgba(53,230,255,.075), rgba(124,92,255,.045) 40%, transparent 62%);
  }
  .beam{
    position:fixed;top:0;width:1px;height:100%;z-index:1;pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(53,230,255,.30), transparent);
    opacity:.5;
  }
  .beam.l{left:12%}
  .beam.r{right:12%}
  .top-glow{
    position:fixed;top:-520px;left:50%;transform:translateX(-50%);
    width:1000px;height:520px;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(50% 50%, rgba(53,230,255,.22), transparent 70%);
    filter:blur(30px);
  }

  /* ============ 顶栏 ============ */
  .topbar{
    position:fixed;top:0;left:var(--sbw);right:0;z-index:40;height:62px;
    transition:left .45s cubic-bezier(.6,0,.3,1), padding-left .45s;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;gap:16px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    background:linear-gradient(to bottom, rgba(5,7,12,.72), transparent);
  }
  .tb-title{font-size:13px;color:#7e91b6;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.16em}
  .brand-tx{display:flex;flex-direction:column;line-height:1.15;letter-spacing:.14em}
  .brand-tx b{font-size:12.5px}
  .brand-tx i{font-style:normal;font-size:9.5px;color:#4d5c78;letter-spacing:.08em}
  .logo-mark{
    width:24px;height:24px;border-radius:7px;position:relative;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 0 16px rgba(53,230,255,.55);
  }
  .logo-mark::after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--bg)}
  .logo-mark::before{
    content:"";position:absolute;inset:9px;border-radius:50%;
    background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 8px var(--cyan);
  }
  .top-right{display:flex;align-items:center;gap:12px}
  .status{
    display:flex;align-items:center;gap:7px;font-size:12px;color:#7f92b6;
    padding:5px 12px;border-radius:100px;border:1px solid rgba(120,160,255,.14);
    background:rgba(255,255,255,.02);
  }
  .status i{
    width:5px;height:5px;border-radius:50%;background:#35e6ff;
    box-shadow:0 0 8px #35e6ff;animation:breath 2s ease-in-out infinite;
  }
  @keyframes breath{0%,100%{opacity:1}50%{opacity:.25}}
  .ghost-btn{
    font:inherit;font-size:12.5px;color:#a9bcdd;cursor:pointer;
    padding:7px 15px;border-radius:8px;background:rgba(255,255,255,.03);
    border:1px solid rgba(120,160,255,.16);transition:.25s;
  }
  .ghost-btn:hover{color:#fff;background:rgba(120,160,255,.12);border-color:rgba(120,160,255,.36)}

  /* ============ 侧边栏 ============ */
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:var(--sbw);z-index:60;
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg, rgba(11,16,26,.94), rgba(6,9,15,.98));
    border-right:1px solid rgba(120,160,255,.10);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    transition:width .45s cubic-bezier(.6,0,.3,1), transform .45s cubic-bezier(.6,0,.3,1);
  }
  .sidebar::after{
    content:"";position:absolute;top:0;right:0;width:1px;height:100%;pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(53,230,255,.45), rgba(124,92,255,.35), transparent);
    opacity:.5;
  }
  .sb-top{
    display:flex;align-items:center;justify-content:space-between;
    height:62px;padding:0 12px 0 18px;flex:0 0 auto;
  }
  .icon-btn{
    width:28px;height:28px;border-radius:8px;border:1px solid transparent;flex:0 0 auto;
    background:transparent;color:#7386a8;cursor:pointer;display:grid;place-items:center;
    transition:.25s;font:inherit;
  }
  .icon-btn:hover{color:#dce9ff;background:rgba(120,160,255,.12);border-color:rgba(120,160,255,.18)}

  /* 发现应用 */
  .discover{
    display:flex;align-items:center;gap:7px;margin:0 12px 10px;
    padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;
    font:inherit;font-size:12.5px;color:#a8bde0;
    background:rgba(255,255,255,.025);border:1px solid rgba(120,160,255,.14);transition:.25s;
  }
  .discover:hover{color:#fff;border-color:rgba(53,230,255,.4);background:rgba(53,230,255,.07)}
  .discover svg{flex:0 0 auto}
  .discover .grow{flex:1;text-align:left}

  /* 快捷菜单 */
  .menu{padding:0 10px 4px;display:flex;flex-direction:column;gap:1px}
  .mi{
    display:flex;align-items:center;gap:10px;width:100%;white-space:nowrap;
    padding:8px 10px;border-radius:8px;border:1px solid transparent;
    font:inherit;font-size:13px;color:#8ea1c2;text-align:left;cursor:pointer;
    background:transparent;transition:.2s;
  }
  .mi:hover{color:#dbe8ff;background:rgba(120,160,255,.07)}
  .mi.on{color:#eaf3ff;background:rgba(53,230,255,.09);border-color:rgba(53,230,255,.22)}
  .mi svg{flex:0 0 auto;opacity:.7}
  .mi.on svg{opacity:1;color:var(--cyan)}
  .mi .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
  .tag{
    font-size:9.5px;letter-spacing:.06em;font-style:normal;color:#9a83ff;
    padding:1px 6px;border-radius:5px;border:1px solid rgba(124,92,255,.42);
    background:rgba(124,92,255,.14);
  }
  .chev{transition:transform .3s;opacity:.5}
  .mi.open .chev{transform:rotate(180deg)}
  .sub{display:none}
  .sub.open{display:block}

  .sb-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding-bottom:14px}
  .sb-scroll::-webkit-scrollbar{width:6px}
  .sb-scroll::-webkit-scrollbar-thumb{background:rgba(120,160,255,.16);border-radius:3px}
  .sb-scroll::-webkit-scrollbar-thumb:hover{background:rgba(120,160,255,.32)}

  .grp{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px 7px;font-size:12px;color:#6b7d9c;white-space:nowrap;
  }
  .grp span{color:#42506a;font-size:11px;letter-spacing:.04em}

  .sb-list{padding:0 10px}

  .conv{
    position:relative;display:flex;align-items:center;gap:9px;width:100%;
    padding:9px 12px;margin-bottom:3px;border-radius:9px;cursor:pointer;white-space:nowrap;
    font:inherit;font-size:13px;text-align:left;color:#8ea1c2;overflow:hidden;
    background:transparent;border:1px solid transparent;transition:.22s;
  }
  .conv:hover{color:#dbe8ff;background:rgba(120,160,255,.07)}
  .conv.on{
    color:#eef5ff;border-color:rgba(53,230,255,.22);
    background:linear-gradient(90deg, rgba(53,230,255,.14), rgba(124,92,255,.07));
  }
  .conv.on::before{
    content:"";position:absolute;left:0;top:22%;bottom:22%;width:2px;border-radius:2px;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);
  }
  .conv svg{flex:0 0 auto;opacity:.5}
  .conv.on svg{opacity:1;color:var(--cyan)}
  .conv-t{flex:1;overflow:hidden;text-overflow:ellipsis}
  .conv-d{font-size:10.5px;color:#43506a;flex:0 0 auto;letter-spacing:.02em}
  .conv.on .conv-d{color:#6d86ab}

  .more-link{
    display:block;width:calc(100% - 20px);margin:1px 10px 0;padding:7px 12px;text-align:left;
    border:0;border-radius:8px;background:transparent;cursor:pointer;
    font:inherit;font-size:12px;color:#5f7396;transition:.22s;
  }
  .more-link:hover{color:#a8c2e8;background:rgba(120,160,255,.06)}

  .toast{
    position:fixed;left:50%;bottom:150px;z-index:99;pointer-events:none;
    transform:translate(-50%,14px);opacity:0;transition:opacity .3s, transform .3s;
    padding:9px 17px;border-radius:10px;font-size:12.5px;color:#cfe3ff;white-space:nowrap;
    background:rgba(16,24,40,.95);border:1px solid rgba(53,230,255,.32);
    box-shadow:0 16px 44px -20px rgba(53,230,255,.9);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .sb-empty{padding:10px 12px;font-size:12px;color:#465469;line-height:1.8}

  /* ===== 侧栏增强：搜索 / 分组 / 行操作 / 空间 ===== */
  .sb-search{
    display:flex;align-items:center;gap:8px;height:33px;margin:0 12px 9px;padding:0 10px;
    border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(120,160,255,.12);
    transition:.25s;
  }
  .sb-search:focus-within{
    border-color:rgba(53,230,255,.42);background:rgba(53,230,255,.06);
    box-shadow:0 0 0 3px rgba(53,230,255,.06);
  }
  .sb-search svg{flex:0 0 auto;color:#5b6d8c}
  .sb-search input{
    flex:1;min-width:0;border:0;background:transparent;outline:none;
    font:inherit;font-size:12.5px;color:#dbe8ff;
  }
  .sb-search input::placeholder{color:#4b5a75}
  .sb-search .kbd{
    font-size:9.5px;letter-spacing:.06em;color:#3f4d67;padding:2px 5px;border-radius:4px;
    border:1px solid rgba(120,160,255,.14);flex:0 0 auto;
  }

  .grp em{font-style:normal;flex:1}
  .grp-add{
    width:20px;height:20px;border-radius:6px;border:0;background:transparent;cursor:pointer;
    display:grid;place-items:center;color:#5f7396;transition:.2s;font:inherit;
  }
  .grp-add:hover{color:#cfe7ff;background:rgba(120,160,255,.14)}
  .grp-sub{
    padding:10px 20px 4px;font-size:10px;letter-spacing:.12em;color:#3d4a62;white-space:nowrap;
  }

  .conv .conv-pin{flex:0 0 auto;color:var(--cyan);opacity:.9;display:grid;place-items:center}
  .conv-d{transition:opacity .18s}
  .conv:hover .conv-d{opacity:0}
  .conv-more{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:21px;height:21px;border-radius:6px;border:0;background:transparent;cursor:pointer;
    display:grid;place-items:center;color:#5f7396;opacity:0;pointer-events:none;transition:.18s;
  }
  .conv:hover .conv-more{opacity:1;pointer-events:auto}
  .conv-more:hover{color:#dcecff;background:rgba(120,160,255,.18)}
  .conv-rename{
    flex:1;min-width:0;padding:1px 4px;border:0;border-bottom:1px solid rgba(53,230,255,.5);
    border-radius:3px;outline:none;font:inherit;font-size:13px;color:#eef5ff;
    background:rgba(53,230,255,.10);
  }

  .spc{
    display:flex;align-items:center;gap:9px;width:100%;margin-bottom:2px;padding:8px 12px;
    border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;
    font:inherit;font-size:12.8px;color:#8ea1c2;text-align:left;white-space:nowrap;transition:.2s;
  }
  .spc:hover{color:#dbe8ff;background:rgba(120,160,255,.07)}
  .spc.on{color:#eaf3ff;border-color:rgba(124,92,255,.28);background:rgba(124,92,255,.12)}
  .spc .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
  .spc .n{margin-left:auto;font-size:10.5px;color:#4d5b74}

  /* 浮层菜单 */
  .ctx{
    position:fixed;left:0;top:0;z-index:200;min-width:186px;padding:6px;border-radius:12px;
    background:rgba(12,18,30,.98);border:1px solid rgba(120,160,255,.20);
    box-shadow:0 24px 60px -24px #000, 0 0 0 1px rgba(0,0,0,.35);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transition:.18s;
  }
  .ctx.on{opacity:1;pointer-events:auto;transform:none}
  .ctx-item{
    display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;
    border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap;
    font:inherit;font-size:12.8px;color:#a9bcdd;text-align:left;transition:.16s;
  }
  .ctx-item:hover{color:#fff;background:rgba(120,160,255,.12)}
  .ctx-item.on{color:#8ff2ff;background:rgba(53,230,255,.10);border-color:rgba(53,230,255,.18)}
  .ctx-item.danger{color:#ff8aa8}
  .ctx-item.danger:hover{background:rgba(255,62,165,.14)}
  .ctx-item svg{flex:0 0 auto;opacity:.75}
  .ctx-item .k{margin-left:auto;font-size:10.5px;font-style:normal;color:#4a5872}
  .ctx-sep{height:1px;margin:5px 6px;background:rgba(120,160,255,.12)}
  .ctx-hd{padding:5px 10px 3px;font-size:10px;letter-spacing:.1em;color:#48566f}

  /* 弹层 */
  .modal-mask{
    position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;
    background:rgba(3,5,10,.68);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:.25s;
  }
  .modal-mask.on{opacity:1;pointer-events:auto}
  .modal{
    width:min(382px,100%);padding:20px;border-radius:16px;
    background:linear-gradient(160deg,rgba(15,22,36,.99),rgba(8,12,20,.99));
    border:1px solid rgba(120,160,255,.22);box-shadow:0 40px 90px -40px #000;
    transform:translateY(10px) scale(.97);transition:.28s;
  }
  .modal-mask.on .modal{transform:none}
  .modal h3{font-size:14px;font-weight:600;color:#eaf3ff}
  .modal p{margin-top:8px;font-size:12.5px;line-height:1.7;color:#8194b8}
  .modal input{
    width:100%;height:36px;margin-top:14px;padding:0 12px;border-radius:9px;outline:none;
    font:inherit;font-size:13px;color:#eaf3ff;background:rgba(255,255,255,.04);
    border:1px solid rgba(120,160,255,.20);
  }
  .modal input:focus{border-color:rgba(53,230,255,.5)}
  .modal-foot{margin-top:18px;display:flex;justify-content:flex-end;gap:9px}
  .btn{
    padding:8px 16px;border-radius:9px;cursor:pointer;font:inherit;font-size:12.5px;
    color:#a9bcdd;background:rgba(255,255,255,.03);border:1px solid rgba(120,160,255,.20);
    transition:.2s;
  }
  .btn:hover{color:#fff;background:rgba(120,160,255,.12)}
  .btn.primary{
    font-weight:700;color:#04070d;border-color:transparent;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 10px 26px -12px rgba(53,230,255,.9);
  }
  .btn.danger{color:#ffd9e3;border-color:rgba(255,62,165,.35);background:rgba(255,62,165,.12)}

  /* 发现应用面板 */
  .apps-panel{
    position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(11,16,26,.99),rgba(6,9,15,1));
    transform:translateX(100%);transition:transform .38s cubic-bezier(.6,0,.3,1);
  }
  .apps-panel.on{transform:none}
  .apps-hd{
    display:flex;align-items:center;gap:10px;height:62px;padding:0 12px 0 14px;flex:0 0 auto;
    border-bottom:1px solid rgba(120,160,255,.08);
  }
  .apps-hd b{font-size:13px;letter-spacing:.04em}
  .apps-hd span{margin-left:auto;font-size:10px;letter-spacing:.1em;color:#4d5b74}
  .apps-body{flex:1;overflow-y:auto;padding:12px}
  .apps-body::-webkit-scrollbar{width:6px}
  .apps-body::-webkit-scrollbar-thumb{background:rgba(120,160,255,.16);border-radius:3px}
  .apps-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .app-card{
    display:flex;flex-direction:column;gap:5px;padding:12px 11px;border-radius:11px;cursor:pointer;
    font:inherit;text-align:left;color:#c9d9f2;background:rgba(255,255,255,.03);
    border:1px solid rgba(120,160,255,.12);transition:.22s;
  }
  .app-card:hover{border-color:rgba(53,230,255,.4);background:rgba(53,230,255,.08);transform:translateY(-1px)}
  .app-card .ic{
    width:26px;height:26px;border-radius:8px;margin-bottom:2px;display:grid;place-items:center;
    background:rgba(124,92,255,.16);color:#b9a6ff;
  }
  .app-card b{font-size:12.5px;font-weight:600}
  .app-card i{font-style:normal;font-size:10.5px;line-height:1.5;color:#5b6d8c}

  .sb-foot{
    flex:0 0 auto;padding:12px;border-top:1px solid rgba(120,160,255,.08);
    display:flex;align-items:center;gap:8px;
  }
  .user{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px 8px;border-radius:9px;transition:.22s;cursor:pointer}
  .user:hover{background:rgba(120,160,255,.07)}
  .u-ava{
    width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:12px;font-weight:700;color:#04060c;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 0 14px rgba(53,230,255,.45);
  }
  .u-meta{min-width:0;flex:1;white-space:nowrap;overflow:hidden}
  .u-name{font-size:12.8px;color:#cddcf5;overflow:hidden;text-overflow:ellipsis}
  .u-plan{font-size:10.5px;color:#4a5872;letter-spacing:.08em}

  .expand-btn{
    position:fixed;top:14px;left:14px;z-index:65;width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;cursor:pointer;color:#a9c4ec;
    background:rgba(14,20,33,.82);border:1px solid rgba(120,160,255,.20);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    opacity:0;pointer-events:none;transform:translateX(-6px);transition:.3s;
  }
  .expand-btn:hover{color:#fff;border-color:rgba(53,230,255,.5);box-shadow:0 0 20px -6px rgba(53,230,255,.8)}

  /* ===== 收起态：图标轨道 ===== */
  body.collapsed .sb-top{
    height:auto;padding:12px 0;flex-direction:column;gap:9px;justify-content:center;
  }
  body.collapsed .brand-tx{display:none}
  body.collapsed .sb-top .icon-btn svg{transform:rotate(180deg)}
  body.collapsed .sb-search,
  body.collapsed .grp,
  body.collapsed .sb-list,
  body.collapsed .more-link,
  body.collapsed .u-meta,
  body.collapsed .sb-foot>.icon-btn,
  body.collapsed .mi .lbl,
  body.collapsed .mi .tag,
  body.collapsed .mi .chev,
  body.collapsed .sub{display:none}
  body.collapsed .discover{margin:0 12px 8px;justify-content:center;padding:9px 0}
  body.collapsed .discover .grow,
  body.collapsed .discover>svg:last-child{display:none}
  body.collapsed .menu{padding:0 12px 4px}
  body.collapsed .mi{justify-content:center;gap:0;padding:10px 0}
  body.collapsed .mi svg{opacity:.85}
  body.collapsed .sb-foot{justify-content:center;padding:12px 0}
  body.collapsed .user{flex:0 0 auto;padding:0}

  .sb-mask{
    position:fixed;inset:0;z-index:55;background:rgba(3,5,10,.62);
    backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s;
  }

  main{padding-left:var(--sbw);transition:padding-left .45s cubic-bezier(.6,0,.3,1)}

  /* ============ Hero ============ */
  .hero{
    position:fixed;inset:0 0 0 var(--sbw);z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 24px 300px;text-align:center;pointer-events:none;
    transition:opacity .55s ease, transform .55s ease;
  }
  .hero > *{pointer-events:auto}
  body.chatting .hero{opacity:0;transform:translateY(-40px);pointer-events:none}
  body.chatting .hero > *{pointer-events:none}

  .hero-badge{
    display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;
    color:#9fd6ff;padding:6px 14px;border-radius:100px;
    border:1px solid rgba(53,230,255,.22);background:rgba(53,230,255,.05);
    box-shadow:0 0 34px rgba(53,230,255,.10) inset;
  }
  .hero h1{
    margin-top:24px;font-size:clamp(1.85rem,4.6vw,3.3rem);
    font-weight:800;letter-spacing:-.02em;line-height:1.24;
  }
  .grad{
    background:linear-gradient(100deg,#35e6ff,#7c5cff 44%,#ff3ea5 80%,#35e6ff);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(90,140,255,.42));animation:flow 7s linear infinite;
  }
  @keyframes flow{to{background-position:220% 0}}
  .hero p{margin-top:16px;font-size:14.5px;color:var(--dim);max-width:520px}

  /* ============ 输入框 ============ */
  .dock{
    position:fixed;left:calc(50% + var(--sbw) / 2);bottom:62px;z-index:30;
    width:min(780px,calc(100vw - 36px));
    transform:translate(-50%, calc(-50vh + 210px));
    transition:transform .68s cubic-bezier(.62,0,.32,1);
  }
  body.chatting .dock{transform:translate(-50%, 0)}

  .composer{
    position:relative;border-radius:18px;padding:2px;
    background:linear-gradient(140deg, rgba(120,160,255,.30), rgba(120,160,255,.06) 45%, rgba(53,230,255,.22));
    box-shadow:0 26px 70px -34px rgba(0,0,0,.95), 0 0 50px -22px rgba(53,230,255,.35);
    transition:box-shadow .4s, transform .4s;
  }
  .composer::after{ /* 聚焦光晕 */
    content:"";position:absolute;inset:-2px;border-radius:20px;z-index:-1;
    background:radial-gradient(60% 100% at 50% 50%, rgba(53,230,255,.35), transparent 70%);
    opacity:0;transition:opacity .45s;filter:blur(12px);
  }
  .composer.focus{box-shadow:0 26px 80px -30px rgba(0,0,0,.95), 0 0 70px -16px rgba(53,230,255,.55)}
  .composer.focus::after{opacity:1}
  .composer.pulse{animation:flash .5s ease}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(53,230,255,.55)}
    100%{box-shadow:0 0 0 16px rgba(53,230,255,0)}
  }

  .composer-in{
    background:rgba(9,13,22,.92);border-radius:16px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }

  textarea{
    display:block;width:100%;resize:none;border:0;outline:0;background:transparent;
    color:var(--txt);font-family:inherit;font-size:15px;line-height:1.6;
    padding:16px 18px 4px;max-height:200px;overflow-y:auto;
  }
  textarea::placeholder{color:#5c6d8f}

  .composer-foot{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 10px 10px 12px;
  }
  .tools{display:flex;gap:7px;align-items:center}
  .tool-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;color:#8fa3c6;padding:5px 11px;border-radius:100px;
    border:1px solid rgba(120,160,255,.14);background:rgba(255,255,255,.02);
    cursor:default;transition:.25s;
  }
  .tool-pill:hover{color:#cfe2ff;border-color:rgba(120,160,255,.32)}
  .tool-pill svg{opacity:.75}

  .send{
    width:38px;height:38px;border-radius:11px;border:0;cursor:pointer;
    display:grid;place-items:center;color:#04060c;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 4px 20px rgba(53,230,255,.35);
    transition:transform .2s, box-shadow .3s, filter .3s, opacity .3s;
  }
  .send:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 8px 28px rgba(53,230,255,.55)}
  .send:active{transform:scale(.94)}
  .send:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}

  /* 提示词 chips */
  .chips{
    position:absolute;left:0;right:0;top:100%;margin-top:14px;
    display:flex;gap:9px;justify-content:center;flex-wrap:wrap;
    transition:opacity .4s, transform .4s;
  }
  body.chatting .chips{opacity:0;transform:translateY(8px);pointer-events:none}
  .chip{
    font:inherit;font-size:12.5px;color:#93a7cb;cursor:pointer;
    padding:8px 14px;border-radius:100px;
    border:1px solid rgba(120,160,255,.14);background:rgba(255,255,255,.022);
    backdrop-filter:blur(8px);transition:.28s;
  }
  .chip:hover{
    color:#eaf3ff;border-color:rgba(53,230,255,.42);
    background:rgba(53,230,255,.08);transform:translateY(-2px);
    box-shadow:0 8px 22px -12px rgba(53,230,255,.8);
  }

  /* ============ 对话流 ============ */
  .thread{
    position:relative;z-index:10;
    max-width:820px;margin:0 auto;padding:104px 22px 240px;
    opacity:0;pointer-events:none;transition:opacity .5s .2s;
  }
  body.chatting .thread{opacity:1;pointer-events:auto}

  .msg{display:flex;gap:13px;margin-bottom:24px}
  .msg.user{justify-content:flex-end}
  .msg .ava{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;margin-top:2px;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 0 16px rgba(53,230,255,.45);position:relative;
  }
  .msg .ava::after{
    content:"";position:absolute;inset:9px;border-radius:3px;background:rgba(5,7,12,.85);
  }
  .bubble{
    max-width:min(86%,640px);padding:13px 17px;border-radius:16px;
    font-size:14.6px;line-height:1.78;white-space:pre-wrap;word-break:break-word;
    animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .msg.user .bubble{
    background:linear-gradient(135deg, rgba(53,230,255,.15), rgba(124,92,255,.22));
    border:1px solid rgba(120,160,255,.26);color:#eef5ff;
    border-bottom-right-radius:5px;
    box-shadow:0 14px 40px -26px rgba(53,230,255,.8);
  }
  .msg.bot .bubble{
    background:rgba(14,20,33,.78);border:1px solid rgba(120,160,255,.11);
    color:#dae5f8;border-bottom-left-radius:5px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }

  .toolcall{
    display:inline-flex;align-items:center;gap:8px;margin-bottom:9px;
    font-family:Consolas,"Cascadia Code",monospace;font-size:11.5px;color:#8fb8e0;
    padding:5px 11px;border-radius:8px;
    background:rgba(53,230,255,.06);border:1px solid rgba(53,230,255,.18);
  }
  .toolcall b{color:#cfeaff;font-weight:500}
  .toolcall span{color:#5d7597;margin-left:2px}

  .dots{display:inline-flex;gap:5px;align-items:center;height:22px}
  .dots i{
    width:6px;height:6px;border-radius:50%;background:var(--cyan);
    animation:jump 1.15s infinite ease-in-out;
  }
  .dots i:nth-child(2){animation-delay:.16s;opacity:.8}
  .dots i:nth-child(3){animation-delay:.32s;opacity:.6}
  @keyframes jump{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

  .caret{
    display:inline-block;width:7px;height:14px;vertical-align:-2px;
    background:var(--cyan);box-shadow:0 0 8px var(--cyan);
    animation:blink 1s steps(1) infinite;margin-left:1px;
  }
  @keyframes blink{50%{opacity:0}}

  .foot-note{
    position:fixed;left:0;right:0;bottom:46px;z-index:20;text-align:center;
    font-size:11px;letter-spacing:.08em;color:#39455e;pointer-events:none;
    transition:opacity .4s;
  }
  body.chatting .foot-note{opacity:0}

  /* ============ 底部状态栏 ============ */
  .statusbar{
    position:fixed;left:var(--sbw);right:0;bottom:0;height:40px;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 12px 0 14px;
    background:linear-gradient(to top, rgba(6,9,15,.97), rgba(9,13,22,.78));
    border-top:1px solid rgba(120,160,255,.10);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    transition:left .45s cubic-bezier(.6,0,.3,1);
  }
  .st-left,.st-right{display:flex;align-items:center;gap:6px}
  .st-left{gap:8px;min-width:0}

  .st-logo{
    width:23px;height:23px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    cursor:pointer;transition:transform .25s, box-shadow .3s;
    background:radial-gradient(circle at 34% 26%, #5cf7c8, #17c290 58%, #0b8f6b);
    box-shadow:0 0 14px rgba(43,233,178,.45), inset 0 0 10px rgba(255,255,255,.18);
  }
  .st-logo:hover{transform:translateY(-1px) scale(1.06);box-shadow:0 0 22px rgba(43,233,178,.75)}

  .st-ava{
    width:23px;height:23px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:11px;line-height:1;cursor:pointer;transition:.22s;
    background:rgba(255,255,255,.05);border:1px solid rgba(120,160,255,.20);
  }
  .st-ava:hover{border-color:rgba(53,230,255,.5);transform:translateY(-1px)}

  .st-btn{
    position:relative;width:30px;height:30px;border-radius:8px;border:0;background:transparent;
    display:grid;place-items:center;cursor:pointer;color:#8ea6c9;transition:.22s;
  }
  .st-btn:hover{color:#e6f3ff;background:rgba(120,160,255,.10)}
  .st-btn.on{color:var(--cyan);background:rgba(53,230,255,.12)}
  .st-badge{
    position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;
    background:var(--pink);box-shadow:0 0 8px var(--pink);
    opacity:0;transform:scale(.4);transition:opacity .28s, transform .28s;
  }
  .st-badge.on{opacity:1;transform:none}

  .st-pop{
    position:fixed;right:14px;bottom:52px;z-index:80;width:268px;padding:8px;
    border-radius:12px;background:rgba(12,17,27,.97);
    border:1px solid rgba(120,160,255,.16);
    box-shadow:0 26px 60px -30px #000, 0 0 44px -26px rgba(53,230,255,.8);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;
    transition:opacity .26s, transform .26s;
  }
  .st-pop.on{opacity:1;transform:none;pointer-events:auto}
  .st-pop-hd{
    display:flex;align-items:center;justify-content:space-between;padding:4px 8px 8px;
    font-size:11.5px;color:#7f92b6;letter-spacing:.06em;
  }
  .st-pop-hd button{
    font:inherit;font-size:11px;color:#5f77a0;background:0;border:0;cursor:pointer;transition:.2s;
  }
  .st-pop-hd button:hover{color:#9fe8ff}
  .st-item{
    display:flex;gap:9px;align-items:flex-start;padding:9px 8px;border-radius:9px;
    cursor:pointer;transition:.2s;
  }
  .st-item:hover{background:rgba(120,160,255,.08)}
  .st-item i{width:5px;height:5px;border-radius:50%;margin-top:7px;flex:0 0 auto;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .st-item.read i{background:#2b3549;box-shadow:none}
  .st-item b{display:block;font-size:12.3px;font-weight:500;color:#cfdcf3;line-height:1.5}
  .st-item.read b{color:#8e9db6}
  .st-item span{font-size:10.5px;color:#4d5c78}

  @media (max-width:900px){
    body,body.collapsed{--sbw:0px}
    .sidebar{width:272px;transform:translateX(-100%)}
    body.collapsed .sb-top{height:62px;padding:0 12px 0 18px;flex-direction:row;justify-content:space-between}
    body.collapsed .brand-tx{display:flex}
    body.collapsed .sb-search,
    body.collapsed .grp{display:flex}
    body.collapsed .sb-list,
    body.collapsed .more-link,
    body.collapsed .u-meta{display:block}
    body.collapsed .sb-foot>.icon-btn{display:grid}
    body.collapsed .mi .lbl{display:inline}
    body.collapsed .mi .tag,
    body.collapsed .mi .chev{display:inline-block}
    body.collapsed .sub.open{display:block}
    body.collapsed .discover{margin:0 12px 10px;padding:7px 11px}
    body.collapsed .discover .grow,
    body.collapsed .discover>svg:last-child{display:block}
    body.collapsed .menu{padding:0 10px 4px}
    body.collapsed .mi{justify-content:flex-start;gap:10px;padding:8px 10px}
    body.collapsed .sb-foot{justify-content:flex-start;padding:12px}
    body.collapsed .user{flex:1;padding:6px 8px}
    body.sb-open .sidebar{transform:none;box-shadow:30px 0 80px -40px #000}
    body.sb-open .sb-mask{opacity:1;pointer-events:auto}
    .expand-btn{opacity:1;pointer-events:auto;transform:none}
    body.sb-open .expand-btn{opacity:0;pointer-events:none}
    .topbar{padding-left:58px}
  }
  @media (max-width:640px){
    .dock{transform:translate(-50%, calc(-50vh + 135px))}
    .hero{padding-bottom:230px}
    .tool-pill:nth-child(3){display:none}
    .bubble{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ==================================================================
     视觉重塑 v3：深空蓝黑 + 高对比字体（参照 ChatGPT 暗色界面）
     —— 去网格/粒子/霓虹光晕，改单层柔和渐变；字重与对比全面提升
     ================================================================== */
  :root{
    --bg:#07080f;
    --cyan:#8fb4ff;
    --violet:#8a7bff;
    --pink:#c98bff;
    --txt:#eef1f8;
    --dim:#a9b3c7;
    --glass:rgba(20,24,36,.72);
    --t1:#f2f5fb;
    --t2:#c2cadb;
    --t3:#98a3b8;

    /* ---- 欧拉字体令牌：本页字号 / 字重 / 字体族的唯一取源 ---- */
    --font-sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --font-mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
    --fs-hero:30px;      /* 页面大标题 600 / 45 */
    --fs-title:20px;     /* 页面标题   600 / 30 */
    --fs-card:16px;      /* 卡片标题   600 / 24 */
    --fs-body:14px;      /* 正文       400 / 21 */
    --fs-aux:12px;       /* 辅助文本   400 / 18 */
    --fw-normal:400;
    --fw-medium:500;
    --fw-strong:600;
  }

  /* 字体基座：欧拉字体栈 + 正文 14/21；Windows 用 subpixel 抗锯齿更清晰 */
  body{
    background:#05060b url("agent-bg.jpg") center center / cover no-repeat fixed;
    color:var(--t1);
    font-family:var(--font-sans);
    font-size:var(--fs-body);line-height:1.5;letter-spacing:0;
    -webkit-font-smoothing:subpixel-antialiased;-moz-osx-font-smoothing:auto;
    text-rendering:auto;
  }

  /* ---- 背景：单层大范围冷光，去掉网格 / 粒子 / 束光 ---- */
  #bg,.grid,.beam,.top-glow,.cursor-glow{display:none!important}
  body::before{
    background:
      radial-gradient(30% 30% at 0% 0%, rgba(5,6,11,.94), rgba(5,6,11,0) 72%),
      radial-gradient(92% 62% at 88% 0%, rgba(64,104,255,.24), rgba(64,104,255,0) 62%),
      radial-gradient(58% 48% at 100% 26%, rgba(146,88,255,.16), rgba(146,88,255,0) 68%),
      linear-gradient(180deg, rgba(6,8,14,.80) 0%, rgba(6,8,14,.26) 44%, rgba(5,6,11,.34) 76%, rgba(4,5,9,.66) 100%);
  }
  body::after{
    content:"";position:fixed;left:50%;top:-52vh;width:168vw;height:118vh;z-index:0;
    pointer-events:none;transform:translateX(-46%) rotate(-9deg);border-radius:50%;
    border-top:1.4px solid rgba(168,196,255,.20);
    box-shadow:inset 0 26px 90px -40px rgba(90,130,255,.45);
  }

  /* ---- 顶栏 ---- */
  .topbar{
    height:64px;background:linear-gradient(to bottom, rgba(7,8,15,.94), rgba(7,8,15,0));
    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .tb-title{font-size:14px;color:var(--t3)}
  .brand{gap:9px;letter-spacing:.06em}
  .brand-tx{letter-spacing:.1em}
  .brand-tx b{font-size:13.5px;font-weight:650}
  .brand-tx i{font-size:11px;color:#6f7d97;letter-spacing:.06em}
  .logo-mark{
    width:26px;height:26px;border-radius:50%;background:transparent;
    border:1.5px solid rgba(255,255,255,.82);box-shadow:0 0 18px rgba(140,170,255,.25);
  }
  .logo-mark::after{display:none}
  .logo-mark::before{
    inset:6px;border-radius:50%;background:transparent;
    border:1.5px solid rgba(255,255,255,.82);box-shadow:none;
  }
  .status{font-size:13px;color:var(--t2);border-color:rgba(255,255,255,.10);background:rgba(255,255,255,.04)}
  .status i{background:#63e6a8;box-shadow:0 0 8px rgba(99,230,168,.8)}
  .ghost-btn{font-size:13.5px;color:var(--t2);background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);border-radius:10px}
  .ghost-btn:hover{color:#fff;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}

  /* ---- 侧栏 ---- */
  .sidebar{
    background:rgba(10,12,19,.94);border-right:1px solid rgba(255,255,255,.07);
    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .sidebar::after{display:none}
  .icon-btn{color:#8b96ab}
  .icon-btn:hover{color:#fff;background:rgba(255,255,255,.10);border-color:transparent}
  .sb-search{
    height:38px;border-radius:12px;background:rgba(255,255,255,.05);
    border:1px solid transparent;
  }
  .sb-search:focus-within{border-color:rgba(255,255,255,.20);background:rgba(255,255,255,.07);box-shadow:none}
  .sb-search svg{color:#8b96ab}
  .sb-search input{font-size:14px;color:var(--t1)}
  .sb-search input::placeholder{color:#7b8698}
  .sb-search .kbd{font-size:11px;color:#7b8698;border-color:rgba(255,255,255,.12)}
  .discover{
    font-size:14px;color:var(--t2);border-radius:12px;padding:9px 12px;
    background:rgba(255,255,255,.05);border-color:transparent;
  }
  .discover:hover{color:#fff;background:rgba(255,255,255,.10);border-color:transparent}
  .mi{font-size:14px;color:var(--t2);padding:9px 11px;border-radius:11px}
  .mi:hover{color:#fff;background:rgba(255,255,255,.07)}
  .mi.on{color:#fff;background:rgba(255,255,255,.11);border-color:transparent}
  .mi svg{opacity:.85}
  .mi.on svg{color:#cfe0ff}
  .tag{font-size:11px;color:#c3b6ff;border-color:rgba(160,140,255,.34);background:rgba(140,120,255,.16);letter-spacing:.04em}
  .grp{font-size:13px;font-weight:600;color:#8b96ab;padding:18px 20px 8px}
  .grp span{font-size:12px;font-weight:400;color:#6b768c}
  .grp-sub{font-size:11.5px;color:#6b768c;letter-spacing:.08em}
  .grp-add{color:#8b96ab}
  .grp-add:hover{color:#fff;background:rgba(255,255,255,.12)}
  .conv{font-size:14px;color:var(--t2);padding:10px 12px;border-radius:11px}
  .conv:hover{color:#fff;background:rgba(255,255,255,.07)}
  .conv.on{color:#fff;background:rgba(255,255,255,.12);border-color:transparent}
  .conv.on::before{display:none}
  .conv svg{opacity:.7}
  .conv.on svg{color:#cfe0ff}
  .conv-d{font-size:11.5px;color:#7b8698}
  .conv.on .conv-d{color:#9aa6bb}
  .conv-pin{color:#a9c0ff}
  .conv-more:hover{color:#fff;background:rgba(255,255,255,.14)}
  .conv-rename{font-size:14px;color:#fff;background:rgba(255,255,255,.08);border-bottom-color:rgba(255,255,255,.4)}
  .more-link{font-size:13px;color:#8b96ab}
  .more-link:hover{color:#fff;background:rgba(255,255,255,.07)}
  .spc{font-size:13.5px;color:var(--t2);border-radius:11px;padding:9px 12px}
  .spc:hover{color:#fff;background:rgba(255,255,255,.07)}
  .spc.on{color:#fff;background:rgba(255,255,255,.12);border-color:transparent}
  .spc .n{font-size:11.5px;color:#7b8698}
  .sb-empty{font-size:13px;color:#7b8698}
  .sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
  .sb-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
  .sb-foot{border-top:1px solid rgba(255,255,255,.07)}
  .user:hover{background:rgba(255,255,255,.07)}
  .u-ava{background:linear-gradient(140deg,#a89bff,#6a5cff);color:#fff;box-shadow:none}
  .u-name{font-size:13.5px;color:var(--t1)}
  .u-plan{font-size:11px;color:#7b8698;letter-spacing:.06em}

  /* ---- 发现应用面板 / 卡片 ---- */
  .apps-panel{background:rgba(10,12,19,.99)}
  .apps-hd{border-bottom:1px solid rgba(255,255,255,.07)}
  .apps-hd b{font-size:14px;font-weight:600}
  .apps-hd span{font-size:11px;color:#6b768c;letter-spacing:.08em}
  .apps-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
  .app-card{border-radius:13px;background:rgba(255,255,255,.05);border-color:transparent;color:var(--t2)}
  .app-card:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.14);transform:none}
  .app-card .ic{background:rgba(140,120,255,.18);color:#c3b6ff}
  .app-card b{font-size:13.5px}
  .app-card i{font-size:12px;color:#8b96ab}

  /* ---- 浮层 / 弹窗 / 按钮 ---- */
  .ctx,.st-pop,.modal{
    border-radius:14px;background:rgba(16,18,27,.98);border:1px solid rgba(255,255,255,.10);
    box-shadow:0 32px 70px -30px #000;
    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .ctx-item{font-size:13.5px;color:var(--t2);border-radius:9px}
  .ctx-item:hover{background:rgba(255,255,255,.09);color:#fff}
  .ctx-item.on{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
  .ctx-item.danger{color:#ff9db4}
  .ctx-item.danger:hover{background:rgba(255,120,150,.14)}
  .ctx-item .k{font-size:11.5px;color:#7b8698}
  .ctx-sep{background:rgba(255,255,255,.09)}
  .ctx-hd{font-size:11px;color:#7b8698;letter-spacing:.08em}
  .modal-mask{background:rgba(4,5,9,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .modal h3{font-size:15px;font-weight:600;color:#f2f5fb}
  .modal p{font-size:13.5px;color:var(--t3)}
  .modal input{font-size:14px;color:#f2f5fb;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
  .modal input:focus{border-color:rgba(255,255,255,.28)}
  .btn{font-size:13.5px;border-radius:11px;color:var(--t2);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
  .btn:hover{color:#fff;background:rgba(255,255,255,.12)}
  .btn.primary{background:#f2f5fb;color:#0a0c14;font-weight:650;border-color:transparent;box-shadow:none}
  .btn.danger{color:#ffc2d2;background:rgba(255,120,150,.14);border-color:rgba(255,120,150,.30)}
  .toast{
    font-size:13.5px;color:#f2f5fb;background:rgba(20,24,36,.96);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px -24px #000;border-radius:12px;
  }
  .expand-btn{background:rgba(16,18,27,.92);border-color:rgba(255,255,255,.12);color:#c2cadb;backdrop-filter:none}
  .expand-btn:hover{color:#fff;border-color:rgba(255,255,255,.24);box-shadow:none}

  /* ---- Hero ---- */
  .hero h1{
    margin-top:22px;font-size:clamp(2rem,4.4vw,3.4rem);font-weight:700;
    letter-spacing:-.02em;line-height:1.2;color:#fff;
  }
  .grad{
    background:none;-webkit-background-clip:border-box;background-clip:border-box;
    color:#fff;-webkit-text-fill-color:#fff;filter:none;animation:none;
  }
  .hero p{margin-top:18px;font-size:16px;line-height:1.65;color:var(--dim);max-width:560px}
  .hero-badge{
    font-size:12.5px;letter-spacing:.14em;color:#9fb0cc;
    border:0;background:transparent;padding:0;box-shadow:none;
  }

  /* ---- 输入区：单层胶囊 ---- */
  .composer{
    border-radius:30px;padding:1px;background:rgba(255,255,255,.14);
    box-shadow:0 24px 60px -34px rgba(0,0,0,.9);
    transition:box-shadow .3s,background .3s;
  }
  .composer::after{display:none}
  .composer.focus{background:rgba(255,255,255,.22);box-shadow:0 24px 60px -34px rgba(0,0,0,.9),0 0 0 3px rgba(255,255,255,.05)}
  .composer-in{border-radius:29px;background:rgba(18,21,31,.96);backdrop-filter:none;-webkit-backdrop-filter:none}
  textarea{font-size:16px;line-height:1.6;color:#f2f5fb;padding:17px 20px 6px}
  textarea::placeholder{color:#8b96ab}
  .composer-foot{padding:6px 8px 8px 12px}
  .tool-pill{
    font-size:12.5px;color:#a2aec2;padding:5px 12px;
    border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  }
  .tool-pill:hover{color:#fff;border-color:rgba(255,255,255,.24)}
  .send{width:38px;height:38px;border-radius:50%;background:rgba(139,127,255,.55);color:#fff;box-shadow:none}
  .send:hover{transform:none;background:rgba(150,140,255,.75);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
  .send:active{transform:scale(.95)}
  .chip{
    font-size:13.5px;color:#b6c0d2;padding:9px 16px;
    border-color:rgba(255,255,255,.13);background:rgba(255,255,255,.035);backdrop-filter:none;
  }
  .chip:hover{color:#fff;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08);transform:none;box-shadow:none}

  /* ---- 对话流 ---- */
  .msg{gap:14px;margin-bottom:26px}
  .msg .ava{
    width:30px;height:30px;border-radius:50%;background:transparent;
    border:1.5px solid rgba(255,255,255,.72);box-shadow:none;
  }
  .msg .ava::after{inset:8px;border-radius:50%;background:rgba(255,255,255,.72)}
  .bubble{
    max-width:min(86%,660px);padding:12px 16px;border-radius:18px;
    font-size:15.5px;line-height:1.78;color:#e7ecf6;
  }
  .msg.user .bubble{
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);
    color:#f2f5fb;border-bottom-right-radius:6px;box-shadow:none;
  }
  .msg.bot .bubble{
    background:transparent;border:0;color:#dde4f0;padding:6px 4px 0;
    border-bottom-left-radius:6px;backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .toolcall{
    font-size:12.5px;color:#a9c0e8;padding:5px 11px;border-radius:9px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);
  }
  .toolcall b{color:#dce6f7}
  .toolcall span{color:#8b96ab}
  .dots i{background:#9fb4dd}
  .caret{background:#cfe0ff;box-shadow:none}
  .foot-note{font-size:12px;color:#6b768c;letter-spacing:.06em}

  /* ---- 底部状态栏 ---- */
  .statusbar{
    height:42px;background:rgba(8,10,17,.94);border-top:1px solid rgba(255,255,255,.07);
    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .st-logo{background:linear-gradient(140deg,#8f9bff,#5a63e0);box-shadow:none}
  .st-logo svg{stroke:#0b0d16}
  .st-ava{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}
  .st-btn{color:#9aa6bb}
  .st-btn:hover{color:#fff;background:rgba(255,255,255,.10)}
  .st-btn.on{color:#cfe0ff;background:rgba(255,255,255,.12)}
  .st-badge{background:#ff7aa2;box-shadow:none}
  .st-pop-hd{font-size:12.5px;color:#9aa6bb}
  .st-item:hover{background:rgba(255,255,255,.07)}
  .st-item b{font-size:13.5px;color:#e2e8f4}
  .st-item.read b{color:#9aa6bb}
  .st-item span{font-size:12px;color:#7b8698}
  .st-item i{background:#8fb4ff;box-shadow:none}
  .st-item.read i{background:#3a4356}

  /* ==================================================================
     欧拉字体层（oula-vibe-coding）：字号只取 30 / 20 / 16 / 14 / 12 五档，
     字重只取 400 / 500 / 600 三层。本层位于全部规则之后，是字体唯一生效源，
     上方历史段落的 font-size / font-weight 一律被此层接管
     ================================================================== */

  /* ---- 顶栏 ---- */
  .brand{font-size:var(--fs-body);font-weight:var(--fw-strong)}
  .brand-tx b{font-size:var(--fs-card);font-weight:var(--fw-strong)}
  .brand-tx i{font-size:var(--fs-aux);font-weight:var(--fw-normal)}
  .tb-title{font-size:var(--fs-body);font-weight:var(--fw-normal)}
  .status{font-size:var(--fs-aux)}
  .ghost-btn{font-size:var(--fs-body);font-weight:var(--fw-medium)}

  /* ---- 侧栏 ---- */
  .sb-search input{font-size:var(--fs-body)}
  .sb-search .kbd{font-family:var(--font-mono);font-size:var(--fs-aux)}
  .discover{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .mi{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .tag{font-size:var(--fs-aux);font-weight:var(--fw-normal)}
  .grp{font-size:var(--fs-aux);font-weight:var(--fw-strong)}
  .grp span{font-size:var(--fs-aux);font-weight:var(--fw-normal)}
  .grp-sub{font-size:var(--fs-aux)}
  .conv{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .conv-d{font-size:var(--fs-aux);font-weight:var(--fw-normal)}
  .conv-rename{font-size:var(--fs-body);font-weight:var(--fw-normal)}
  .more-link{font-size:var(--fs-aux)}
  .spc{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .spc .n{font-size:var(--fs-aux);font-weight:var(--fw-normal)}
  .sb-empty{font-size:var(--fs-aux)}
  .u-ava{font-size:var(--fs-aux);font-weight:var(--fw-strong)}
  .u-name{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .u-plan{font-size:var(--fs-aux)}

  /* ---- 发现应用面板 ---- */
  .apps-hd b{font-size:var(--fs-card);font-weight:var(--fw-strong)}
  .apps-hd span{font-size:var(--fs-aux)}
  .app-card b{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .app-card i{font-size:var(--fs-aux)}

  /* ---- 浮层 / 弹窗 / 按钮 ---- */
  .ctx-item{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .ctx-item .k{font-size:var(--fs-aux);font-weight:var(--fw-normal)}
  .ctx-hd{font-size:var(--fs-aux);font-weight:var(--fw-strong)}
  .modal h3{font-size:var(--fs-title);font-weight:var(--fw-strong);line-height:1.5}
  .modal p{font-size:var(--fs-body);line-height:1.5}
  .modal input{font-size:var(--fs-body)}
  .btn{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .btn.primary{font-weight:var(--fw-strong)}
  .toast{font-size:var(--fs-body)}

  /* ---- Hero / 输入区 ---- */
  .hero-badge{font-size:var(--fs-aux);font-weight:var(--fw-medium)}
  .hero h1{font-size:var(--fs-hero);font-weight:var(--fw-strong);line-height:1.5;letter-spacing:0}
  .hero p{font-size:var(--fs-card);line-height:1.5}
  textarea{font-size:var(--fs-body);line-height:1.5}
  .tool-pill{font-size:var(--fs-aux)}
  .chip{font-size:var(--fs-body)}

  /* ---- 对话流 / 底部状态栏 ---- */
  .bubble{font-size:var(--fs-body);line-height:1.5}
  .toolcall{font-family:var(--font-mono);font-size:var(--fs-aux)}
  .foot-note{font-size:var(--fs-aux)}
  .st-ava{font-size:var(--fs-aux);font-weight:var(--fw-medium)}
  .st-pop-hd{font-size:var(--fs-aux)}
  .st-pop-hd button{font-size:var(--fs-aux);font-weight:var(--fw-medium)}
  .st-item b{font-size:var(--fs-body);font-weight:var(--fw-medium)}
  .st-item span{font-size:var(--fs-aux)}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grid"></div>
<div class="top-glow"></div>
<div class="beam l"></div>
<div class="beam r"></div>
<div class="cursor-glow" id="cglow"></div>

<aside class="sidebar" id="sidebar">
  <div class="sb-top">
    <div class="brand">
      <span class="logo-mark"></span>
      <span class="brand-tx"><b>AGENT</b><i>v2.0.0</i></span>
    </div>
    <button class="icon-btn" id="collapseBtn" title="收起侧栏">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>

  <div class="sb-scroll">
    <div class="sb-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="text" placeholder="搜索任务或消息" autocomplete="off" spellcheck="false">
      <span class="kbd">Ctrl K</span>
    </div>

    <button class="discover" data-k="discover" title="发现应用">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
      <span class="grow">发现应用</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <nav class="menu" id="menu">
      <button class="mi on" data-k="newtask" title="新建任务">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span class="lbl">新建任务</span>
      </button>
      <button class="mi" data-k="assistant" title="助理">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M9 12h.01M15 12h.01M12 3v4"/></svg>
        <span class="lbl">助理</span>
        <em class="tag">BETA</em>
      </button>
      <button class="mi" data-k="experts" title="专家 · 技能 · 连接器">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.2 5.3 5.7.5-4.4 3.8 1.3 5.6L12 15.6 7.2 18.7l1.3-5.6L4.1 9.3l5.7-.5z"/></svg>
        <span class="lbl">专家 · 技能 · 连接器</span>
      </button>
      <button class="mi" data-k="cron" title="定时任务">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>
        <span class="lbl">定时任务</span>
      </button>
      <button class="mi" data-k="lib" title="资料库">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 16.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
        <span class="lbl">资料库</span>
      </button>
      <button class="mi" data-k="more" title="更多">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
        <span class="lbl">更多</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="sub" id="moreSub">
        <button class="mi" data-k="setting">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
          <span class="lbl">设置</span>
        </button>
        <button class="mi" data-k="help">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>
          <span class="lbl">帮助与反馈</span>
        </button>
      </div>
    </nav>

    <div class="grp"><em>任务</em><span id="taskCount">(0)</span></div>
    <div class="sb-list" id="sbList"></div>
    <button class="more-link" id="moreLink">查看更多</button>

    <div class="grp">
      <em>空间</em><span id="spaceCount">(0)</span>
      <button class="grp-add" id="spaceNew" title="新建空间">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="sb-list" id="spaceList"></div>
  </div>

  <div class="sb-foot">
    <div class="user" id="userBox">
      <div class="u-ava">A</div>
      <div class="u-meta">
        <div class="u-name">本地工作区</div>
        <div class="u-plan">FREE PLAN</div>
      </div>
    </div>
    <button class="icon-btn" title="设置" data-k="setting">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div class="apps-panel" id="appsPanel">
    <div class="apps-hd">
      <button class="icon-btn" id="appsBack" title="返回">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <b>发现应用</b>
      <span>ALL APPS</span>
    </div>
    <div class="apps-body">
      <div class="apps-grid" id="appsGrid"></div>
    </div>
  </div>
</aside>

<div class="ctx" id="ctx"></div>

<div class="modal-mask" id="modalMask">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">标题</h3>
    <p id="modalDesc"></p>
    <input id="modalInput" type="text" autocomplete="off">
    <div class="modal-foot">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<button class="expand-btn" id="expandBtn" title="展开侧栏">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div class="sb-mask" id="sbMask"></div>

<header class="topbar">
  <div class="tb-title" id="tbTitle">新对话</div>
  <div class="top-right">
    <span class="status"><i></i>在线</span>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <span class="hero-badge">AGENT RUNTIME · v2.0</span>
    <h1>今天想让 <span class="grad">Agent</span> 做点什么？</h1>
